<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090806">
<title>Escuela de Runas · PasaloChévere</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090806;color:#f2e7d4;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(197,139,85,.15),transparent 34rem),linear-gradient(180deg,#15110d,#090806)}
.card{width:min(620px,100%);border:1px solid #513a29;border-radius:26px;padding:30px;background:linear-gradient(145deg,#21170f,#12100d);box-shadow:0 30px 80px rgba(0,0,0,.48);text-align:center}.k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#c58b55;font-weight:800}.rune{font:500 66px Georgia,serif;color:#e0af78;line-height:1;margin:12px 0 4px;text-shadow:0 0 24px rgba(197,139,85,.18)}h1{font:500 clamp(34px,7vw,56px)/1.05 Georgia,serif;margin:4px 0 10px}.sub{color:#aa967d;line-height:1.6}.status{margin:20px 0 8px;color:#cbb69a;line-height:1.55}.btn{display:inline-flex;margin-top:12px;padding:11px 15px;border:1px solid #765035;border-radius:12px;background:#724c2f;color:#fff1dc;text-decoration:none;font-weight:800}.small{margin-top:16px;color:#756856;font-size:11px;line-height:1.45}
#school{display:none;width:100%;height:100%;border:0;background:#090806}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main id="gate"><section class="card"><div class="k">PasaloChévere · Acceso personal</div><div class="rune">ᛉ</div><h1>Escuela de Runas</h1><div class="sub">Guía Interactiva · Elder Futhark</div><div id="status" class="status">Validando tu acceso…</div><a id="portal" class="btn" href="../portal-v2/" style="display:none">Ir al Portal PasaloChévere</a><div class="small">Tu acceso se valida con la misma cuenta y código de activación que usás en el Portal.</div></section></main>
<iframe id="school" title="Escuela de Runas" allow="fullscreen"></iframe>
<script>
(()=>{
 const SUPABASE_URL='https://fzbndgfnqxcacsvlitui.supabase.co';
 const SUPABASE_KEY='sb_publishable_bJ91vnQUWHfFqWRO99fFkQ_dh0icDxo';
 const PRODUCT='RUNAS-24';
 const DEVICE_KEY='pc_device_id';
 const PORTAL='../portal-v2/';
 const RUNTIME='school-runtime-rc1.html';
 const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
 const status=document.getElementById('status'),portal=document.getElementById('portal'),gate=document.getElementById('gate'),school=document.getElementById('school');
 const params=new URLSearchParams(location.search);const access=(params.get('access')||'').trim();
 function deviceId(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v=(crypto.randomUUID?crypto.randomUUID():'dev_'+Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem(DEVICE_KEY,v)}return v}
 function deviceLabel(){return [navigator.platform||'',navigator.userAgent.includes('Mobile')?'Mobile':'Browser'].filter(Boolean).join(' · ').slice(0,150)}
 function fail(message,delay=900){status.textContent=message;portal.style.display='inline-flex';if(delay)setTimeout(()=>location.replace(PORTAL),delay)}
 async function validate(){
   if(!access){location.replace(PORTAL);return}
   try{
     const {data:{session}}=await sb.auth.getSession();
     if(!session?.user?.email||session.user.is_anonymous){fail('Necesitás ingresar al Portal con el correo verificado para usar este acceso.');return}
     const {data,error}=await sb.functions.invoke('pasalochevere-access',{body:{action:'register_device',activation_code:access,device_id:deviceId(),device_label:deviceLabel()}});
     if(error){let t=error.message;try{t=(await error.context?.json())?.error||t}catch{}throw new Error(t)}
     if(!data?.ok)throw new Error(data?.error||'No se pudo validar el acceso.');
     if(String(data.license?.product_code||'').toUpperCase()!==PRODUCT)throw new Error('Este código pertenece a otro producto.');
     status.textContent='Acceso validado. Abriendo la Escuela…';
     school.src=RUNTIME+'?access='+encodeURIComponent(access);
     school.addEventListener('load',()=>{gate.style.display='none';school.style.display='block'},{once:true});
   }catch(e){fail(e?.message||'No se pudo validar este acceso.',0)}
 }
 validate();
})();
</script>
</body></html>
