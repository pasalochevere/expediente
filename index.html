const CASE_LICENSE_STORAGE='expedientes_case001_license_v2';
const PC_DEVICE_STORAGE='pc_device_id';
let caseLicense=null;
let caseLicenseTimer=null;
function licenseKeyNorm(v){return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'')}
function pcDeviceId(){let v=localStorage.getItem(PC_DEVICE_STORAGE);if(!v){v=(crypto.randomUUID?crypto.randomUUID():'dev_'+Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem(PC_DEVICE_STORAGE,v)}return v}
function licenseSecondsLeft(){return caseLicense?.expires_at?Math.max(0,Math.floor((new Date(caseLicense.expires_at).getTime()-Date.now())/1000)):0}
function hasActiveCaseLicense(){return !!(caseLicense?.active && licenseSecondsLeft()>0)}
function licenseTimeLabel(sec){sec=Math.max(0,Number(sec||0));let d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60);if(d>0)return `${d} día${d===1?'':'s'} · ${h} h`;return `${h} h ${String(m).padStart(2,'0')} min`}
function setLicenseMessage(msg,bad=false){let el=$('licenseMessage');if(el){el.textContent=msg;el.style.color=bad?'#ffaaa4':'#bba990'}}
function renderCaseLicense(){
  let pill=$('licensePill'),entry=$('licenseEntry'),box=$('licenseActiveBox');
  if(!pill||!entry||!box)return;
  if(hasActiveCaseLicense()){
    let left=licenseSecondsLeft();pill.className='license-pill active';pill.textContent='● Acceso activo';entry.classList.add('hidden');box.classList.remove('hidden');
    box.innerHTML=`<b>✅ Caso 001 habilitado</b><br>Tiempo restante: <b>${licenseTimeLabel(left)}</b><br><small>Vence: ${new Date(caseLicense.expires_at).toLocaleString()}</small><br><button class="ghost" style="margin-top:9px" onclick="location.href='portal/'">Mi cuenta / Mis juegos</button>`
  }else{
    if(caseLicense?.expires_at){pill.className='license-pill expired';pill.textContent='● Acceso vencido';setLicenseMessage('Este acceso ya venció. Revisá tu cuenta en el Portal PasaloChevere.',true)}
    else{pill.className='license-pill';pill.textContent='● Sin acceso'}
    entry.classList.remove('hidden');box.classList.add('hidden')
  }
  let createBtn=document.querySelector('#multiSetup .multi-card:first-child button.primary');
  if(createBtn){createBtn.classList.toggle('locked-action',!hasActiveCaseLicense());createBtn.textContent=hasActiveCaseLicense()?'Crear sala':'🔒 Ingresá desde el Portal para crear sala'}
}
async function invokeLicense(action,key){
  await ensureExpSession();
  let {data,error}=await expSb.functions.invoke('expediente-license',{body:{action,license_key:licenseKeyNorm(key)}});
  if(error)throw new Error(await functionErrorText(error));
  if(!data?.ok)throw new Error(data?.error||'No se pudo validar el acceso.');
  return data;
}
async function restoreCaseLicense(){
  let urlKey=licenseKeyNorm(new URLSearchParams(location.search).get('access')||'');
  if(urlKey){localStorage.setItem(CASE_LICENSE_STORAGE,urlKey);history.replaceState(null,'',location.pathname)}
  let key=licenseKeyNorm(localStorage.getItem(CASE_LICENSE_STORAGE)||'');
  if(!key){caseLicense=null;renderCaseLicense();return}
  try{
    let data=await invokeLicense('status',key);
    if(data?.active){caseLicense={...data,license_key:key};setLicenseMessage('Acceso validado desde tu cuenta PasaloChevere.')}
    else caseLicense=null;
  }catch(e){
    caseLicense={active:false,license_key:key,expires_at:null};
    setLicenseMessage(backendErrorText(e)+' Ingresá nuevamente desde el Portal PasaloChevere.',true)
  }
  renderCaseLicense();
}
function forgetCaseLicense(){localStorage.removeItem(CASE_LICENSE_STORAGE);caseLicense=null;renderCaseLicense();location.href='portal/'}
function requireCaseLicense(){if(hasActiveCaseLicense())return true;goHome();renderCaseLicense();setLicenseMessage('Ingresá desde el Portal PasaloChevere para usar esta función.',true);return false}

const _accessShowDigital=showDigitalSetup,_accessShowDetective=showDetectiveSetup,_accessShowImpostor=showImpostorSetup,_accessShowPrint=showPrintCenter;
showDigitalSetup=function(){if(!requireCaseLicense())return;_accessShowDigital()};
showDetectiveSetup=function(){if(!requireCaseLicense())return;_accessShowDetective()};
showImpostorSetup=function(){if(!requireCaseLicense())return;_accessShowImpostor()};
showPrintCenter=function(){if(!requireCaseLicense())return;_accessShowPrint()};

createDemoRoom=async function(){
  if(!requireCaseLicense())return;
  try{
    await ensureExpSession();
    let name=$('mhName').value.trim()||'Jugador 1',char=+$('mhChar').value,roomMode=$('mhMode').value;
    let {data,error}=await expSb.functions.invoke('expediente-create-room',{body:{license_key:caseLicense.license_key,device_id:pcDeviceId(),display_name:name,character_index:char,mode:roomMode}});
    if(error)throw new Error(await functionErrorText(error));if(!data?.ok)throw new Error(data?.error||'No se pudo crear la sala.');
    let room=data.room,pl=data.player;multiRoomId=room.id;multiPlayerId=pl.id;multiIsHost=true;saveLastRoom(room.code);await subscribeRealRoom(room.id);await refreshRealRoom();openLobby();startMultiFallback();
  }catch(e){alert('No pude crear la sala. '+backendErrorText(e))}
};

const _accessPrintPack=printPack,_accessDownloadPDF=downloadPackPDF;
printPack=function(kind,bw){if(!requireCaseLicense())return;return _accessPrintPack(kind,bw)};
downloadPackPDF=async function(kind,bw,btn){if(!requireCaseLicense())return;return await _accessDownloadPDF(kind,bw,btn)};

async function initAccessPortal(){
  await restoreCaseLicense();
  if(caseLicenseTimer)clearInterval(caseLicenseTimer);
  caseLicenseTimer=setInterval(()=>{if(caseLicense?.active && licenseSecondsLeft()<=0){caseLicense.active=false;renderCaseLicense()}else if(caseLicense?.active)renderCaseLicense()},60000);
}
setTimeout(initAccessPortal,0);
