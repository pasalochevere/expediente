name: Admin duration patch v2
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/admin-duration-patch-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean admin duration duplicates
        run: python scripts/patch_admin_duration.py
      - name: Commit admin UI cleanup
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add admin-licencias/index.html
          git diff --cached --check
          git commit -m "Admin licenses: clean duration UI duplicates"
          git push
# trigger cleanup
