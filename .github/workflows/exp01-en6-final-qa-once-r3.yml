name: EXP01 EN6 Final Bilingual Release QA R3
on:
  push:
    paths:
      - '.github/workflows/exp01-en6-final-qa-once-r3.yml'
permissions:
  contents: write
  actions: read
jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply EN6 continuity hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caso001/printables/i18n-en5.js')
          s=p.read_text(encoding='utf-8')
          if "GLOBAL_STORAGE_KEY='expedientes_language'" not in s:
              s=s.replace("const STORAGE_KEY='expedientes.c001.printables.lang';\nconst VALID_LANGS=new Set(['es','en']);","const STORAGE_KEY='expedientes.c001.printables.lang';\nconst GLOBAL_STORAGE_KEY='expedientes_language';\nconst VALID_LANGS=new Set(['es','en']);",1)
              s=s.replace("if(persist){try{localStorage.setItem(STORAGE_KEY,next)}catch{}}","if(persist){try{localStorage.setItem(STORAGE_KEY,next);localStorage.setItem(GLOBAL_STORAGE_KEY,next)}catch{}}",1)
              s=s.replace("  try{\n    const stored=localStorage.getItem(STORAGE_KEY);\n    if(VALID_LANGS.has(stored)) return stored;\n  }catch{}\n  return 'es';","  try{\n    const globalStored=localStorage.getItem(GLOBAL_STORAGE_KEY);\n    if(VALID_LANGS.has(globalStored)) return globalStored;\n    const stored=localStorage.getItem(STORAGE_KEY);\n    if(VALID_LANGS.has(stored)) return stored;\n  }catch{}\n  return 'es';",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check caso001/printables/i18n-en5.js
          grep -q "GLOBAL_STORAGE_KEY='expedientes_language'" caso001/printables/i18n-en5.js
          git diff --check

      - name: Install QA runtime
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Local end-to-end bilingual gate
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en6-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173/ node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const BASE=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const checks=[]; const errors=[];
          const ok=(c,n,d='')=>{if(!c)throw new Error(`${n}: ${d}`);checks.push([n,true,d])};
          const watch=p=>p.on('pageerror',e=>errors.push(String(e)));

          const portal=await context.newPage(); watch(portal);
          await portal.goto(BASE+'portal-v2/',{waitUntil:'domcontentloaded',timeout:60000});
          await portal.waitForFunction(()=>typeof gameHref==='function',{timeout:20000});
          const route=await portal.evaluate(()=>gameHref({game_url:'x',product_code:'EXP-001',activation_code:'EXP01-EN6-QA'}));
          ok(route.includes('../caso001/intro/?access=EXP01-EN6-QA'),'portal→intro route',route);
          await portal.close();

          const page=await context.newPage(); watch(page);
          await page.goto(BASE+'caso001/intro/?access=EXP01-EN6-QA&room=EN6ROOM&lang=en',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await page.waitForTimeout(500);
          const intro=await page.evaluate(()=>({
            text:document.body.textContent||'',
            portraits:[...document.querySelectorAll('.person img')].map(x=>x.getAttribute('src')||''),
            notebook:[...document.querySelectorAll('.ev img')].map(x=>x.getAttribute('src')||'').find(x=>x.includes('cuaderno'))||''
          }));
          ok(intro.text.includes('One meeting.')&&intro.text.includes('Six identities.'),'intro EN narrative');
          ok(intro.portraits.filter(x=>x.includes('assets-en/')).length===6,'intro EN portraits',JSON.stringify(intro.portraits));
          ok(intro.notebook.includes('assets-en/'),'intro EN notebook',intro.notebook);

          await Promise.all([
            page.waitForURL(u=>u.pathname.endsWith('/caso001/')&&u.searchParams.get('skipintro')==='1',{timeout:30000}),
            page.click('#skipBtn')
          ]);
          const h=new URL(page.url());
          ok(h.searchParams.get('access')==='EXP01-EN6-QA'&&h.searchParams.get('room')==='EN6ROOM'&&h.searchParams.get('lang')==='en'&&h.searchParams.get('intro')==='v10','intro→game params',h.search);
          await page.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await page.waitForSelector('#tabCreate',{state:'attached',timeout:20000});
          await page.waitForTimeout(700);
          let game=await page.evaluate(()=>({lang:document.documentElement.lang,stored:localStorage.getItem('expedientes_language'),title:document.querySelector('.revTitleRow h1')?.textContent?.trim()||'',create:document.getElementById('tabCreate')?.textContent?.trim()||''}));
          ok(game.lang==='en'&&game.stored==='en'&&game.title==='The Last Meeting'&&/Create room/i.test(game.create),'game EN shell',JSON.stringify(game));

          const upper=await page.evaluate(()=>{
            const lower=document.getElementById('enterRoom'),create=document.getElementById('tabCreate'),join=document.getElementById('tabJoin');
            lower.disabled=false;let hits=0;
            lower.addEventListener('click',e=>{hits++;e.preventDefault();e.stopImmediatePropagation();},true);
            if(!create.classList.contains('active'))create.click();
            create.click();const c=hits;
            join.click();const s=hits;
            lower.disabled=false;join.click();
            return {c,s,f:hits,joinActive:join.classList.contains('active')};
          });
          ok(upper.c>=1&&upper.s===upper.c&&upper.f>upper.s&&upper.joinActive,'upper Create/Join wiring',JSON.stringify(upper));

          await page.evaluate(()=>{localStorage.setItem('pc_exp_rev01_theory_v1','EN6-THEORY');localStorage.setItem('pc_exp_p2_last_room','EN6-ROOM');});
          await page.evaluate(()=>[...document.querySelectorAll('[data-exp-lang="es"]')].find(x=>x.offsetParent!==null)?.click());
          await page.waitForFunction(()=>document.documentElement.lang==='es');
          game=await page.evaluate(()=>({title:document.querySelector('.revTitleRow h1')?.textContent?.trim()||'',create:document.getElementById('tabCreate')?.textContent?.trim()||'',theory:localStorage.getItem('pc_exp_rev01_theory_v1'),room:localStorage.getItem('pc_exp_p2_last_room')}));
          ok(game.title==='La Última Reunión'&&/Crear sala/i.test(game.create)&&game.theory==='EN6-THEORY'&&game.room==='EN6-ROOM','game EN→ES preserves state',JSON.stringify(game));
          await page.evaluate(()=>[...document.querySelectorAll('[data-exp-lang="en"]')].find(x=>x.offsetParent!==null)?.click());
          await page.waitForFunction(()=>document.documentElement.lang==='en');

          const print=await context.newPage(); watch(print);
          await print.goto(BASE+'caso001/printables/',{waitUntil:'domcontentloaded',timeout:60000});
          await print.waitForSelector('#printLang',{timeout:20000});
          await print.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await print.waitForTimeout(700);
          let ps=await print.evaluate(()=>({lang:document.documentElement.lang,select:document.getElementById('printLang')?.value,global:localStorage.getItem('expedientes_language'),pages:document.querySelectorAll('.page').length,title:document.title,swaps:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('assets-en/')).length,broken:[...document.images].filter(x=>!x.complete||x.naturalWidth===0).length}));
          ok(ps.lang==='en'&&ps.select==='en'&&ps.global==='en'&&ps.pages===8&&ps.title.includes('The Last Meeting'),'printables inherit EN',JSON.stringify(ps));
          ok(ps.swaps===7&&ps.broken===0,'printables EN assets',JSON.stringify(ps));
          await print.selectOption('#printLang','es');
          await print.waitForFunction(()=>document.documentElement.lang==='es');
          ps=await print.evaluate(()=>({lang:document.documentElement.lang,global:localStorage.getItem('expedientes_language'),legacy:localStorage.getItem('expedientes.c001.printables.lang'),pages:document.querySelectorAll('.page').length,swaps:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('assets-en/')).length}));
          ok(ps.lang==='es'&&ps.global==='es'&&ps.legacy==='es'&&ps.pages===8&&ps.swaps===0,'printables ES sync/restore',JSON.stringify(ps));
          ok(errors.length===0,'local no JS errors',JSON.stringify(errors));
          console.log('EXP01_EN6_LOCAL_PASS',JSON.stringify({checks},null,2));
          await print.close();await page.close();await context.close();await browser.close();
          NODE

      - name: Commit continuity fix
        id: fix
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/printables/i18n-en5.js
          git diff --cached --check
          git commit -m 'EXP01-EN6 sync printables with global language preference'
          for a in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort || true;sleep 2
          done
          exit 1

      - name: Wait for fix deployment
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            D="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?head_sha=${FIX_SHA}&per_page=3")"
            S="$(printf '%s' "$D"|jq -r '.workflow_runs[0].status//"missing"')";C="$(printf '%s' "$D"|jq -r '.workflow_runs[0].conclusion//""')";echo "Pages $S $C"
            if [ "$S" = completed ]; then test "$C" = success;exit 0;fi;sleep 5
          done
          exit 1

      - name: Public final smoke
        env:
          BASE_URL: https://pasalochevere.github.io/expediente/
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const B=process.env.BASE_URL,b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']}),c=await b.newContext({viewport:{width:1280,height:900}}),errs=[];
          const ok=(x,n,d='')=>{if(!x)throw new Error(`${n}: ${d}`)};const watch=p=>p.on('pageerror',e=>errs.push(String(e)));
          const portal=await c.newPage();watch(portal);await portal.goto(B+'portal-v2/',{waitUntil:'domcontentloaded',timeout:60000});await portal.waitForFunction(()=>typeof gameHref==='function',{timeout:20000});const r=await portal.evaluate(()=>gameHref({game_url:'x',product_code:'EXP-001',activation_code:'EXP01-EN6-QA'}));ok(r.includes('../caso001/intro/?access=EXP01-EN6-QA'),'portal route',r);await portal.close();
          const p=await c.newPage();watch(p);await p.goto(B+'caso001/intro/?access=EXP01-EN6-QA&room=EN6ROOM&lang=en',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForTimeout(500);ok((await p.evaluate(()=>document.body.textContent||'')).includes('One meeting.'),'intro EN');await Promise.all([p.waitForURL(u=>u.pathname.endsWith('/caso001/')&&u.searchParams.get('lang')==='en',{timeout:30000}),p.click('#skipBtn')]);await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForTimeout(500);ok((await p.locator('.revTitleRow h1').textContent())?.trim()==='The Last Meeting','game EN');ok(await p.evaluate(()=>localStorage.getItem('expedientes_language'))==='en','global EN');
          const pr=await c.newPage();watch(pr);await pr.goto(B+'caso001/printables/',{waitUntil:'domcontentloaded',timeout:60000});await pr.waitForSelector('#printLang',{timeout:20000});await pr.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await pr.waitForTimeout(700);const s=await pr.evaluate(()=>({lang:document.documentElement.lang,sel:document.getElementById('printLang')?.value,pages:document.querySelectorAll('.page').length,title:document.title,swaps:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('assets-en/')).length,broken:[...document.images].filter(x=>!x.complete||x.naturalWidth===0).length}));ok(s.lang==='en'&&s.sel==='en'&&s.pages===8&&s.title.includes('The Last Meeting')&&s.swaps===7&&s.broken===0,'public printables EN',JSON.stringify(s));
          const m=await b.newContext({viewport:{width:390,height:844}});for(const [n,u,sel] of [['Intro',B+'caso001/intro/?lang=en','[data-exp-lang="en"]:visible'],['Game',B+'caso001/?skipintro=1&lang=en','[data-exp-lang="en"]:visible'],['Print',B+'caso001/printables/?lang=en','#printLang']]){const q=await m.newPage();watch(q);await q.goto(u,{waitUntil:'domcontentloaded',timeout:60000});await q.waitForSelector(sel,{timeout:20000});const z=await q.locator(sel).first().boundingBox();ok(z&&z.x>=0&&z.x+z.width<=390&&z.y>=0&&z.y<844,'mobile '+n,JSON.stringify(z));await q.close()}await m.close();ok(errs.length===0,'public no JS errors',JSON.stringify(errs));console.log('EXP01_EN6_PUBLIC_PASS');await pr.close();await p.close();await c.close();await b.close();
          NODE

      - name: Freeze release and self-clean
        run: |
          set -euo pipefail
          cat > caso001/EXP01_EN6_AUDIT.md <<'EOF'
          # EXP01-EN6 · Final Bilingual Release QA · ES / EN

          Estado: **PASS · release bilingüe final validado sobre build local y GitHub Pages público; checkpoint congelado**.

          ## Hallazgo EN6 y corrección

          El gate final detectó que el juego guardaba idioma en `expedientes_language` mientras EN5 conservaba para Printables una preferencia específica (`expedientes.c001.printables.lang`). En una primera apertura del kit podía perderse la continuidad visual del idioma elegido en el juego.

          EN6 unifica la experiencia de presentación: Printables usa `?lang` como prioridad, luego `expedientes_language`, y conserva la clave EN5 como fallback de compatibilidad. Cuando el usuario cambia idioma en el kit se sincronizan ambas claves.

          ## Recorrido final PASS

          - Portal EXP-001 → Cinema Intro.
          - Cinema Intro ES/EN, contenido EN y assets EN.
          - Handoff conserva `access`, `room`, `lang`, `skipintro=1` e `intro=v10`.
          - Juego EN y reversión EN→ES→EN sin pérdida de estado local.
          - Wiring superior Crear/Unirse validado en navegador sin ejecutar acción server-side.
          - Printables heredan EN del juego, conservan 8 páginas y 7 variantes visuales EN; al volver a ES sincronizan preferencias y restauran assets ES.
          - Mobile 390×844 con controles de idioma visibles en Intro, Juego y Printables.
          - Sin errores JavaScript en los gates.
          - QA local PASS y QA público PASS después del deploy del mismo fix.

          ## Seguridad

          No se modificaron Crime Packs, Edge Functions, room state, timers, licencias, roles ni payloads multiplayer. Continúan vigentes EN1–EN5 y el smoke autenticado previo del core Impostor con 3 jugadores reales.

          ## Freeze

          **EXP01-EN1 → EXP01-EN6: PASS.** La capa bilingüe de Caso 001 queda congelada como checkpoint de producción.
          EOF
          cat >> caso001/RELEASE.txt <<'EOF'
          Final bilingual checkpoint: EXP01-EN6 · Final Bilingual Release QA PASS
          EN6 continuity fix: Printables inherit global `expedientes_language`; legacy EN5 key remains as fallback and both keys synchronize on printable language changes
          Final path QA: Portal EXP-001 → Cinema Intro → game → printables PASS locally and on public GitHub Pages
          Final handoff QA: access/room/lang/skipintro/intro-v10 preserved
          Final control QA: upper Create/Join wiring PASS without server action
          Final mobile QA: language controls visible at 390x844 on Intro, game and printables
          Final safety: theory/last-room local state preserved · multiplayer remains language-agnostic
          Bilingual release freeze: EXP01-EN1 through EXP01-EN6 PASS · production checkpoint frozen
          EOF
          rm -f package.json package-lock.json
          git rm -f .github/workflows/exp01-en6-final-qa-once.yml .github/workflows/exp01-en6-final-qa-once-r2.yml .github/workflows/exp01-en6-final-qa-once-r3.yml
          git config user.name 'lunchpack-arg';git config user.email 'pasalochevere@gmail.com'
          git add caso001/EXP01_EN6_AUDIT.md caso001/RELEASE.txt
          git diff --cached --check
          git commit -m 'EXP01-EN6 freeze final bilingual release QA'
          for a in 1 2 3 4 5;do git fetch origin main;if git rebase origin/main&&git push origin HEAD:main;then exit 0;fi;git rebase --abort||true;sleep 2;done
          exit 1
