name: Chévere Kids Visual V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chevere-kids-visual-v2.yml'

permissions:
  contents: write

jobs:
  visual-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual V2, cinematic intro and premium printables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('torre-kids-matematica/index.html')
          s=p.read_text(encoding='utf-8')

          if 'CHÉVERE KIDS VISUAL V2' not in s:
            css=r'''
/* === CHÉVERE KIDS VISUAL V2 · CINEMA + UI + PRINTABLES === */
