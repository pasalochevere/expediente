            s=re.sub(r'function showPrint\(\)\{.*?\n\}\n\nfunction pdfSetup',showprint,s,count=1,flags=re.S)

            pdfsetup=r'''function pdfSetup(title,subtitle){
 const {jsPDF}=window.jspdf; const d=new jsPDF({unit:'mm',format:'a4'}); const W=210,H=297;
 function brand(){
   d.setFont('helvetica','bold');d.setFontSize(11);d.setTextColor(16,42,86);d.text('CHÉVERE',16,14);
   d.setTextColor(239,79,79);d.text('K',49,14);d.setTextColor(241,190,42);d.text('I',53,14);d.setTextColor(45,135,232);d.text('D',55.5,14);d.setTextColor(43,182,115);d.text('S',60.5,14);
   d.setTextColor(16,42,86);d.setFontSize(8);d.text('· MATEMÁTICA',67,14);
   d.setFillColor(255,244,216);d.roundedRect(158,7,36,11,5,5,'F');d.setTextColor(176,101,32);d.setFontSize(7.2);d.text('7–9 AÑOS',176,14,{align:'center'});
 }
 function pageHead(t=title,st=subtitle){
   d.setFillColor(255,250,241);d.rect(0,0,W,H,'F');
   d.setFillColor(234,247,255);d.circle(196,38,28,'F');d.setFillColor(255,240,202);d.circle(8,72,24,'F');
   brand();d.setDrawColor(236,223,204);d.line(16,22,194,22);
   d.setTextColor(16,42,86);d.setFont('helvetica','bold');d.setFontSize(24);d.text(t,16,38);
   if(st){d.setTextColor(101,105,111);d.setFont('helvetica','normal');d.setFontSize(10);d.text(d.splitTextToSize(st,166),16,47);}
   d.setFillColor(255,107,44);d.roundedRect(16,52,34,3,1.5,1.5,'F');
 }
 function foot(n){d.setDrawColor(230,218,201);d.line(16,282,194,282);d.setFont('helvetica','bold');d.setFontSize(7.5);d.setTextColor(16,42,86);d.text('JUGAR · EXPLORAR · APRENDER · CRECER',16,289);d.setFont('helvetica','normal');d.setTextColor(110,110,110);d.text('Matemática para la vida · Página '+n,194,289,{align:'right'});}
 function wrap(text,x,y,w,fs=9.2,lh=4.6,bold=false){d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(fs);const lines=d.splitTextToSize(String(text),w);d.text(lines,x,y);return y+lines.length*lh;}
 return {d,pageHead,foot,wrap,W,H};
}
