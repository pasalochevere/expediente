name: Chévere Kids Visual V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chevere-kids-visual-v2.yml'

permissions:
  contents: write

jobs:
  visual-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual migration
        run: python3 scripts/chevere_kids_visual_v2.py
      - name: Check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('torre-kids-matematica/index.html').read_text(encoding='utf-8')
          blocks=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)]
          Path('/tmp/tk-v2.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('Inline JS blocks:',len(blocks))
          PY
          node --check /tmp/tk-v2.js
      - name: Commit V2
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade Chévere Kids visual V2 cinematic intro and printables"
            git push
          fi
