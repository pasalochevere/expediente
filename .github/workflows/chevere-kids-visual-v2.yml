 roundedCard(d,110,64,84,78,[234,247,255],[190,222,244]);circleBadge(d,123,78,PDFCOLORS.azul,'24');d.setTextColor(16,42,86);d.setFont('helvetica','bold');d.setFontSize(14);d.text('SOLO DIGITAL',118,96);d.setFont('helvetica','normal');d.setTextColor(95,95,95);d.setFontSize(9.2);d.text(d.splitTextToSize('El portal sortea pieza, color y desafío. Ideal para jugar en cualquier lugar sin elementos físicos.',67),118,108);
 d.setTextColor(16,42,86);d.setFont('helvetica','bold');d.setFontSize(13);d.text('Las 6 categorías',16,164);const order=['rojo','verde','azul','amarillo','fucsia','negro'];order.forEach((c,i)=>{const x=25+i*30;circleBadge(d,x,182,PDFCOLORS[c],PDFGLYPH[c]);d.setTextColor(16,42,86);d.setFontSize(7.4);d.text(LABEL[c],x,194,{align:'center'});});
 roundedCard(d,18,215,174,38,[255,252,245],[235,222,203]);d.setTextColor(16,42,86);d.setFontSize(11);d.text('Estrellas',28,230);d.setTextColor(241,190,42);d.setFontSize(18);d.text('★ ★ ★',28,243);d.setTextColor(95,95,95);d.setFontSize(8.5);d.text('2 sin pista · 1 con pista · hasta 3 en Súper desafío',78,240);
