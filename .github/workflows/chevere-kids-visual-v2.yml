.cinema-intro{position:fixed;inset:0;z-index:9999;overflow:hidden;background:radial-gradient(circle at 50% 16%,#fff3b7 0 8%,transparent 26%),linear-gradient(180deg,#77c7ff 0%,#a9e0ff 32%,#fff1c8 68%,#fffaf1 100%);display:grid;place-items:center;color:white}
.cinema-intro.hidden{display:none!important}.cinema-intro:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 15% 22%,#fff8 0 3%,transparent 3.5%),radial-gradient(circle at 76% 15%,#fff8 0 2%,transparent 2.5%),radial-gradient(circle at 55% 38%,#fff5 0 2%,transparent 2.3%);animation:cinemaDrift 10s ease-in-out infinite alternate}.cinema-glow{position:absolute;inset:0;background:linear-gradient(180deg,#0a2a5a00 0%,#17385d12 45%,#0a254066 100%);pointer-events:none}.cinema-scene{position:relative;width:min(1120px,96vw);height:min(820px,94vh);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:22px;padding:28px}.cinema-copy{position:relative;z-index:4;text-shadow:0 3px 22px #14375b55}.cinema-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:#ffffffd9;color:#214266;font-size:.8rem;font-weight:900;letter-spacing:.11em;box-shadow:0 10px 28px #23445c26}.cinema-copy .tk-logo{width:min(470px,84vw);margin:18px 0 10px;filter:drop-shadow(0 18px 30px #23445d44)}.cinema-copy h2{font-size:clamp(2.3rem,6vw,5.6rem);line-height:.92;margin:12px 0;color:white;letter-spacing:-.045em}.cinema-copy p{font-size:clamp(1rem,2vw,1.3rem);font-weight:750;max-width:520px;color:#fff}.cinema-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.cinema-actions .btn{min-width:185px}.cinema-enter{background:linear-gradient(135deg,#ff8c2f,#ff4e36)!important;box-shadow:0 10px 0 #d8402c,0 18px 35px #d7442f55!important}.cinema-skip{background:#ffffffde!important;color:#17355d!important;border:1px solid #fff!important}.cinema-world{position:relative;height:100%;display:grid;place-items:end center}.cinema-world:before{content:"";position:absolute;left:10%;right:8%;bottom:11%;height:58%;background:radial-gradient(ellipse at center,#fff8c9 0 17%,#ffd46155 32%,transparent 68%);filter:blur(3px)}.cinema-world .mascot{position:absolute;left:4%;bottom:9%;width:min(255px,34vw);z-index:5;animation:mascotFloat 3s ease-in-out infinite}.cinema-tower{position:absolute;right:5%;bottom:8%;width:310px;z-index:3;transform:rotate(1deg);filter:drop-shadow(0 26px 28px #18426740)}.cinema-tower .row{margin:4px 0}.cinema-tower .bl{height:36px;width:92px;font-size:.78rem;background:linear-gradient(180deg,#f9ddb7,#d79755);border-color:#bd7b3d}.cinema-symbols{position:absolute;inset:0;pointer-events:none}.cinema-symbols span{position:absolute;font-weight:950;filter:drop-shadow(0 10px 18px #2d557d42);animation:floatSymbol 4.5s ease-in-out infinite}.cinema-symbols .s1{left:10%;top:13%;font-size:4rem;color:#2d87e8}.cinema-symbols .s2{left:25%;top:8%;font-size:4.4rem;color:#ffc229;animation-delay:-1s}.cinema-symbols .s3{right:24%;top:9%;font-size:4.7rem;color:#2bb673;animation-delay:-2s}.cinema-symbols .s4{right:11%;top:19%;font-size:4.3rem;color:#ef4f4f;animation-delay:-.6s}.cinema-star{position:absolute;color:#ffd63d;font-size:2.3rem;animation:twinkle 1.8s ease-in-out infinite}.cinema-star.a{left:46%;top:13%}.cinema-star.b{right:8%;top:39%;animation-delay:-.8s}.cinema-star.c{left:8%;bottom:14%;animation-delay:-1.2s}.cinema-tagline{position:absolute;right:3%;top:8%;background:#fff7c8;color:#254369;border-radius:10px;padding:11px 14px;font-weight:900;transform:rotate(4deg);box-shadow:0 11px 25px #3451702b}.cinema-close{position:absolute;top:18px;right:18px;z-index:8;border:1px solid #ffffff9b;background:#ffffffd4;color:#17365d;border-radius:999px;padding:9px 13px;font-weight:900}
@keyframes cinemaDrift{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,-1%,0) scale(1.04)}}@keyframes floatSymbol{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}@keyframes twinkle{0%,100%{opacity:.5;transform:scale(.8) rotate(-8deg)}50%{opacity:1;transform:scale(1.2) rotate(8deg)}}@keyframes mascotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
body.cinema-open{overflow:hidden}
@media(max-width:820px){.v2-nav{top:6px}.v2-links{display:none}.v2-nav .nav-brand .tk-logo{width:170px}.cinema-scene{grid-template-columns:1fr;height:100%;padding:70px 18px 18px}.cinema-copy{align-self:end;padding-bottom:16px}.cinema-copy h2{font-size:2.8rem}.cinema-world{position:absolute;inset:0;opacity:.95}.cinema-world .mascot{width:220px;left:2%;bottom:31%}.cinema-tower{width:240px;right:-4%;bottom:30%;transform:scale(.82)}.cinema-copy{background:linear-gradient(180deg,transparent,#17385da6 35%,#102a56e6);margin:0 -18px -18px;padding:90px 20px 28px}.cinema-copy .tk-logo{width:310px}.cinema-symbols .s1{font-size:2.7rem}.cinema-symbols .s2{font-size:3rem}.cinema-symbols .s3{font-size:3rem}.cinema-symbols .s4{font-size:2.8rem}.cinema-tagline{top:12%;right:4%;font-size:.75rem}.cinema-actions .btn{flex:1;min-width:0}.category-strip{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){.cinema-intro:before,.cinema-symbols span,.cinema-star,.cinema-world .mascot{animation:none!important}.btn,.choice,.level,.piece{transition:none!important}}
