            intro='''\n  <section id="cinemaIntro" class="cinema-intro hidden" aria-label="Intro de Chévere Kids Matemática">\n    <button class="cinema-close" type="button" onclick="closeCinema()">SALTAR INTRO</button>\n    <div class="cinema-symbols" aria-hidden="true"><span class="s1">1</span><span class="s2">2</span><span class="s3">÷</span><span class="s4">×</span><i class="cinema-star a">★</i><i class="cinema-star b">★</i><i class="cinema-star c">★</i></div>\n    <div class="cinema-glow"></div>\n    <div class="cinema-tagline">PEQUEÑOS DESAFÍOS · GRANDES MENTES ✨</div>\n    <div class="cinema-scene">\n      <div class="cinema-copy">\n        <div class="cinema-kicker">CINEMA ENGINE · CHÉVERE KIDS</div>\n        <img class="tk-logo" src="assets/torre-kids-logo.svg" alt="Chévere Kids Matemática">\n        <h2>Una aventura donde<br>los números cobran vida.</h2>\n        <p>Jugando y aprendiendo · 7–9 años. Explorá, resolvé y construí cada logro.</p>\n        <div class="cinema-actions"><button class="btn cinema-enter" onclick="closeCinema(true)">▶ JUGAR AHORA</button><button class="btn cinema-skip" onclick="closeCinema();showRules()">CÓMO SE JUEGA</button></div>\n      </div>\n      <div class="cinema-world" aria-hidden="true">\n        <img class="mascot" src="assets/mascota-bloqui.svg" alt="">\n        <div class="tower cinema-tower">\n          <div class="row"><div class="bl"><i></i>36</div><div class="bl g"><i></i>45</div><div class="bl b"><i></i>10</div></div>\n          <div class="row"><div class="bl y"><i></i>32</div><div class="bl p"><i></i>39</div><div class="bl k"><i></i>16</div></div>\n          <div class="row"><div class="bl"><i></i>22</div><div class="bl g"><i></i>31</div><div class="bl b"><i></i>54</div></div>\n          <div class="row"><div class="bl y"><i></i>18</div><div class="bl p"><i></i>27</div><div class="bl k"><i></i>46</div></div>\n        </div>\n      </div>\n    </div>\n  </section>\n'''
