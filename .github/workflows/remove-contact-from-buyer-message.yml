name: Remove contact data from buyer message
on:
  push:
    paths:
      - '.github/workflows/remove-contact-from-buyer-message.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove phone and email from MercadoLibre buyer message
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-licencias/index.html')
          s=p.read_text(encoding='utf-8')
          old='\\n\\nSoporte PasaloChevere: WhatsApp 11 5377-4769 · pasalochevere@gmail.com'
          new='\\n\\nSi necesitás ayuda, escribinos por este medio.'
          if old not in s:
              raise SystemExit('No se encontró el texto de soporte en buyerText')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'PasaloChevere Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin-licencias/index.html
          git commit -m 'Remove phone and email from MercadoLibre buyer message'
          git push origin HEAD:main
