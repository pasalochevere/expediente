name: BM20 R5R3R3 Protected Uploader QA
on:
  push:
    branches:
      - audit/bm20-r5r3r1-20261108
    paths:
      - admin-licencias/butter-mania-bn-r5r3r3.html
      - admin-licencias/tests/bm20-r5r3r3-upload-browser-qa.cjs
      - .github/workflows/bm20-r5r3r3-upload-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uploader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Exercise admin, non-admin, enabled-catalog and idempotency guards
        run: node admin-licencias/tests/bm20-r5r3r3-upload-browser-qa.cjs
