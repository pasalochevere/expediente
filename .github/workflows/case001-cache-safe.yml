name: Caso001 cache safe patch
on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch_case001_cache_safe.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Caso001 cache safe
        run: python tools/patch_case001_cache_safe.py
      - name: Commit fix
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html
          git diff --cached --check
          git commit -m "Caso001: avoid stale module cache and auto-resolve account access"
          git push
