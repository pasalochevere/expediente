name: Build upcoming HD assets

on:
  push:
    paths:
      - 'portal-v2/assets/upcoming-hd-b64/READY'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image chunks
        shell: bash
        run: |
          set -euo pipefail
          SRC='portal-v2/assets/upcoming-hd-b64'
          OUT='portal-v2/assets/upcoming'
          mkdir -p "$OUT"
          for name in torre-america aviones runas exp003 crimenes-reales quimera; do
            cat "$SRC/${name}.part"*.txt | tr -d '\n\r ' | base64 -d > "$OUT/${name}.webp"
            file "$OUT/${name}.webp"
            test -s "$OUT/${name}.webp"
          done
      - name: Commit decoded HD assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-v2/assets/upcoming/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'Actualizar previews Próximamente en alta calidad'
          git push
