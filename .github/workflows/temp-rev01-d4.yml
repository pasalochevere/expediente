name: Temp Rev01 D4 Lobby
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d4.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D4
        run: python .github/scripts/patch_rev01_d4.py
      - name: Validate D4 JavaScript and anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=['P2.12D.4 · LOBBY VISUAL','lobbyCasePanel','qrBox','copyInviteLink','renderLobbyQr','roomInviteUrl','WHATSAPP','ABRIR EXPEDIENTE']
          for token in required:
              assert token in s, token
          for portrait in ['santiago.jpg','clara.jpg','vera.jpg','mateo.jpg','ines.jpg','tomas.jpg']:
              assert Path('caso001-rev01/assets/personajes/'+portrait).exists(), portrait
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d4.js').write_text(code)
          print('D4 anchors PASS')
          PY
          node --check /tmp/rev01-d4.js
      - name: Commit D4
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.4 visual lobby with QR and WhatsApp"
          git push