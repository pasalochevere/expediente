name: Chévere Kids P0.8.7 wire once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chevere-kids-p087-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire P0.8.7 rewards assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('torre-kids-matematica/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/kids-rewards-v1.css?v=1.0.0">'
          js='<script src="assets/kids-rewards-v1.js?v=1.0.0"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          s=s.replace("const TK_VERSION='1.3.0';","const TK_VERSION='1.4.0';")
          if "const KIDS_REWARDS_VERSION='1.0.0';" not in s:
              s=s.replace("const KIDS_QA_VERSION='1.0.0';","const KIDS_QA_VERSION='1.0.0';\nconst KIDS_REWARDS_VERSION='1.0.0';")
          chip='<span class="kid-chip">🏅 RECOMPENSAS KIDS</span>'
          anchor='<span class="kid-chip">✍️ RESPUESTA ACTIVA</span>'
          if chip not in s and anchor in s:
              s=s.replace(anchor,anchor+chip,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate engines and wiring
        run: |
          node --check torre-kids-matematica/assets/kids-rewards-v1.js
          node --check torre-kids-matematica/assets/kids-qa-v1.js
          node --check torre-kids-matematica/assets/answer-engine-v1.js
          node --check torre-kids-matematica/assets/cinema-engine-v3.js
          grep -q "kids-rewards-v1.css" torre-kids-matematica/index.html
          grep -q "kids-rewards-v1.js" torre-kids-matematica/index.html
          grep -q "TK_VERSION='1.4.0'" torre-kids-matematica/index.html
          grep -q "KIDS_REWARDS_VERSION='1.0.0'" torre-kids-matematica/index.html
      - name: Commit wiring
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Activate Chévere Kids P0.8.7 rewards"
            git push
          fi
