name: Publish VÍNCORES V5.7
on:
  push:
    paths:
      - '.github/workflows/publish-vincores-v57.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup current VÍNCORES
        run: |
          mkdir -p vincores/backups
          cp vincores/index.html vincores/backups/V5_6_before_V5_7.html

      - name: Download V5.7
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c684-820e-835a-20fb90dc4cb7/raw?se=2026-09-17T00%3A53%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=5157828c-67a2-5419-9647-f2bd874275ba&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A04%3A05Z&ske=2026-09-17T20%3A04%3A05Z&sks=b&skv=2026-02-06&sig=69p6Sl8WIKCay2lcNp5Mvgj%2BZ%2BwZylSzQVLsS4fvOdg%3D"
        run: |
          curl -fL "$SOURCE_URL" -o vincores/index.html
          test "$(wc -c < vincores/index.html)" -gt 5000000
          grep -q "Cómo usar" vincores/index.html
          grep -q "pasalochevere-access" vincores/index.html
          grep -q "../portal-v2/" vincores/index.html

      - name: Commit V5.7
        run: |
          git config user.name "PasaloChevere Bot"
          git config user.email "actions@users.noreply.github.com"
          git add vincores/index.html vincores/backups/V5_6_before_V5_7.html
          git commit -m "Publish VÍNCORES V5.7 with How to use guide"
          git push
