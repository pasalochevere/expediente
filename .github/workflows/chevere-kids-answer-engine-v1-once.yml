name: Wire Chévere Kids Answer Engine V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chevere-kids-answer-engine-v1-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire active-answer engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('torre-kids-matematica/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/answer-engine-v1.css?v=1.0.0">'
          js='<script src="assets/answer-engine-v1.js?v=1.0.0"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          s=s.replace("const TK_VERSION='1.1.0';","const TK_VERSION='1.2.0';")
          if "const ANSWER_ENGINE_VERSION='1.0.0';" not in s:
              s=s.replace("const CINEMA_VERSION='3.0.0';","const CINEMA_VERSION='3.0.0';\nconst ANSWER_ENGINE_VERSION='1.0.0';")
          chip='<span class="kid-chip">🔒 RESPUESTA ACTIVA</span>'
          anchor='<span class="kid-chip">✓ V1.0 · FINAL</span>'
          if chip not in s and anchor in s:
              s=s.replace(anchor,anchor+chip,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate answer engine
        run: |
          node --check torre-kids-matematica/assets/answer-engine-v1.js
          grep -q "answer-engine-v1.js" torre-kids-matematica/index.html
          grep -q "answer-engine-v1.css" torre-kids-matematica/index.html
          grep -q "TK_VERSION='1.2.0'" torre-kids-matematica/index.html
      - name: Commit wiring
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Activate Chévere Kids answer engine V1"
            git push
          fi
