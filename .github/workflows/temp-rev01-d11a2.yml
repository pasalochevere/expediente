name: Temp Rev01 D11A2 Runtime Fix QA
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11a2.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix board runtime state
        run: python .github/scripts/fix_rev01_d11_marks.py
      - name: Apply D11A
        run: python .github/scripts/patch_rev01_d11a.py
      - name: Static validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=['P2.12D.11A · ACCESS PREFLIGHT + MOBILE QA','runtimeState','entryError','adapterReady','MARKS_STORAGE_KEY','let marks=loadMarks()','function saveMarks()','clearTheoryMarks','rev01-d11a-20260920']
          for t in required: assert t in s,t
          for d,n in [('personajes',6),('escenas',6),('objetos',6)]:
              assert len([x for x in (Path('caso001-rev01/assets')/d).glob('*') if x.is_file()])==n
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d11a2.js').write_text(code)
          print('D11A2 static PASS · board runtime state restored · assets 18/18')
          PY
          node --check /tmp/rev01-d11a2.js
      - name: Browser mobile QA
        run: |
          python3 -m http.server 8000 >/tmp/d11-http.log 2>&1 &
          mkdir -p /tmp/d11qa && cd /tmp/d11qa
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const paths=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath=paths.find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('Chrome not found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          for(const viewport of [{width:1366,height:900},{width:768,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8000/caso001-rev01/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#runtimeState')?.textContent?.includes('MOTOR P2 LISTO')||document.querySelector('#runtimeState')?.textContent?.includes('MOTOR NO DISPONIBLE'),null,{timeout:20000});
            const runtime=await page.locator('#runtimeState').innerText();
            if(!runtime.includes('MOTOR P2 LISTO')) throw new Error(`P2 init failed ${viewport.width}: ${runtime}`);
            if(pageErrors.length) throw new Error(`pageerror ${viewport.width}: ${pageErrors.join(' | ')}`);
            const overflow=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:window.innerWidth}));
            if(overflow.sw>overflow.iw+3) throw new Error(`overflow ${viewport.width}: ${overflow.sw}>${overflow.iw}`);
            if(viewport.width===1366){
              await page.click('#enterRoom'); await page.waitForTimeout(100);
              const err=await page.locator('#entryError').innerText();
              if(!/Portal|acceso/i.test(err)) throw new Error(`Access guidance missing: ${err}`);
              await page.click('#tabJoin');
              if(await page.locator('#enterRoom').isDisabled()) throw new Error('Join disabled after runtime ready');
              await page.click('#tabCreate');
              await page.evaluate(()=>{document.querySelector('#motiveTheory').value='prueba local';document.querySelector('#motiveTheory').dispatchEvent(new Event('input',{bubbles:true}))});
              await page.click('#suspectChips .theoryCard');
              const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('pc_exp_rev01_theory_v1')||'{}'));
              if(saved.motive!=='prueba local'||Number(saved.suspects?.[0])!==1) throw new Error('Theory persistence failed');
            }
            console.log(`VIEWPORT ${viewport.width} PASS overflow=${overflow.sw}/${overflow.iw}`);
            await page.close();
          }
          await browser.close();
          console.log('D11A2 browser/mobile QA PASS');
          JS
          node qa.mjs
      - name: Commit fixes
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.11A fix Rev01 startup and access preflight"
          git push
