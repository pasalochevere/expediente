name: EXP01 EN3 Narrative Build QA
on:
  push:
    paths:
      - '.github/workflows/exp01-en3-build-once.yml'
permissions:
  contents: write
jobs:
  build_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate EXP01-EN3 presentation layer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('caso001/index.html')
          s=p.read_text()
          old="import {t,getLanguage,bindLanguageSwitcher,applyTranslations,languageLocale} from './i18n.js?v=exp01-en1-20261001';"
          new="import {t,getLanguage,bindLanguageSwitcher,applyTranslations,languageLocale} from './i18n.js?v=exp01-en3-20261001';\nimport {bindGameContentLocalization,applyGameContentTranslations} from './content-en.js?v=exp01-en3-20261001';"
          if old not in s: raise SystemExit('main i18n import not found')
          s=s.replace(old,new,1)

          old="function solutionVisual(labels,images,name){const n=normalizedLabel(name),idx=labels.findIndex(x=>normalizedLabel(x)===n);return idx>=0?images[idx]:''}"
          new="function solutionVisual(labels,images,name,index=null){const canonicalIndex=Number(index);if(Number.isInteger(canonicalIndex)&&canonicalIndex>=0&&canonicalIndex<images.length)return images[canonicalIndex];const n=normalizedLabel(name),idx=labels.findIndex(x=>normalizedLabel(x)===n);return idx>=0?images[idx]:''}"
          if old not in s: raise SystemExit('solutionVisual not found')
          s=s.replace(old,new,1)

          old="killerImg=solutionVisual(P2_LABELS.characters,REV01_PORTRAITS,killer),locationImg=solutionVisual(P2_LABELS.locations,REV01_LOCATION_IMAGES,locationName),objectImg=solutionVisual(P2_LABELS.objects,REV01_OBJECT_IMAGES,objectName),"
          new="killerImg=solutionVisual(P2_LABELS.characters,REV01_PORTRAITS,killer,data.killer_character_index),locationImg=solutionVisual(P2_LABELS.locations,REV01_LOCATION_IMAGES,locationName,data.location_index),objectImg=solutionVisual(P2_LABELS.objects,REV01_OBJECT_IMAGES,objectName,data.object_index),"
          if old not in s: raise SystemExit('solution visual call not found')
          s=s.replace(old,new,1)

          old="""function refreshLanguagePresentation(){
  applyTranslations(document);
  bindLanguageSwitcher(document);
  buildCharacters();
  buildTheory();
  updateAccessPreflight();
  if(view){renderLobby();renderGame()}
  if(!$('#prologue').classList.contains('hidden'))renderPrologueScene();
}"""
          new="""function refreshLanguagePresentation(){
  applyTranslations(document);
  bindLanguageSwitcher(document);
  buildCharacters();
  buildTheory();
  updateAccessPreflight();
  if(view){renderLobby();renderGame()}
  if(!$('#prologue').classList.contains('hidden'))renderPrologueScene();
  applyGameContentTranslations(document);
}"""
          if old not in s: raise SystemExit('refreshLanguagePresentation not found')
          s=s.replace(old,new,1)

          old="bindLanguageSwitcher(document);applyTranslations(document);buildCharacters();buildTheory();"
          new="bindLanguageSwitcher(document);applyTranslations(document);bindGameContentLocalization(document);buildCharacters();buildTheory();"
          if old not in s: raise SystemExit('main bootstrap localization hook not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('caso001/intro/index.html')
          s=p.read_text()
          old="import {t,getLanguage,bindLanguageSwitcher,applyTranslations} from '../i18n.js?v=exp01-en1-20261001';"
          new="import {t,getLanguage,bindLanguageSwitcher,applyTranslations} from '../i18n.js?v=exp01-en3-20261001';\nimport {bindGameContentLocalization,applyGameContentTranslations} from '../content-en.js?v=exp01-en3-20261001';"
          if old not in s: raise SystemExit('intro import not found')
          s=s.replace(old,new,1)
          old="function renderLanguageUi(){applyTranslations(document);soundBtn.textContent=t(soundOn?'intro.soundOn':'intro.soundOff');fsBtn.textContent=t(document.fullscreenElement?'intro.exitFullscreen':'intro.fullscreen')}bindLanguageSwitcher(document);renderLanguageUi();"
          new="function renderLanguageUi(){applyTranslations(document);applyGameContentTranslations(document);soundBtn.textContent=t(soundOn?'intro.soundOn':'intro.soundOff');fsBtn.textContent=t(document.fullscreenElement?'intro.exitFullscreen':'intro.fullscreen')}bindLanguageSwitcher(document);bindGameContentLocalization(document);renderLanguageUi();"
          if old not in s: raise SystemExit('intro renderLanguageUi hook not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('caso001/RELEASE.txt')
          s=p.read_text()
          s=s.replace('Language checkpoint: EXP01-EN2 · structural/functional UI translation complete','Language checkpoint: EXP01-EN3 · full visible game-content translation ES/EN complete')
          s=s.replace('Language scope EN2: setup, onboarding, lobby, board, Director, evidence metadata, private labels, log, accusation, solution shell, client messages/toasts, accessibility and WhatsApp invite localized ES/EN','Language scope EN3: EN2 structural UI + main narrative, legacy prologue, Cinema Intro, public profiles, visible location/object labels, all enabled C001 evidence payloads, private role/objective content, Impostor truth, Director guidance and full solution/reconstruction narrative localized ES/EN')
          s=s.replace('Narrative scope deferred: story, character profiles, canonical character/location/object labels, evidence payloads, private server content and reconstruction/solution narrative remain Spanish until EXP01-EN3','Canonical safety: server Crime Packs, P2 labels, room state and multiplayer payloads remain unchanged in Spanish/internal IDs; English is presentation-only and solution visuals now resolve by canonical indices before legacy name fallback')
          s=s.replace('Language QA EN2: automated browser PASS · bidirectional ES↔EN PASS · local state isolation PASS · narrative payload exclusion PASS · language absent from multiplayer payloads','Language QA EN3: pending one-shot browser gate in this commit · bidirectional ES↔EN · narrative/evidence/private/solution samples · Cinema Intro · local state isolation · language absent from multiplayer payloads')
          p.write_text(s)

          audit=Path('caso001/EXP01_EN3_AUDIT.md')
          audit.write_text('''# EXP01-EN3 · Game Content Translation · ES / EN\n\nEstado: **BUILD + QA EN CURSO** (este archivo se congela después del gate).\n\n## Alcance\n\nEXP01-EN3 completa la capa inglesa visible del único build de Caso 001 sin modificar la lógica del juego.\n\nSe auditó el contenido activo de los 12 Crime Packs C001-01…C001-12 en Supabase y se creó una capa de traducción de presentación para:\n\n- narrativa principal y prólogo legacy;\n- Cinema Intro V10.7;\n- perfiles públicos;\n- nombres visibles de lugares y objetos;\n- 12 Crime Packs habilitados: evidencias públicas/privadas y fallbacks NPC;\n- rol/objetivo privado de Investigador e Impostor;\n- mentira central, hecho real y encubrimiento del Impostor;\n- orientaciones automáticas y solicitadas del Director;\n- motivo, contradicción, evento crítico, mecanismo, encubrimiento, reconstrucción, señuelos y cierre de la solución.\n\n## Arquitectura\n\nLa traducción permanece estrictamente en cliente/presentación. No se modifica `pack_payload`, no se envía `lang` a acciones multiplayer y no se duplica la partida.\n\nArchivos de contenido:\n\n- `content-en-core.js`\n- `content-en-packs-01-04.js`\n- `content-en-packs-05-08.js`\n- `content-en-packs-09-12.js`\n- `content-en.js`\n\n`content-en.js` mantiene mapas reversibles ES↔EN y observa UI dinámica para traducir contenido server-side cuando aparece en DOM. El texto de usuario no se traduce salvo coincidencia exacta con una frase canónica del juego.\n\n## Canon / seguridad\n\n- P2_LABELS internos permanecen en español.\n- personajes mantienen sus nombres propios.\n- índices de persona/escena/objeto permanecen canónicos.\n- `solutionVisual()` usa primero los índices server-side y conserva el lookup por nombre solo como fallback legacy.\n- no se tocaron Edge Functions, Crime Packs, tablas, timers, roles, acciones, licencias ni estados de sala.\n\n## QA esperado\n\n- main narrative EN;\n- perfiles EN;\n- lugares/objetos EN;\n- muestras de evidencia de packs 01/05/09/12 EN;\n- private role/objective EN;\n- Director EN;\n- solución EN;\n- Intro V10.7 EN;\n- reversión EN→ES;\n- estado local intacto;\n- adapter sin idioma en payloads;\n- visual solution lookup por índices.\n''')
          PY
          node --check caso001/i18n.js
          node --check caso001/content-en-core.js
          node --check caso001/content-en-packs-01-04.js
          node --check caso001/content-en-packs-05-08.js
          node --check caso001/content-en-packs-09-12.js
          node --check caso001/content-en.js
          git diff --check
      - name: Browser runtime
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en3-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
      - name: EXP01-EN3 browser QA
        run: |
          cat > /tmp/exp01-en3-qa.mjs <<'JS'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const result=[];const ck=(n,v,d='')=>{result.push([n,!!v,d]);if(!v)throw new Error(`${n}: ${d}`)};
          try{
            const c=await browser.newContext({viewport:{width:1280,height:900}}),p=await c.newPage();
            await p.goto('http://127.0.0.1:4173/caso001/?lang=en&skipintro=1',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1200);
            ck('main title EN',await p.locator('header h1').innerText()==='The Last Meeting');
            ck('main narrative EN',(await p.locator('.subtitle').innerText()).startsWith('Six people.'));
            ck('profile EN',(await p.locator('#characterDossierPreview').innerText()).includes('Partner at the firm'));
            ck('location EN',(await p.locator('#locationChips').innerText()).includes('Living room'));
            ck('object EN',(await p.locator('#objectChips').innerText()).includes('Weapon'));
            const stats=await p.evaluate(async()=>{const m=await import('./content-en.js');return m.contentTranslationStats()});
            ck('content dictionary breadth',stats.uniqueEs>180,JSON.stringify(stats));
            const samples={
              e01:'El equipo del estudio registra la apertura de un archivo externo a las 22:52. El identificador coincide con la memoria USB que ya no está en su lugar habitual.',
              e05:'La copia de seguridad del mensaje recupera el destinatario: Inés. Además, la cámara interior no la registra entre 22:48 y 23:12, mientras Vera aparece en la cocina a las 23:02. El horario coincide con la figura que Mateo vio regresar.',
              e09:'Un inventario fotográfico antiguo muestra esa copia con la misma microetiqueta colocada en el llavero personal de Vera. La ventana sin imagen de Vera entre 22:45 y 23:09 coincide con ambas aperturas; Mateo, en cambio, registra actividad en el terminal técnico a las 22:58 y 23:04.',
              e12:'El celular de la víctima aparece bajo el banco del jardín, con tierra húmeda del mismo sector. La nota de voz se corta en el momento en que se oye un forcejeo y pasos que se alejan hacia la salida lateral.',
              role:'Protegé tu mentira central, sembrá dudas sin inventar evidencia oficial y evitá una acusación completa.',
              director:'No sumen sospechosos nuevos. Reconstruyan en orden: llegada, encuentro, hecho crítico, salida y encubrimiento.',
              solution:'Tomás y la víctima discutieron junto al banco del jardín por el uso no autorizado de su nombre. Cuando la víctima intentó volver a la casa con el celular en la mano, Tomás la sujetó y la empujó; la caída contra el borde de piedra terminó siendo fatal.'
            };
            await p.evaluate(samples=>{for(const [k,v] of Object.entries(samples)){const d=document.createElement('div');d.id='qa-'+k;d.className=k.startsWith('e')?'evText':'';d.textContent=v;document.body.append(d)}},samples);await p.waitForTimeout(180);
            ck('pack01 evidence EN',(await p.locator('#qa-e01').innerText()).startsWith('The study computer records'));
            ck('pack05 evidence EN',(await p.locator('#qa-e05').innerText()).startsWith('The message backup recovers'));
            ck('pack09 evidence EN',(await p.locator('#qa-e09').innerText()).startsWith('An old photographic inventory'));
            ck('pack12 evidence EN',(await p.locator('#qa-e12').innerText()).startsWith('The victim’s cell phone is found'));
            ck('private objective EN',(await p.locator('#qa-role').innerText()).startsWith('Protect your central lie'));
            ck('director content EN',(await p.locator('#qa-director').innerText()).startsWith('Do not add new suspects'));
            ck('solution content EN',(await p.locator('#qa-solution').innerText()).startsWith('Tomás and the victim argued'));
            const state='{"motive":"EN3-STATE-ISOLATED"}';await p.evaluate(v=>localStorage.setItem('pc_exp_rev01_theory_v1',v),state);
            await p.locator('.revTopActions [data-exp-lang="es"]').click();await p.waitForTimeout(250);
            ck('main title reverse ES',await p.locator('header h1').innerText()==='La Última Reunión');
            ck('evidence reverse ES',(await p.locator('#qa-e01').innerText()).startsWith('El equipo del estudio registra'));
            ck('profile reverse ES',(await p.locator('#characterDossierPreview').innerText()).includes('Socio del estudio'));
            ck('state isolation',(await p.evaluate(()=>localStorage.getItem('pc_exp_rev01_theory_v1')))===state);
            await p.locator('.revTopActions [data-exp-lang="en"]').click();await p.waitForTimeout(220);
            ck('second EN switch',await p.locator('header h1').innerText()==='The Last Meeting');
            await c.close();

            const c2=await browser.newContext({viewport:{width:390,height:844}}),i=await c2.newPage();
            await i.goto('http://127.0.0.1:4173/caso001/intro/?lang=en&access=QAACCESS&room=QAROOM',{waitUntil:'domcontentloaded'});await i.waitForTimeout(700);
            ck('Cinema narrative EN',await i.locator('#s1 .big').first().innerText()==='One meeting.');
            ck('Cinema title EN',await i.locator('#s6 h2').innerText()==='The Last Meeting');
            ck('Cinema object EN',(await i.locator('#s4').innerText()).includes('CELL PHONE'));
            ck('Cinema action words EN',(await i.locator('#s4').innerText()).includes('Observe.'));
            await i.locator('[data-exp-lang="es"]').click();await i.waitForTimeout(180);
            ck('Cinema reverse ES',await i.locator('#s1 .big').first().innerText()==='Una reunión.');
            ck('Cinema params preserved',new URL(i.url()).searchParams.get('access')==='QAACCESS'&&new URL(i.url()).searchParams.get('room')==='QAROOM');
            await c2.close();

            const adapter=fs.readFileSync('caso001/p2-multiplayer-adapter.js','utf8');
            const main=fs.readFileSync('caso001/index.html','utf8');
            ck('language absent multiplayer',!adapter.includes('expedientes_language')&&!/\blang\s*:|\blanguage\s*:/.test(adapter));
            ck('canonical room/mode keys preserved',adapter.includes("mode:mode==='imp'?'imp':'dig'")&&adapter.includes('pc_exp_p2_last_room'));
            ck('solution visuals canonical-index first',main.includes('data.killer_character_index')&&main.includes('data.location_index')&&main.includes('data.object_index')&&main.includes('canonicalIndex'));
            console.log(JSON.stringify({ok:true,result},null,2));
          } finally {await browser.close()}
          JS
          node /tmp/exp01-en3-qa.mjs
      - name: Freeze audit and commit passing build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caso001/EXP01_EN3_AUDIT.md')
          s=p.read_text().replace('Estado: **BUILD + QA EN CURSO** (este archivo se congela después del gate).','Estado: **PASS · Game Content Translation ES/EN integrada y validada**.')
          s += '\n## Gate definitivo\n\nBrowser QA automatizado: **PASS**.\n\nEl gate valida narrativa principal, perfiles, lugares/objetos, muestras representativas de evidencias de los 12 packs por grupos, contenido privado, Director, solución, Cinema Intro, reversión EN→ES, segundo cambio ES→EN, conservación de estado local, parámetros de Intro, ausencia de idioma en multiplayer y resolución visual por índices canónicos.\n'
          p.write_text(s)
          r=Path('caso001/RELEASE.txt')
          rs=r.read_text().replace('Language QA EN3: pending one-shot browser gate in this commit · bidirectional ES↔EN · narrative/evidence/private/solution samples · Cinema Intro · local state isolation · language absent from multiplayer payloads','Language QA EN3: automated browser PASS · bidirectional ES↔EN PASS · narrative/evidence/private/Director/solution PASS · Cinema Intro PASS · local state isolation PASS · language absent from multiplayer payloads · solution visual lookup index-safe')
          r.write_text(rs)
          PY
          rm -f package.json package-lock.json
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/index.html caso001/intro/index.html caso001/RELEASE.txt caso001/EXP01_EN3_AUDIT.md
          git diff --cached --check
          git commit -m 'EXP01-EN3 integrate full visible game content translation'
          git push origin main
