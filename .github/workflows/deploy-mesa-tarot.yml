name: Deploy Mesa Tarot

on:
  push:
    paths:
      - '.github/workflows/deploy-mesa-tarot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download protected Mesa Tarot build
        env:
          SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f2c4-820e-868a-fcc3e9f9def5/raw?se=2026-09-20T19%3A36%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=5cd66dee-d749-51ff-9ed8-6b793a00b05f&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A32%3A12Z&ske=2026-09-21T14%3A32%3A12Z&sks=b&skv=2026-02-06&sig=8YlukLS7HVpw8OE/U5qJDzx%2B30gJ2eoqxt6guSXXaVc%3D'
        run: |
          set -euo pipefail
          mkdir -p mesa-tarot
          curl --fail --location --retry 3 "$SOURCE_URL" -o mesa-tarot/index.html.new
          echo '623f31e3f06e335e2e849d460a0fbbe17d8b563060b24196ff3198ff9f182d17  mesa-tarot/index.html.new' | sha256sum -c -
          mv mesa-tarot/index.html.new mesa-tarot/index.html
      - name: Commit deploy
        run: |
          set -euo pipefail
          git config user.name 'PasaloChevere Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add mesa-tarot/index.html
          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
            exit 0
          fi
          git commit -m 'deploy Mesa Tarot protected build [skip deploy]'
          git push origin HEAD:main
