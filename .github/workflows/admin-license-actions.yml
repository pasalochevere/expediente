name: Admin license actions patch
on:
  push:
    branches: [main]
    paths:
      - tools/patch_admin_license_actions.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_admin_license_actions.py
      - run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add admin-licencias/index.html
          git diff --cached --check
          git commit -m "Admin add license status actions"
          git push
