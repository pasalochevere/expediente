name: Portal V5.6.1 cache bump once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-v561-cache-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump portal loader cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal-v2/index.html')
          s=p.read_text(encoding='utf-8')
          old='c002-rc.js?v=20260923-tarot-1'
          new='c002-rc.js?v=20260924-v561-1'
          if old not in s and new not in s:
              raise SystemExit('Expected portal loader reference not found')
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate cache bump
        run: |
          grep -q 'c002-rc.js?v=20260924-v561-1' portal-v2/index.html
          grep -q 'portal-v5-bootstrap-v56.js?v=20260924-3' portal-v2/c002-rc.js
          grep -q 'portal-activation-fix-v561.js' portal-v2/portal-v5-bootstrap-v56.js
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/portal-v561-cache-once.yml
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add portal-v2/index.html .github/workflows/portal-v561-cache-once.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: bust portal loader cache for v5.6.1"
            git push
          fi
