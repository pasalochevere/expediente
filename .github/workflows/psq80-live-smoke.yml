name: PSQ80 live preview smoke
on:
  push:
    branches: [audit/psq80-butter-integration-20261110]
    paths:
      - paper-squishy/tests/psq80-live-smoke.cjs
      - .github/workflows/psq80-live-smoke.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test live 80-character preview in desktop/mobile
        run: node paper-squishy/tests/psq80-live-smoke.cjs
