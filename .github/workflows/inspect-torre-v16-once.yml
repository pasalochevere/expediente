name: One-time inspect Torre V1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-torre-v16-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect master and embedded games
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('torre/index.html')
          s=p.read_text(encoding='utf-8')
          print('MASTER_SIZE', len(s))
          print('MASTER_TITLE', re.findall(r'<title>(.*?)</title>', s, re.I|re.S)[:3])
          for term in ['MEGA PACK','TORRE 5 EN 1','TORRE KIDS','KIDS','V1.5','V1.6','832','800']:
              print('COUNT', term, s.count(term))
          # visible snippets near non-base64 terms
          for term in ['MEGA PACK','TORRE 5 EN 1','KIDS','V1.5','832']:
              print('\nSNIPPETS',term)
              for m in list(re.finditer(re.escape(term), s, re.I))[:8]:
                  a=max(0,m.start()-180); b=min(len(s),m.end()+260)
                  sn=s[a:b].replace('\n',' ')
                  print(sn[:700])
          # inspect every large quoted base64-looking payload
          seen=0
          for m in re.finditer(r'([A-Za-z0-9+/]{10000,}={0,2})', s):
              raw=m.group(1)
              try:
                  dec=base64.b64decode(raw).decode('utf-8')
              except Exception:
                  continue
              if '<html' not in dec.lower() and '<!doctype' not in dec.lower():
                  continue
              seen+=1
              title=re.findall(r'<title>(.*?)</title>',dec,re.I|re.S)
              print('\nEMBED',seen,'LEN',len(dec),'TITLE',title[:1])
              for term in ['TORRE KIDS','TORRE GENERAL','TORRE FIESTA','SIN FILTRO','V0.','V1.','832','208']:
                  if term.lower() in dec.lower():
                      print(' HAS',term)
              texts=re.findall(r'<h[1-3][^>]*>(.*?)</h[1-3]>',dec,re.I|re.S)
              texts=[re.sub('<[^>]+>',' ',x) for x in texts]
              texts=[' '.join(x.split()) for x in texts]
              print(' HEADINGS',texts[:12])
          print('EMBED_TOTAL',seen)
          PY
      - name: Remove inspection workflow
        if: always()
        shell: bash
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git rm .github/workflows/inspect-torre-v16-once.yml
          git commit -m "chore: remove one-time Torre V1.6 inspection workflow"
          git push
