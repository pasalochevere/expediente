name: Caso001 WhatsApp room share
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/caso001-whatsapp-share.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WhatsApp share flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('caso001/index.html')
          s=p.read_text(encoding='utf-8')

          old="let buttons='';if(view?.is_host&&room.status==='waiting')buttons+=`<button class=\"btn primary\" id=\"startGame\" ${players.length<3?'disabled':''}>Iniciar expediente P2</button>`;buttons+=`<button class=\"btn\" id=\"copyCode\">Copiar código</button>`;$('#lobbyControls').innerHTML=buttons;"
          new="let buttons='';if(view?.is_host&&room.status==='waiting')buttons+=`<button class=\"btn primary\" id=\"startGame\" ${players.length<3?'disabled':''}>Iniciar expediente P2</button>`;buttons+=`<button class=\"btn\" id=\"shareWhatsApp\">Compartir por WhatsApp</button><button class=\"btn\" id=\"copyCode\">Copiar código</button>`;$('#lobbyControls').innerHTML=buttons;"
          assert s.count(old)==1, f'lobby buttons anchor mismatch {s.count(old)}'
          s=s.replace(old,new,1)

          old="$('#copyCode')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(room.code||'');toast('Código copiado.')}catch{toast(`Código: ${room.code||''}`)}});"
          new="$('#shareWhatsApp')?.addEventListener('click',()=>{const code=String(room.code||'').trim().toUpperCase();if(!code)return;const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('room',code);const text=`🔎 EXPEDIENTES · Caso 001 — La Última Reunión\\n\\nEntrá a nuestra sala de investigación:\\n${u.toString()}\\n\\nCódigo de sala: ${code}\\n\\nPoné tu nombre, elegí un personaje libre y tocá “Unirme a la sala”.`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')});\n $('#copyCode')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(room.code||'');toast('Código copiado.')}catch{toast(`Código: ${room.code||''}`)}});"
          assert s.count(old)==1, f'copy anchor mismatch {s.count(old)}'
          s=s.replace(old,new,1)

          old="buildCharacters();buildTheory();$('#licenseKey').value=findStoredLicense();const last=lastRoomCode();if(last){$('#roomCode').value=last;$('#rejoinLast').classList.remove('hidden');$('#rejoinLast').textContent=`Reingresar a ${last}`}"
          new="buildCharacters();buildTheory();$('#licenseKey').value=findStoredLicense();const invitedRoom=new URLSearchParams(location.search).get('room');const last=lastRoomCode();if(invitedRoom){setEntryMode('join');$('#roomCode').value=String(invitedRoom).trim().toUpperCase();toast('Código de sala cargado. Elegí tu personaje y uníte.')}else if(last){$('#roomCode').value=last;$('#rejoinLast').classList.remove('hidden');$('#rejoinLast').textContent=`Reingresar a ${last}`}"
          assert s.count(old)==1, f'init anchor mismatch {s.count(old)}'
          s=s.replace(old,new,1)

          assert 'id="shareWhatsApp"' in s
          assert "searchParams.set('room',code)" in s
          p.write_text(s,encoding='utf-8')
          print('Caso001 WhatsApp share patch OK')
          PY
      - name: Commit runtime update
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html
          git diff --cached --check
          git commit -m "Caso001: share room by WhatsApp"
          git push
