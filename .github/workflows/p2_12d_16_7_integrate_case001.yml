name: P2.12D.16.7 Integrate Case001 Intro
on:
  push:
    paths:
      - '.github/workflows/p2_12d_16_7_integrate_case001.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Portal and Case 001 handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('portal-v2/index.html')
          p = portal.read_text(encoding='utf-8')
          old = "if(l.product_code==='EXP-001')return '../caso001/?access='+encodeURIComponent(l.activation_code);"
          new = "if(l.product_code==='EXP-001')return '../caso001/intro/?access='+encodeURIComponent(l.activation_code)+'&v=20260923-v10';"
          if old not in p:
              raise SystemExit('Portal route EXP-001 not found; aborting')
          portal.write_text(p.replace(old,new,1),encoding='utf-8')

          case = Path('caso001/index.html')
          c = case.read_text(encoding='utf-8')
          old2 = "const invitedRoom=urlParams.get('room');if(invitedRoom){$('#prologue').classList.add('hidden')}else{sessionStorage.removeItem('pc_exp_rev01_prologue_seen');openPrologue()}"
          new2 = "const invitedRoom=urlParams.get('room');const skipIntro=urlParams.get('skipintro')==='1'||urlParams.get('intro')==='v10';if(invitedRoom||skipIntro){$('#prologue').classList.add('hidden');sessionStorage.setItem('pc_exp_rev01_prologue_seen','1')}else{sessionStorage.removeItem('pc_exp_rev01_prologue_seen');openPrologue()}"
          if old2 not in c:
              raise SystemExit('Case001 prologue init block not found; aborting')
          case.write_text(c.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Self remove one-time workflow
        run: rm .github/workflows/p2_12d_16_7_integrate_case001.yml
      - name: Commit integration
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add portal-v2/index.html caso001/index.html .github/workflows/p2_12d_16_7_integrate_case001.yml
          git commit -m "P2.12D.16.7 integrate Case001 V10 intro into Portal flow"
          git push
