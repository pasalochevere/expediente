name: One-time harden Torre access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-torre-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject authenticated access guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          path = Path("torre/index.html")
          text = path.read_text(encoding="utf-8")
          marker = "PC_TORRE_ACCESS_GUARD_V1"
          guard = base64.b64decode("").decode("utf-8")

          if marker not in text:
              m = re.search(r"<head\b[^>]*>", text, flags=re.I)
              if not m:
                  raise SystemExit("No se encontró <head> en torre/index.html")
              text = text[:m.end()] + "\n" + guard + "\n" + text[m.end():]
              path.write_text(text, encoding="utf-8")
              print("Guard injected.")
          else:
              print("Guard already present; no duplicate injection.")
          PY

      - name: Commit hardened game and remove one-time workflow
        shell: bash
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git rm .github/workflows/harden-torre-once.yml
          git add torre/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: protect Torre direct access with active license"
          git push
