name: C002 v244 Inventory Visual Library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c002-v244-inventory-visual-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Inventory all embedded visual assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import re,base64,hashlib
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          root=Path('caso002/assets/visual')
          pat=re.compile(r'[\"\']([^\"\']+)[\"\']\s*:\s*[\"\']data:image/([^;]+);base64,([A-Za-z0-9+/=]+)')
          rows=[]
          for i in range(1,9):
              p=root/f'assets-part-{i:02d}.js'
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8')
              for m in pat.finditer(txt):
                  key,fmt,b=m.group(1),m.group(2),m.group(3)
                  try:
                      raw=base64.b64decode(b+'='*((-len(b))%4),validate=False)
                      im=Image.open(BytesIO(raw)); im.load()
                      rows.append((key,p.name,im.size,len(raw),hashlib.sha256(raw).hexdigest()[:16],'OK'))
                  except Exception as e:
                      rows.append((key,p.name,None,0,'-',f'FAIL:{type(e).__name__}'))
          for row in rows:
              print('ASSET',*row)
          print('TOTAL',len(rows))
          PY
