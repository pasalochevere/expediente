name: Temp Rev01 D6 Evidence Renderer
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d6.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D6
        run: python .github/scripts/patch_rev01_d6.py
      - name: Validate D6
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=[
            'P2.12D.6 · EVIDENCE RENDERER','renderEvidenceCard','normalizeEvidenceType',
            'ev-testimonial','ev-digital','ev-access','ev-physical','ev-temporal','ev-motivational',
            'INFORMACIÓN PRIVADA','ARCHIVO COMPARTIDO','LECTURA PRIVADA'
          ]
          for t in required: assert t in s,t
          assert s.count("testimonial:{label:'DECLARACIÓN'")==1
          assert s.count("digital:{label:'EVIDENCIA DIGITAL'")==1
          assert s.count("access:{label:'REGISTRO DE ACCESO'")==1
          assert s.count("physical:{label:'FICHA PERICIAL'")==1
          assert s.count("temporal:{label:'LÍNEA TEMPORAL'")==1
          assert s.count("motivational:{label:'DOCUMENTO CONTEXTUAL'")==1
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m,'module script missing'
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d6.js').write_text(code)
          print('D6 renderer types 6/6 PASS · private/public renderer PASS')
          PY
          node --check /tmp/rev01-d6.js
      - name: Commit D6
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.6 evidence renderer"
          git push
