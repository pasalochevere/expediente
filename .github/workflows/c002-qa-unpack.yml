name: C002 QA Unpack

on:
  push:
    paths:
      - '.github/workflows/c002-qa-unpack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and inspect C002 payload
        shell: bash
        run: |
          set -euo pipefail
          cd caso002
          cat payload.part00a1a.correct payload.part00a1b payload.part00a2 payload.part00b payload.part01 payload.part02 payload.part03 payload.part04 payload.part05 > /tmp/c002.b64
          base64 -d /tmp/c002.b64 > /tmp/c002.gz
          gzip -dc /tmp/c002.gz > /tmp/c002.html
          mkdir -p qa-output
          cp /tmp/c002.html qa-output/c002-unpacked.html
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('/tmp/c002.html')
          s=p.read_text('utf-8')
          report={
            'bytes': len(s.encode()),
            'title': (re.search(r'<title>(.*?)</title>',s,re.I|re.S).group(1).strip() if re.search(r'<title>(.*?)</title>',s,re.I|re.S) else None),
            'viewport': bool(re.search(r'name=["\']viewport["\']',s,re.I)),
            'media_queries': len(re.findall(r'@media',s,re.I)),
            'buttons': len(re.findall(r'<button\b',s,re.I)),
            'inputs': len(re.findall(r'<input\b',s,re.I)),
            'dialogs': len(re.findall(r'(?:role=["\']dialog["\']|<dialog\b)',s,re.I)),
            'beta_mentions': len(re.findall(r'\bBETA\b',s,re.I)),
            'supabase_functions': sorted(set(re.findall(r'expediente-c002-[a-z-]+',s))),
            'localstorage_keys': sorted(set(re.findall(r'localStorage\.(?:getItem|setItem)\(["\']([^"\']+)',s))),
            'has_room317': '317' in s,
            'has_accuse': bool(re.search(r'accus',s,re.I)),
            'has_realtime': bool(re.search(r'realtime|channel\(',s,re.I)),
          }
          Path('qa-output/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          # Extract all media queries and visible headings/buttons for review.
          texts=[]
          for tag in ('h1','h2','h3','button'):
            for m in re.finditer(fr'<{tag}\b[^>]*>(.*?)</{tag}>',s,re.I|re.S):
              t=re.sub(r'<[^>]+>',' ',m.group(1))
              t=re.sub(r'\s+',' ',t).strip()
              if t: texts.append({'tag':tag,'text':t})
          Path('qa-output/ui-texts.json').write_text(json.dumps(texts,ensure_ascii=False,indent=2),'utf-8')
          PY
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: c002-qa-unpacked
          path: caso002/qa-output/
          if-no-files-found: error
          retention-days: 1
