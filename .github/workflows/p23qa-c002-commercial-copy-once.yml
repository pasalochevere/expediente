name: P2.3-QA C002 Commercial Gate Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p23qa-c002-commercial-copy-once.yml'

permissions:
  contents: write

jobs:
  patch-c002-commercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch C002 commercial state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('portal-v2/c002-rc.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'Expected exactly 1 match for {old!r}, found {n}')
              s=s.replace(old,new,1)
          rep("if(status)status.textContent='● RELEASE CANDIDATE';","if(status)status.textContent='● DISPONIBLE PARA ACTIVAR';")
          rep("kit imprimible COLOR y B/N.","kit imprimible Premium COLOR y B/N.")
          rep("if(actions)actions.innerHTML='<button class=\"btn primary\" id=\"exp002Buy\" disabled>VENTA ONLINE PENDIENTE</button><a class=\"btn\" href=\"https://wa.me/5491153774769?text=Hola%20PasaloChevere%2C%20quiero%20consultar%20por%20EXPEDIENTES%20%E2%80%94%20Caso%20002.\" target=\"_blank\" rel=\"noopener\">WHATSAPP</a>';","if(actions)actions.innerHTML='<button class=\"btn primary\" id=\"exp002Buy\" type=\"button\">ACTIVAR COMPRA</button><a class=\"btn\" href=\"https://wa.me/5491153774769?text=Hola%20PasaloChevere%2C%20quiero%20comprar%20EXPEDIENTES%20%E2%80%94%20Caso%20002.\" target=\"_blank\" rel=\"noopener\">WHATSAPP</a>';")
          rep("price.textContent='Release Candidate aprobado · precio online pendiente de definición';","btn.disabled=false;btn.onclick=()=>scrollToActivation();\n  price.textContent='ARS 14.999 · acceso 12 meses';")
          rep("const prod=(data.products||[]).find(x=>x.product_code==='EXP-002');\n    if(prod?.sales_enabled&&Number(prod.price_ars)>0){","const prod=(data.products||[]).find(x=>x.product_code==='EXP-002');\n    if(Number(prod?.price_ars)>0)price.textContent=formatPrice(prod.price_ars)+' · acceso 12 meses';\n    if(prod?.sales_enabled&&Number(prod.price_ars)>0){")
          rep("}else{btn.disabled=true}\n  }catch(e){console.warn('C002 catalog',e)}","}else{if(status)status.textContent='● DISPONIBLE PARA ACTIVAR';btn.disabled=false;btn.textContent='ACTIVAR COMPRA';btn.onclick=()=>scrollToActivation()}\n  }catch(e){console.warn('C002 catalog',e)}")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add portal-v2/c002-rc.js
          git commit -m "fix: align C002 Portal with commercial gate"
          git push
