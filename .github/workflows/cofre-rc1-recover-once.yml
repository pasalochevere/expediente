name: COFRE RC1 recover once

on:
  push:
    branches: [cofre-rc1-staging]
    paths:
      - '.github/workflows/cofre-rc1-recover-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staged archives
        shell: bash
        run: |
          set -u
          mkdir -p recovered/payload recovered/runtime recovered/diagnostics

          cat cofre-rc1/payload/chunk-000 \
              cofre-rc1/payload/chunk-001 \
              cofre-rc1/payload/chunk-002 \
              cofre-rc1/payload/chunk-003 \
              > recovered/diagnostics/payload.raw
          git show 0e9d58315bd6d3fa0d30da9cab96dbd9d38efcee:cofre-rc1/payload/chunk-004005 \
              >> recovered/diagnostics/payload.raw
          cat cofre-rc1/runtime/chunk-* > recovered/diagnostics/runtime.raw

          python3 <<'PY'
          import base64, pathlib, string, zlib, lzma, traceback

          d=pathlib.Path('recovered/diagnostics')
          report=[]
          alphabet=set((string.ascii_letters+string.digits+'+/=').encode())

          def decode64(name):
              raw=(d/f'{name}.raw').read_bytes()
              clean=bytes(b for b in raw if b in alphabet)
              removed=[b for b in raw if b not in alphabet]
              clean += b'='*((-len(clean))%4)
              (d/f'{name}.b64').write_bytes(clean)
              data=base64.b64decode(clean, validate=True)
              (d/f'{name}.packed').write_bytes(data)
              report += []
              return raw, clean, removed, data

          # Payload is GZIP. Salvage decompressed bytes even if the final gzip footer is missing.
          raw, clean, removed, packed = decode64('payload')
          report.append('== payload ==')
          report.append(f'raw={len(raw)} clean_b64={len(clean)} removed={len(removed)} packed={len(packed)} magic={packed[:8].hex()}')
          if removed: report.append('removed_values='+repr(sorted(set(removed))))
          try:
              z=zlib.decompressobj(16+zlib.MAX_WBITS)
              out=z.decompress(packed)
              try:
                  out += z.flush()
              except Exception as e:
                  report.append('payload_flush_error='+repr(e))
              (d/'payload.decoded').write_bytes(out)
              report.append(f'payload_decoded={len(out)} eof={z.eof} unused={len(z.unused_data)} unconsumed={len(z.unconsumed_tail)}')
          except Exception as e:
              report.append('payload_decompress_error='+repr(e))
              traceback.print_exc()
              out=b''

          # Runtime is XZ.
          raw, clean, removed, packed = decode64('runtime')
          report.append('== runtime ==')
          report.append(f'raw={len(raw)} clean_b64={len(clean)} removed={len(removed)} packed={len(packed)} magic={packed[:8].hex()}')
          if removed: report.append('removed_values='+repr(sorted(set(removed))))
          try:
              dec=lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              rout=dec.decompress(packed)
              (d/'runtime.decoded').write_bytes(rout)
              report.append(f'runtime_decoded={len(rout)} eof={dec.eof} unused={len(dec.unused_data)}')
          except Exception as e:
              report.append('runtime_decompress_error='+repr(e))
              traceback.print_exc()

          (d/'report.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY

          for name in payload runtime; do
            decoded="recovered/diagnostics/${name}.decoded"
            echo "== ${name} file inspection ==" >> recovered/diagnostics/report.txt
            if [ -f "$decoded" ]; then
              file "$decoded" >> recovered/diagnostics/report.txt || true
              sha256sum "$decoded" >> recovered/diagnostics/report.txt || true
              if tar -tf "$decoded" > "recovered/diagnostics/${name}-tar-list.txt" 2>&1; then
                tar -xf "$decoded" -C "recovered/$name" || true
                echo "extract=tar-pass" >> recovered/diagnostics/report.txt
              elif unzip -t "$decoded" > "recovered/diagnostics/${name}-zip-test.txt" 2>&1; then
                unzip -q "$decoded" -d "recovered/$name" || true
                echo "extract=zip-pass" >> recovered/diagnostics/report.txt
              else
                cp "$decoded" "recovered/$name/decoded.bin"
                echo "extract=not-recognized" >> recovered/diagnostics/report.txt
              fi
            else
              echo "decoded file missing" >> recovered/diagnostics/report.txt
            fi
          done

          echo "== recovered tree ==" >> recovered/diagnostics/report.txt
          find recovered/payload recovered/runtime -maxdepth 10 -type f -printf '%p\t%s bytes\n' | sort >> recovered/diagnostics/report.txt
          cat recovered/diagnostics/report.txt

      - name: Upload recovered COFRE RC1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofre-rc1-recovered
          path: recovered/
          if-no-files-found: error
          retention-days: 7
