name: COFRE RC1 recover once

on:
  push:
    branches: [cofre-rc1-staging]
    paths:
      - '.github/workflows/cofre-rc1-recover-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover staged archives
        run: python3 .github/scripts/cofre_rc1_recover.py

      - name: Inspect and salvage decoded files
        shell: bash
        run: |
          set +e
          for name in payload runtime; do
            decoded="recovered/diagnostics/${name}.decoded"
            echo "== ${name} inspection ==" >> recovered/diagnostics/report.txt
            if [ -f "$decoded" ]; then
              file "$decoded" >> recovered/diagnostics/report.txt
              sha256sum "$decoded" >> recovered/diagnostics/report.txt
              tar -tf "$decoded" > "recovered/diagnostics/${name}-tar-list.txt" 2>&1
              tar_rc=$?
              if [ $tar_rc -eq 0 ]; then
                tar -xf "$decoded" -C "recovered/$name"
                echo "extract=tar-pass" >> recovered/diagnostics/report.txt
              else
                tar -xf "$decoded" -C "recovered/$name" --ignore-zeros 2> "recovered/diagnostics/${name}-tar-salvage.txt"
                if find "recovered/$name" -type f | grep -q .; then
                  echo "extract=tar-partial-salvage" >> recovered/diagnostics/report.txt
                elif unzip -t "$decoded" > "recovered/diagnostics/${name}-zip-test.txt" 2>&1; then
                  unzip -q "$decoded" -d "recovered/$name"
                  echo "extract=zip-pass" >> recovered/diagnostics/report.txt
                else
                  cp "$decoded" "recovered/$name/decoded.bin"
                  echo "extract=not-recognized" >> recovered/diagnostics/report.txt
                fi
              fi
            else
              echo "decoded file missing" >> recovered/diagnostics/report.txt
            fi
          done
          echo "== recovered tree ==" >> recovered/diagnostics/report.txt
          find recovered/payload recovered/runtime -maxdepth 10 -type f -printf '%p\t%s bytes\n' | sort >> recovered/diagnostics/report.txt
          cat recovered/diagnostics/report.txt
          exit 0

      - name: Upload recovered COFRE RC1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofre-rc1-recovered
          path: recovered/
          if-no-files-found: error
          retention-days: 7
