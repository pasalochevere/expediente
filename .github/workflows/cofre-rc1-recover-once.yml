name: COFRE RC1 recover once

on:
  push:
    branches: [cofre-rc1-staging]
    paths:
      - '.github/workflows/cofre-rc1-recover-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staged archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/payload recovered/runtime recovered/diagnostics

          cat cofre-rc1/payload/chunk-000 \
              cofre-rc1/payload/chunk-001 \
              cofre-rc1/payload/chunk-002 \
              cofre-rc1/payload/chunk-003 \
              > recovered/diagnostics/payload.raw
          git show 0e9d58315bd6d3fa0d30da9cab96dbd9d38efcee:cofre-rc1/payload/chunk-004005 \
              >> recovered/diagnostics/payload.raw

          cat cofre-rc1/runtime/chunk-* > recovered/diagnostics/runtime.raw

          decode_b64() {
            local name="$1"
            python3 - "$name" <<'PY'
          import base64, pathlib, string, sys
          name=sys.argv[1]
          p=pathlib.Path(f"recovered/diagnostics/{name}.raw")
          raw=p.read_bytes()
          alphabet=set((string.ascii_letters+string.digits+'+/=').encode())
          clean=bytes(b for b in raw if b in alphabet)
          removed=[b for b in raw if b not in alphabet]
          clean += b'=' * ((-len(clean)) % 4)
          pathlib.Path(f"recovered/diagnostics/{name}.b64").write_bytes(clean)
          decoded=base64.b64decode(clean, validate=True)
          pathlib.Path(f"recovered/diagnostics/{name}.gz").write_bytes(decoded)
          with open("recovered/diagnostics/report.txt","a",encoding="utf-8") as f:
              f.write(f"== {name} base64 ==\n")
              f.write(f"raw bytes: {len(raw)}\n")
              f.write(f"clean base64 bytes: {len(clean)}\n")
              f.write(f"removed bytes: {len(removed)}\n")
              if removed:
                  f.write("removed byte values: "+repr(sorted(set(removed)))+"\n")
          PY

            local gz="recovered/diagnostics/${name}.gz"
            local decoded="recovered/diagnostics/${name}.decoded"
            gzip -t "$gz"
            gzip -dc "$gz" > "$decoded"

            {
              echo "gzip bytes: $(wc -c < "$gz")"
              echo "decoded bytes: $(wc -c < "$decoded")"
              file "$gz"
              file "$decoded"
              sha256sum "$gz" "$decoded"
            } >> recovered/diagnostics/report.txt

            if tar -tf "$decoded" >/dev/null 2>&1; then
              tar -xf "$decoded" -C "recovered/$name"
              echo "format: tar" >> recovered/diagnostics/report.txt
            elif unzip -t "$decoded" >/dev/null 2>&1; then
              unzip -q "$decoded" -d "recovered/$name"
              echo "format: zip" >> recovered/diagnostics/report.txt
            else
              cp "$decoded" "recovered/$name/decoded.bin"
              echo "format: raw" >> recovered/diagnostics/report.txt
            fi
            echo >> recovered/diagnostics/report.txt
          }

          decode_b64 payload
          decode_b64 runtime

          echo "== recovered tree ==" >> recovered/diagnostics/report.txt
          find recovered/payload recovered/runtime -maxdepth 8 -type f -printf '%p\t%s bytes\n' | sort >> recovered/diagnostics/report.txt

      - name: Upload recovered COFRE RC1
        uses: actions/upload-artifact@v4
        with:
          name: cofre-rc1-recovered
          path: recovered/
          if-no-files-found: error
          retention-days: 7
