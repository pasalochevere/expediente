name: One-time release Torre V1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-torre-v16-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update digital naming, labels and portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          torre = Path('torre/index.html')
          portal = Path('portal/index.html')

          t = torre.read_text(encoding='utf-8')
          p = portal.read_text(encoding='utf-8')

          # V1.6 digital shell naming only. Physical manuals/names remain untouched as an annex.
          replacements_torre = {
            'MEGA PACK VERDAD O RETO + 800 · PasaloChevere · V1.5': 'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.6',
            'MEGA PACK VERDAD O RETO + 800': 'MEGA PACK VERDAD O RETO +800',
            'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.5': 'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.6',
          }
          for old,new in replacements_torre.items():
            t = t.replace(old,new)

          # Outer visible labels. Keep the four edition identities distinct.
          t = t.replace('TORRE 5 EN 1 DIGITAL · MEGA PACK', 'MEGA PACK VERDAD O RETO +800')
          t = t.replace('TORRE 5 EN 1 DIGITAL', 'MEGA PACK VERDAD O RETO +800')
          t = t.replace('832 RETOS Y PREGUNTAS', '832 CONTENIDOS')

          # Portal: product is now presented as the +800 annex / mega pack.
          p = p.replace('<h3>TORRE 5 EN 1 DIGITAL</h3><div class="accent">KIDS · GENERAL · FIESTA · SIN FILTRO</div><p>Mega Pack con 4 versiones y más de 800 contenidos para jugar desde el celular, con Torre o Solo Digital.</p>',
                        '<h3>MEGA PACK VERDAD O RETO +800</h3><div class="accent">KIDS · GENERAL · FIESTA 18+ · SIN FILTRO 18+</div><p>Anexo digital con 4 versiones y 832 contenidos. Se puede jugar con una torre física numerada o en modo Solo Digital.</p>')

          if 'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.6' not in t:
            raise SystemExit('No quedó aplicado el rótulo V1.6 en torre/index.html')
          if '<h3>MEGA PACK VERDAD O RETO +800</h3>' not in p:
            raise SystemExit('No quedó actualizado el producto en portal/index.html')

          torre.write_text(t, encoding='utf-8')
          portal.write_text(p, encoding='utf-8')
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre/index.html portal/index.html
          git commit -m "release: Torre Mega Pack V1.6 naming and portal" || true
          git rm .github/workflows/release-torre-v16-once.yml
          git commit -m "chore: remove one-time Torre V1.6 workflow"
          git push
