name: Temp Rev01 D11B 404 Probe
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11b-404.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright core
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Probe failed resources
        run: |
          cd /tmp/probe
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome not found');
          const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const p=await browser.newPage();
          p.on('response',r=>{if(r.status()>=400) console.log('HTTP_FAIL',r.status(),r.url())});
          p.on('requestfailed',r=>console.log('REQUEST_FAILED',r.url(),r.failure()?.errorText||''));
          p.on('console',m=>{if(m.type()==='error') console.log('CONSOLE_ERROR',m.text())});
          await p.goto('https://pasalochevere.github.io/expediente/caso001-rev01/?probe404=1',{waitUntil:'domcontentloaded',timeout:30000});
          await p.waitForTimeout(8000);
          await browser.close();
          JS
          node probe.mjs
