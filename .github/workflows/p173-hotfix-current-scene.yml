name: VINC P1.7.3 Scene Reload Safety
on:
  push:
    paths:
      - '.github/workflows/p173-hotfix-current-scene.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avoid stale current-scene id after page reload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vincores/index.html')
          s=p.read_text(encoding='utf-8')
          old="const $=id=>document.getElementById(id); let currentId=sessionStorage.getItem(CURRENT)||null;"
          new="const $=id=>document.getElementById(id); let currentId=null;"
          if old not in s: raise SystemExit('current scene init pattern missing')
          s=s.replace(old,new,1)
          s=s.replace("sessionStorage.setItem(CURRENT,currentId)","void 0")
          s=s.replace("sessionStorage.removeItem(CURRENT)","void 0")
          assert 'sessionStorage.setItem(CURRENT' not in s
          assert 'sessionStorage.removeItem(CURRENT' not in s
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'PasaloChevere Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vincores/index.html
          git commit -m 'Harden VÍNCORES scene library across reloads'
          git push origin HEAD:main
