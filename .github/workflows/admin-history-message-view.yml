name: Admin history message viewer
on:
  push:
    paths:
      - '.github/workflows/admin-history-message-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add message viewer to license history
        run: |
          set -euo pipefail
          mkdir -p admin-licencias/backups
          cp admin-licencias/index.html admin-licencias/backups/P1.7.4_before_history_message_view.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-licencias/index.html')
          s=p.read_text(encoding='utf-8')

          style='''<style id="history-message-style">
.historyMessageOverlay{position:fixed;inset:0;z-index:220;background:rgba(4,5,7,.78);backdrop-filter:blur(5px);display:none;place-items:center;padding:18px}.historyMessageOverlay.open{display:grid}.historyMessageCard{width:min(820px,100%);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1f2227,#15171b);border:1px solid #3c4149;border-radius:20px;padding:20px;box-shadow:0 28px 90px rgba(0,0,0,.45)}.historyMessageHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.historyMessageHead h2{margin:4px 0 0}.historyMessageMeta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.historyActions{display:flex;gap:7px;flex-wrap:wrap}.rowActions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}@media(max-width:900px){.rowActions{justify-content:flex-start}}
</style>'''
          if 'history-message-style' not in s:
              s=s.replace('</head>',style+'\n</head>',1)

          modal='''<div class="historyMessageOverlay" id="historyMessageOverlay">
  <section class="historyMessageCard">
    <div class="historyMessageHead"><div><div class="eyebrow">MENSAJE AL CLIENTE</div><h2 id="historyMessageTitle">Acceso</h2></div><button class="btn" id="historyMessageClose">Volver</button></div>
    <div class="historyMessageMeta"><span class="badge available" id="historyMessageStatus">SIN ACTIVAR</span><span class="code" id="historyMessageCode"></span></div>
    <div class="template" id="historyMessageText"></div>
    <div class="historyActions actions"><button class="btn primary" id="historyCopyMessage">Copiar mensaje</button><button class="btn" id="historyCopyCode">Copiar código</button><button class="btn ghost" id="historyMessageBack">Volver al historial</button></div>
  </section>
</div>'''
          if 'historyMessageOverlay' not in s:
              s=s.replace('</main>',modal+'\n</main>',1)

          old='''<div><button class="miniBtn" data-copy="${i}">Copiar código</button></div></article>`).join('');[...$('history').querySelectorAll('[data-copy]')].forEach(b=>b.onclick=async()=>{const r=rows[+b.dataset.copy];await copyText(r.license_key);b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar código',1000)})}'''
          new='''<div class="rowActions"><button class="miniBtn" data-message="${i}">Ver mensaje</button><button class="miniBtn" data-copy="${i}">Copiar código</button></div></article>`).join('');[...$('history').querySelectorAll('[data-message]')].forEach(b=>b.onclick=()=>showHistoryMessage(rows[+b.dataset.message]));[...$('history').querySelectorAll('[data-copy]')].forEach(b=>b.onclick=async()=>{const r=rows[+b.dataset.copy];await copyText(r.license_key);b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar código',1000)})}'''
          if old not in s:
              raise SystemExit('No se encontró renderHistory esperado')
          s=s.replace(old,new,1)

          marker='''async function loadHistory(){'''
          helper='''let historyMessageLicense=null;
function showHistoryMessage(r){
  historyMessageLicense=r;
  $('historyMessageTitle').textContent=r.product_name||productName(r.product_code);
  $('historyMessageCode').textContent=r.license_key||'';
  const st=$('historyMessageStatus');st.textContent=statusLabel(r.status);st.className='badge '+(r.status||'available');
  $('historyMessageText').textContent=buyerText({...r,product_name:r.product_name||productName(r.product_code),channel_name:r.channel_name||channelName(channelCodeFromSource(r.source))});
  $('historyMessageOverlay').classList.add('open');
}
function closeHistoryMessage(){$('historyMessageOverlay').classList.remove('open');historyMessageLicense=null}
'''
          if 'function showHistoryMessage' not in s:
              if marker not in s: raise SystemExit('No se encontró punto de inserción helper')
              s=s.replace(marker,helper+marker,1)

          old_handlers="""$('refreshBtn').onclick=loadHistory;$('search').oninput=renderHistory;"""
          new_handlers="""$('refreshBtn').onclick=loadHistory;$('search').oninput=renderHistory;$('historyMessageClose').onclick=closeHistoryMessage;$('historyMessageBack').onclick=closeHistoryMessage;$('historyMessageOverlay').onclick=e=>{if(e.target===$('historyMessageOverlay'))closeHistoryMessage()};$('historyCopyCode').onclick=async()=>{if(!historyMessageLicense)return;await copyText(historyMessageLicense.license_key);$('historyCopyCode').textContent='Código copiado';setTimeout(()=>$('historyCopyCode').textContent='Copiar código',1000)};$('historyCopyMessage').onclick=async()=>{if(!historyMessageLicense)return;await copyText($('historyMessageText').textContent);$('historyCopyMessage').textContent='Mensaje copiado';setTimeout(()=>$('historyCopyMessage').textContent='Copiar mensaje',1100)};"""
          if old_handlers not in s:
              raise SystemExit('No se encontró bloque de handlers')
          s=s.replace(old_handlers,new_handlers,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'PasaloChevere Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin-licencias/index.html admin-licencias/backups/P1.7.4_before_history_message_view.html
          git commit -m 'Add buyer message viewer to license history'
          git push origin HEAD:main
