name: PSQ80 Merge PDFs Browser QA
on:
  push:
    branches: [feat/psq80-staging-20261110]
    paths:
      - paper-squishy/psq80/test-builder.cjs
      - paper-squishy/psq80-builder.html
      - .github/workflows/psq80-builder-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Validate 60-page sources and 80-page merger
        run: node paper-squishy/psq80/test-builder.cjs
