name: Portal footer duration fix
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/portal-footer-duration-fix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch footer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('portal-v2/index.html')
          s=p.read_text(encoding='utf-8')
          old='<footer class="note" style="padding:18px 0 30px">PasaloChevere · Acceso personal · 12 meses desde la activación · Hasta 2 dispositivos.</footer>'
          new='<footer class="note" style="padding:18px 0 30px">PasaloChevere · Acceso personal · Vigencia según tu acceso · Hasta 2 dispositivos.</footer>'
          assert s.count(old)==1, f'footer anchor mismatch {s.count(old)}'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('footer duration copy OK')
          PY
      - name: Commit portal footer
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add portal-v2/index.html
          git diff --cached --check
          git commit -m "Portal: make generic duration copy flexible"
          git push
