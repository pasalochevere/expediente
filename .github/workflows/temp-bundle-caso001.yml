name: Temp bundle Caso001 runtime
on:
  push:
    paths:
      - '.github/workflows/temp-bundle-caso001.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Caso001 module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001/index.html').read_text()
          m=re.search(r'<script type="module">\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          src=m.group(1)
          src=re.sub(r'^import .*?;\s*$', '', src, count=1, flags=re.M)
          Path('/tmp/caso001-app.mjs').write_text(src)
          PY
          node --check /tmp/caso001-app.mjs || true
          npm install --no-save acorn@8 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'), acorn=require('acorn');
          const src=fs.readFileSync('/tmp/caso001-app.mjs','utf8');
          const stack=[]; const pairs={')':'(',']':'[','}':'{'};
          try{
            const t=acorn.tokenizer(src,{ecmaVersion:'latest',sourceType:'module',locations:true});
            while(true){const tok=t.getToken(); const l=tok.type.label; if(l==='eof')break;
              if(['(','[','{','${'].includes(l)) stack.push({open:l==='${'?'{':l,line:tok.loc.start.line,col:tok.loc.start.column});
              else if([')',']','}'].includes(l)){const want=pairs[l]; const top=stack[stack.length-1]; if(top&&top.open===want) stack.pop(); else console.log('MISMATCH close',l,'at',tok.loc.start,'top',top);}
            }
          }catch(e){console.log('TOKENIZER ERROR',e.message,e.loc||'');}
          console.log('UNMATCHED STACK',JSON.stringify(stack.slice(-20),null,2));
          NODE
          exit 1
