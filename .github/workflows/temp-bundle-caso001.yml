name: Temp bundle Caso001 runtime
on:
  push:
    paths:
      - '.github/workflows/temp-bundle-caso001.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing refresh brace and validate JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('caso001/index.html')
          s=p.read_text()
          old="finally{refreshing=false;if(pendingRefresh){pendingRefresh=false;setTimeout(()=>refresh(),100)}}\nasync function doAction"
          new="finally{refreshing=false;if(pendingRefresh){pendingRefresh=false;setTimeout(()=>refresh(),100)}}}\nasync function doAction"
          if old not in s:
              raise SystemExit('refresh anchor not found or already fixed')
          s=s.replace(old,new,1)
          p.write_text(s)
          m=re.search(r'<script type="module">\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/caso001-app.mjs').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/caso001-app.mjs'],check=True)
          print('Caso001 module syntax OK')
          PY
      - name: Commit fix
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html
          git commit -m "P2.12C.7C fix Caso001 startup syntax"
          git push
