name: EXP01 EN1 bilingual presentation patch
on:
  push:
    paths:
      - '.github/workflows/exp01-en1-patch-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EXP01-EN1 presentation-only language layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              found=text.count(old)
              if found!=count:
                  raise SystemExit(f'{label}: expected {count}, found {found}')
              return text.replace(old,new,count)

          # ---------- multiplayer adapter: presentation labels only ----------
          p=Path('caso001/p2-multiplayer-adapter.js')
          s=p.read_text(encoding='utf-8')
          s=must_replace(s,
            "// que el CTA inferior cuando ya están activos, sin modificar la estética.\n\nexport const P2_CONFIG",
            "// que el CTA inferior cuando ya están activos, sin modificar la estética.\n\nimport {t} from './i18n.js';\n\nexport const P2_CONFIG",
            'adapter import')
          s=must_replace(s,"normal.textContent=P2_MODES.dig.label;","normal.textContent=t('mode.dig.label');",'normal mode label')
          s=must_replace(s,"impostor.textContent=P2_MODES.imp.label;","impostor.textContent=t('mode.imp.label');",'impostor mode label')
          s=must_replace(s,
            "const meta=P2_MODES[select.value]||P2_MODES.dig;\n    help.innerHTML=`<strong style=\"color:#d7b675\">${meta.short}</strong> · ${meta.description}`;",
            "const key=select.value==='imp'?'imp':'dig';\n    help.innerHTML=`<strong style=\"color:#d7b675\">${t(`mode.${key}.short`)}</strong> · ${t(`mode.${key}.description`)}`;",
            'mode help')
          s=must_replace(s,
            "if(typeof document!=='undefined'){\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hydrateEntryUi,{once:true});\n  else queueMicrotask(hydrateEntryUi);\n}",
            "if(typeof document!=='undefined'){\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hydrateEntryUi,{once:true});\n  else queueMicrotask(hydrateEntryUi);\n}\nif(typeof window!=='undefined')window.addEventListener('expedientes:languagechange',hydrateModeSelector);",
            'adapter language listener')
          p.write_text(s,encoding='utf-8')

          # ---------- main Caso 001 ----------
          p=Path('caso001/index.html')
          s=p.read_text(encoding='utf-8')

          lang_css='''\n/* EXP01-EN1 · presentation-only language selector */\n.languageSwitcher{display:inline-flex;align-items:center;gap:5px;border:1px solid #5c4630;background:#100e0c;border-radius:6px;padding:4px 5px;white-space:nowrap}.languageSwitcher button{border:0;background:transparent;color:#8f806f;padding:4px 6px;font-size:10px;font-weight:950;letter-spacing:.08em;cursor:pointer}.languageSwitcher button.active{color:#f0d29b;background:#2a2015;border-radius:4px;box-shadow:inset 0 0 0 1px #775a34}.languageSwitcher .langSep{color:#5f5142;font-size:9px}\nhtml[lang="en"] .dossierIntro:after{content:"CONFIDENTIAL"}html[lang="en"] .scenePaper:after{content:"CONFIDENTIAL"}html[lang="en"] .roomHead:after{content:"INVESTIGATION ROOM"}html[lang="en"] .inviteDossier:after{content:"INVITATION"}html[lang="en"] .characterDossierPreview:after{content:"PUBLIC FILE"}html[lang="en"] .dossierChar.selected .portraitReal:before{content:"SELECTED"}html[lang="en"] .privateIdentity:after{content:"ONLY YOU"}html[lang="en"] .classifiedPocket:after{content:"CLASSIFIED"}html[lang="en"] .ev-private:before{content:"PRIVATE FILE"}html[lang="en"] .evForensic:after{content:"FORENSIC"}html[lang="en"] .theoryCard.sus:after{content:"IN FOCUS"}html[lang="en"] .motiveLabel:after{content:"HYPOTHESIS"}html[lang="en"] .accHero:after{content:"ACCUSATION"}html[lang="en"] .accChoice.selected:after{content:"SELECTED"}html[lang="en"] .accLockedCase:after{content:"LOCKED"}\n@media(max-width:560px){.languageSwitcher{padding:3px 4px}.languageSwitcher button{font-size:9px;padding:4px 5px}}\n'''
          s=must_replace(s,"</style>\n</head>",lang_css+"</style>\n</head>",'main language css')

          switcher='<div class="languageSwitcher" role="group" aria-label="Idioma / Language"><button type="button" data-exp-lang="es" aria-pressed="false">ES</button><span class="langSep">|</span><button type="button" data-exp-lang="en" aria-pressed="false">EN</button></div>'
          s=must_replace(s,
            '<div class="prologueTopActions"><button id="prologueSound" class="prologueMiniBtn" type="button">🔇 ACTIVAR AMBIENTE</button>',
            '<div class="prologueTopActions">'+switcher+'<button id="prologueSound" class="prologueMiniBtn" type="button">🔇 ACTIVAR AMBIENTE</button>',
            'legacy prologue switcher')
          s=must_replace(s,
            '<div class="revTopActions"><button id="replayPrologue" class="replayPrologue" type="button">VER PRÓLOGO</button><a class="tag" href="../caso001/printables/" target="_blank" rel="noopener">KIT IMPRIMIBLE</a></div>',
            '<div class="revTopActions">'+switcher+'<button id="replayPrologue" class="replayPrologue" type="button" data-i18n="header.replay">VER PRÓLOGO</button><a class="tag" href="../caso001/printables/" target="_blank" rel="noopener" data-i18n="header.printKit">KIT IMPRIMIBLE</a></div>',
            'main header switcher')

          static_repls=[
            ('<button id="prologueSkip" class="prologueMiniBtn" type="button">SALTAR INTRO</button>','<button id="prologueSkip" class="prologueMiniBtn" type="button" data-i18n="prologue.skip">SALTAR INTRO</button>','prologue skip'),
            ('<button id="prologuePrev" class="prologueBtn" type="button">← ANTERIOR</button>','<button id="prologuePrev" class="prologueBtn" type="button" data-i18n="prologue.previous">← ANTERIOR</button>','prologue prev'),
            ('<div class="seg"><button id="tabCreate" class="active">Crear sala</button><button id="tabJoin">Unirme</button></div>','<div class="seg"><button id="tabCreate" class="active" data-i18n="setup.createRoom">Crear sala</button><button id="tabJoin" data-i18n="setup.join">Unirme</button></div>','setup tabs'),
            ('<label>Tu nombre</label><input id="displayName" maxlength="50" placeholder="Investigador">','<label data-i18n="setup.name">Tu nombre</label><input id="displayName" maxlength="50" placeholder="Investigador" data-i18n-placeholder="setup.namePlaceholder">','name field'),
            ('<label>Licencia</label><input id="licenseKey" autocomplete="off" placeholder="Código de acceso">','<label data-i18n="setup.license">Licencia</label><input id="licenseKey" autocomplete="off" placeholder="Código de acceso" data-i18n-placeholder="setup.licensePlaceholder">','license field'),
            ('<div class="field"><label>Modo</label><select id="mode">','<div class="field"><label data-i18n="setup.mode">Modo</label><select id="mode">','mode field'),
            ('<label>Código de sala</label><input id="roomCode" maxlength="12" autocomplete="off" placeholder="ABC123">','<label data-i18n="setup.roomCode">Código de sala</label><input id="roomCode" maxlength="12" autocomplete="off" placeholder="ABC123" data-i18n-placeholder="setup.roomPlaceholder">','room field'),
            ('<label>Tu personaje</label><div id="characterGrid"','<label data-i18n="setup.character">Tu personaje</label><div id="characterGrid"','character field'),
            ('<div class="charactersHint">ELEGÍ UNA IDENTIDAD PARA INGRESAR AL EXPEDIENTE.</div>','<div class="charactersHint" data-i18n="setup.characterHint">ELEGÍ UNA IDENTIDAD PARA INGRESAR AL EXPEDIENTE.</div>','character hint'),
            ('<a href="../portal-v2/">ABRIR MI PORTAL</a><span>También podés ingresar tu código de acceso en el campo Licencia.</span>','<a href="../portal-v2/" data-i18n="setup.openPortal">ABRIR MI PORTAL</a><span data-i18n="setup.portalHelp">También podés ingresar tu código de acceso en el campo Licencia.</span>','entry help'),
            ('<button id="rejoinLast" class="btn hidden">Reingresar a mi última sala</button>','<button id="rejoinLast" class="btn hidden" data-i18n="setup.rejoin">Reingresar a mi última sala</button>','rejoin button'),
            ('<div class="muted">CÓDIGO DE SALA</div>','<div class="muted" data-i18n="room.code">CÓDIGO DE SALA</div>','room code label'),
            ('<span class="muted">FASE</span>','<span class="muted" data-i18n="game.phase">FASE</span>','phase label'),
            ('<section class="panel"><h2 style="margin-top:0">Expediente público</h2>','<section class="panel"><h2 style="margin-top:0" data-i18n="game.publicFile">Expediente público</h2>','public file title'),
            ('<small>EXPEDIENTES · CASO 001</small><b>Dossier privado</b>','<small>EXPEDIENTES · CASO 001</small><b data-i18n="game.privateDossier">Dossier privado</b>','private dossier title'),
            ('<button id="privacyToggle" class="privacyToggle" type="button">OCULTAR INFORMACIÓN</button>','<button id="privacyToggle" class="privacyToggle" type="button" data-i18n="game.hidePrivate">OCULTAR INFORMACIÓN</button>','privacy button'),
            ('<div><b>Información privada oculta</b><span>Volvé a mostrarla cuando nadie más esté mirando la pantalla.</span></div>','<div><b data-i18n="game.privateHidden">Información privada oculta</b><span data-i18n="game.privateHiddenHelp">Volvé a mostrarla cuando nadie más esté mirando la pantalla.</span></div>','privacy cover'),
            ('<h2>Tablero de investigación</h2>','<h2 data-i18n="board.title">Tablero de investigación</h2>','board title'),
            ('<div class="theoryTitle"><h3>PERSONAS</h3><span>¿QUIÉN?</span></div>','<div class="theoryTitle"><h3 data-i18n="board.people">PERSONAS</h3><span data-i18n="board.who">¿QUIÉN?</span></div>','people heading'),
            ('<div class="theoryTitle"><h3>ESCENARIOS</h3><span>¿DÓNDE?</span></div>','<div class="theoryTitle"><h3 data-i18n="board.locations">ESCENARIOS</h3><span data-i18n="board.where">¿DÓNDE?</span></div>','locations heading'),
            ('<div class="theoryTitle"><h3>OBJETOS</h3><span>¿CON QUÉ ELEMENTO?</span></div>','<div class="theoryTitle"><h3 data-i18n="board.objects">OBJETOS</h3><span data-i18n="board.withWhat">¿CON QUÉ ELEMENTO?</span></div>','objects heading'),
            ('<textarea id="motiveTheory" maxlength="800" placeholder="Escribí tu hipótesis de motivo, contradicciones o conexión entre evidencias…"></textarea>','<textarea id="motiveTheory" maxlength="800" placeholder="Escribí tu hipótesis de motivo, contradicciones o conexión entre evidencias…" data-i18n-placeholder="board.motivePlaceholder"></textarea>','motive placeholder'),
            ('<button id="clearMarks" class="btn">LIMPIAR MARCAS</button><button id="clearHistory" class="btn">LIMPIAR HISTORIAL</button>','<button id="clearMarks" class="btn" data-i18n="board.clearMarks">LIMPIAR MARCAS</button><button id="clearHistory" class="btn" data-i18n="board.clearHistory">LIMPIAR HISTORIAL</button>','board clear buttons'),
            ('<small>COMUNICACIONES · ASISTENCIA</small><b>Director del caso</b>','<small>COMUNICACIONES · ASISTENCIA</small><b data-i18n="director.title">Director del caso</b>','director title'),
            ('<small>REGISTRO COMPARTIDO</small><b>Bitácora del expediente</b>','<small data-i18n="log.shared">REGISTRO COMPARTIDO</small><b data-i18n="log.title">Bitácora del expediente</b>','log title')
          ]
          for old,new,label in static_repls:
              s=must_replace(s,old,new,label)

          s=must_replace(s,
            "import {P2MultiplayerAdapter,P2_LABELS,findStoredLicense,lastRoomCode,remainingSeconds,formatClock} from '../caso001/p2-multiplayer-adapter.js?v=prod-d12a-20260920';",
            "import {P2MultiplayerAdapter,P2_LABELS,findStoredLicense,lastRoomCode,remainingSeconds,formatClock} from '../caso001/p2-multiplayer-adapter.js?v=exp01-en1-20261001';\nimport {t,getLanguage,bindLanguageSwitcher,applyTranslations,languageLocale} from './i18n.js?v=exp01-en1-20261001';",
            'main imports')

          s=must_replace(s,
            "$('#prologueNext').textContent=prologueIndex===PROLOGUE_SCENES.length-1?'ABRIR EXPEDIENTE →':'CONTINUAR →';",
            "$('#prologueNext').textContent=prologueIndex===PROLOGUE_SCENES.length-1?t('prologue.open'):t('prologue.continue');",
            'legacy prologue next')
          s=must_replace(s,"if(b)b.textContent='🔇 ACTIVAR AMBIENTE'","if(b)b.textContent=t('prologue.soundOff')",'legacy sound off')
          s=must_replace(s,"prologueSoundOn=true;$('#prologueSound').textContent='🔊 AMBIENTE ACTIVO';","prologueSoundOn=true;$('#prologueSound').textContent=t('prologue.soundOn');",'legacy sound on')

          s=must_replace(s,
            "stateText=state===1?'EN FOCO':state===2?'DESCARTADO':'ARCHIVO ABIERTO'",
            "stateText=state===1?t('board.focus'):state===2?t('board.discarded'):t('board.open')",
            'theory state')

          s=must_replace(s,
            "function roomInviteUrl(code){const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('room',String(code||'').trim().toUpperCase());return u.toString()}",
            "function roomInviteUrl(code){const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('room',String(code||'').trim().toUpperCase());u.searchParams.set('lang',getLanguage());return u.toString()}",
            'invite lang')

          s=must_replace(s,
            "const statusLabel=room.status==='waiting'?'ESPERANDO':room.status==='active'?'EN CURSO':room.status==='finished'?'FINALIZADO':String(room.status||'—').toUpperCase();",
            "const statusLabel=room.status==='waiting'?t('room.waiting'):room.status==='active'?t('room.active'):room.status==='finished'?t('room.finished'):String(room.status||'—').toUpperCase();",
            'room status')
          s=must_replace(s,"<span class=\"pill\">${players.length}/6 HUMANOS</span>","<span class=\"pill\">${players.length}/6 ${t('room.humans')}</span>",'humans label')
          s=must_replace(s,
            "$('#lobbyStats').innerHTML=`<span>${players.length} INVESTIGADOR${players.length===1?'':'ES'} HUMANO${players.length===1?'':'S'}</span><span>${npcCount} NPC</span><span class=\"${ready?'ready':'pending'}\">${ready?'✓ EQUIPO LISTO':'FALTAN '+Math.max(0,3-players.length)+' HUMANO'+(Math.max(0,3-players.length)===1?'':'S')}</span>`;",
            "const humanLabel=players.length===1?t('room.investigator'):t('room.investigators'),missing=Math.max(0,3-players.length);$('#lobbyStats').innerHTML=`<span>${players.length} ${humanLabel}</span><span>${npcCount} ${t('room.npc')}</span><span class=\"${ready?'ready':'pending'}\">${ready?t('room.teamReady'):(missing===1?t('room.missingHuman'):t('room.missingHumans',{count:missing}))}</span>`;",
            'lobby stats')
          s=must_replace(s,"${p.is_host?'ANFITRIÓN · HOST':'JUGADOR CONECTADO'}","${p.is_host?t('room.host'):t('room.connected')}",'lobby human badge')
          s=must_replace(s,"<span class=\"playerName\">PERSONAJE SIN JUGADOR</span>","<span class=\"playerName\">${t('room.noPlayer')}</span>",'lobby npc name')
          s=must_replace(s,"<span class=\"lobbyBadge npc\">NPC AUTOMÁTICO</span>","<span class=\"lobbyBadge npc\">${t('room.autoNpc')}</span>",'lobby npc badge')
          s=must_replace(s,"ABRIR EXPEDIENTE</button>","${t('room.openCase')}</button>",'start button')
          s=must_replace(s,"<button class=\"btn whatsapp\" id=\"shareWhatsApp\">WHATSAPP</button><button class=\"btn\" id=\"copyInviteLink\">COPIAR ENLACE</button><button class=\"btn\" id=\"copyCode\">COPIAR CÓDIGO</button>","<button class=\"btn whatsapp\" id=\"shareWhatsApp\">${t('room.whatsapp')}</button><button class=\"btn\" id=\"copyInviteLink\">${t('room.copyLink')}</button><button class=\"btn\" id=\"copyCode\">${t('room.copyCode')}</button>",'lobby buttons')

          s=must_replace(s,"$('#publicEvidence').innerHTML='<div class=\"empty\">Todavía no se liberaron evidencias.</div>';return","$('#publicEvidence').innerHTML=`<div class=\"empty\">${t('evidence.none')}</div>`;return",'no evidence')
          s=must_replace(s,"html+=`<div class=\"evidenceStage\"><b>ETAPA ${stage}</b><span>${xs.length} REGISTRO${xs.length===1?'':'S'}</span></div>`","html+=`<div class=\"evidenceStage\"><b>${t('evidence.stage',{stage})}</b><span>${xs.length===1?t('evidence.record'):t('evidence.records',{count:xs.length})}</span></div>`",'evidence stage')
          s=must_replace(s,"if(button)button.textContent=privateInfoHidden?'MOSTRAR INFORMACIÓN':'OCULTAR INFORMACIÓN'","if(button)button.textContent=privateInfoHidden?t('game.showPrivate'):t('game.hidePrivate')",'private toggle')
          s=must_replace(s,"function eventClock(value){const d=new Date(value||'');if(Number.isNaN(d.getTime()))return '—';return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}","function eventClock(value){const d=new Date(value||'');if(Number.isNaN(d.getTime()))return '—';return d.toLocaleTimeString(languageLocale(),{hour:'2-digit',minute:'2-digit'})}",'event locale')

          s=must_replace(s,
            "if(room.status==='active')html+=`<button class=\"btn directorPrimary\" id=\"directorHelp\"><span>PEDIR ORIENTACIÓN AL DIRECTOR</span><span>CANAL →</span></button>`;",
            "if(room.status==='active')html+=`<button class=\"btn directorPrimary\" id=\"directorHelp\"><span>${t('director.ask')}</span><span>${t('director.channel')}</span></button>`;",
            'director ask')
          s=must_replace(s,
            "if(Number(state.stage||1)<3&&!state.accusation_locked)host+='<button class=\"btn\" id=\"advanceStage\">ADELANTAR ETAPA</button>';host+=`<button class=\"btn\" id=\"pause\">${state.paused?'REANUDAR':'PAUSAR'}</button><button class=\"btn\" id=\"addTime\">+2 MIN</button>`;html+=`<div class=\"hostControls\"><div class=\"hostControlsLabel\">CONTROLES DEL ANFITRIÓN</div><div class=\"hostControlGrid\">${host}</div></div>`}",
            "if(Number(state.stage||1)<3&&!state.accusation_locked)host+=`<button class=\"btn\" id=\"advanceStage\">${t('director.advance')}</button>`;host+=`<button class=\"btn\" id=\"pause\">${state.paused?t('director.resume'):t('director.pause')}</button><button class=\"btn\" id=\"addTime\">${t('director.addTime')}</button>`;html+=`<div class=\"hostControls\"><div class=\"hostControlsLabel\">${t('director.hostControls')}</div><div class=\"hostControlGrid\">${host}</div></div>`}",
            'host controls')
          s=must_replace(s,"$('#controls').innerHTML=html||'<span class=\"muted\">El canal del Director estará disponible durante la partida.</span>';","$('#controls').innerHTML=html||`<span class=\"muted\">${t('director.available')}</span>`;",'director empty')
          s=must_replace(s,
            "$('#gameMeta').innerHTML=`<span class=\"pill gold\">${room.mode==='imp'?'IMPOSTOR':'NORMAL'}</span><span class=\"pill ${state.paused?'warn':'good'}\">${state.paused?'PAUSADO':room.status==='finished'?'FINALIZADO':'EN CURSO'}</span>`;$('#stageLabel').textContent=`ETAPA ${Number(state.stage||1)}`;",
            "$('#gameMeta').innerHTML=`<span class=\"pill gold\">${room.mode==='imp'?t('mode.imp.short'):t('mode.dig.short')}</span><span class=\"pill ${state.paused?'warn':'good'}\">${state.paused?t('status.paused'):room.status==='finished'?t('status.finished'):t('status.running')}</span>`;$('#stageLabel').textContent=t('game.stage',{stage:Number(state.stage||1)});",
            'game meta')

          s=must_replace(s,"if(!adapterReady){setEntryError(adapterInitError||'El motor todavía se está inicializando. Esperá un instante y volvé a intentar.');return}","if(!adapterReady){setEntryError(adapterInitError||t('error.engineStarting'));return}",'engine error')
          s=must_replace(s,"const msg='Para crear una sala, abrí el juego desde Mi Portal o ingresá tu código de acceso. Unirse a una sala no requiere licencia.';","const msg=t('error.createNeedsAccess');",'access error')
          s=must_replace(s,"if(!code)throw new Error('Ingresá el código de sala.');","if(!code)throw new Error(t('error.roomCode'));",'room code error')

          s=must_replace(s,
            "if(runtime){runtime.classList.toggle('ready',adapterReady);runtime.classList.toggle('bad',!!adapterInitError);runtime.innerHTML=`<span class=\"runtimeDot\"></span><span>${adapterInitError?'MOTOR NO DISPONIBLE':adapterReady?'MOTOR P2 LISTO':'INICIALIZANDO MOTOR…'}</span>`}if(access)access.innerHTML=key?'<strong>ACCESO CARGADO</strong> · listo para crear sala':signed?'<strong>SESIÓN IDENTIFICADA</strong> · el servidor buscará tu acceso activo':'Falta cargar un acceso para crear una sala';",
            "if(runtime){runtime.classList.toggle('ready',adapterReady);runtime.classList.toggle('bad',!!adapterInitError);runtime.innerHTML=`<span class=\"runtimeDot\"></span><span>${adapterInitError?t('setup.engineUnavailable'):adapterReady?t('setup.engineReady'):t('setup.engineStarting')}</span>`}if(access)access.innerHTML=key?`<strong>${t('setup.accessLoaded')}</strong> · ${t('setup.readyCreate')}`:signed?`<strong>${t('setup.sessionIdentified')}</strong> · ${t('setup.serverFindAccess')}`:t('setup.missingAccess');",
            'entry runtime text')
          s=must_replace(s,
            "button.textContent=!adapterReady?'INICIALIZANDO…':entryMode==='create'?'Crear sala':'Unirme a la sala'",
            "button.textContent=!adapterReady?t('setup.initializing'):entryMode==='create'?t('setup.createCta'):t('setup.joinCta')",
            'entry cta text')

          language_fn='''\nfunction refreshLanguagePresentation(){\n  applyTranslations(document);\n  bindLanguageSwitcher(document);\n  buildCharacters();\n  buildTheory();\n  updateAccessPreflight();\n  if(view){renderLobby();renderGame()}\n  if(!$('#prologue').classList.contains('hidden'))renderPrologueScene();\n}\nwindow.addEventListener('expedientes:languagechange',refreshLanguagePresentation);\n'''
          s=must_replace(s,"buildCharacters();buildTheory();const urlParams=new URLSearchParams(location.search);",language_fn+"\nbindLanguageSwitcher(document);applyTranslations(document);buildCharacters();buildTheory();const urlParams=new URLSearchParams(location.search);",'language init')
          p.write_text(s,encoding='utf-8')

          # ---------- Cinema intro ----------
          p=Path('caso001/intro/index.html')
          s=p.read_text(encoding='utf-8')
          intro_css='.languageSwitcher{display:inline-flex;align-items:center;gap:3px;border:1px solid rgba(210,164,99,.35);background:rgba(14,12,10,.82);border-radius:6px;padding:3px 4px}.languageSwitcher button{border:0;background:transparent;color:#9f8a70;padding:4px 5px;font-size:9px;font-weight:950;cursor:pointer}.languageSwitcher button.active{color:#f1d3a0;background:#2b2116;border-radius:4px}.languageSwitcher .langSep{color:#695943;font-size:8px}@media(max-width:620px){.languageSwitcher button{font-size:7px;padding:3px 4px}}'
          s=must_replace(s,"</style></head>",intro_css+"</style></head>",'intro css')
          intro_switch='<div class="languageSwitcher" role="group" aria-label="Idioma / Language"><button type="button" data-exp-lang="es" aria-pressed="false">ES</button><span class="langSep">|</span><button type="button" data-exp-lang="en" aria-pressed="false">EN</button></div>'
          s=must_replace(s,"<div class=\"controls\"><button class=\"btn\" id=\"soundBtn\">🔇 SONIDO</button>","<div class=\"controls\">"+intro_switch+"<button class=\"btn\" id=\"soundBtn\" data-i18n=\"intro.soundOff\">🔇 SONIDO</button>",'intro switch')
          intro_repls=[
