name: One-time finalize Torre labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-torre-labels-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update embedded game labels to V1.6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, base64

          p = Path('torre/index.html')
          s = p.read_text(encoding='utf-8')

          m = re.search(r'const GAMES=(\{.*?\});\s*const TITLES=', s, re.S)
          if not m:
              raise SystemExit('GAMES block not found')

          games = json.loads(m.group(1))
          changed = []
          for key, b64 in games.items():
              html = base64.b64decode(b64).decode('utf-8')
              new = html.replace('V1.5', 'V1.6')
              if key == 'kids':
                  new = new.replace('Torre General', 'Torre Kids')
              if new != html:
                  changed.append(key)
              games[key] = base64.b64encode(new.encode('utf-8')).decode('ascii')

          block = json.dumps(games, ensure_ascii=False, separators=(',', ':'))
          s = s[:m.start(1)] + block + s[m.end(1):]
          s = s.replace('MEGA PACK VERDAD O RETO + 800 · PasaloChevere · V1.5', 'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.6')
          s = s.replace('MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.5', 'MEGA PACK VERDAD O RETO +800 · PasaloChevere · V1.6')
          p.write_text(s, encoding='utf-8')
          print('updated:', ', '.join(changed))
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre/index.html
          git commit -m "fix: finalize Mega Pack V1.6 internal labels"
          git rm .github/workflows/finalize-torre-labels-once.yml
          git commit -m "chore: remove one-time Torre labels workflow"
          git push
