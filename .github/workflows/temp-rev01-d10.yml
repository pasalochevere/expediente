name: Temp Rev01 D10 Cinematic Reveal
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d10.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D10
        run: python .github/scripts/patch_rev01_d10.py
      - name: Validate D10
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=['P2.12D.10 · CINEMATIC REVEAL','solutionVisual','truthCard','RECONSTRUCCIÓN OFICIAL','RESPONSABLE','ESCENA CLAVE','OBJETO CLAVE','CONTRADICCIÓN DECISIVA','SEÑUELOS EXPLICADOS','EXPEDIENTE CERRADO']
          for t in required: assert t in s,t
          for f in ['killer_character_name','location_name','object_name','motive','contradiction','critical_event','mechanism','post_crime_action','reconstruction','red_herrings','closing']:
              assert f in s,f
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m,'module script missing'
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d10.js').write_text(code)
          print('D10 cinematic reveal PASS · server solution fields preserved')
          PY
          node --check /tmp/rev01-d10.js
      - name: Commit D10
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.10 cinematic reveal"
          git push
