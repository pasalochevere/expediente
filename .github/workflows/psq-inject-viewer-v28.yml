name: PSQ Inject Viewer V28
on:
  push:
    paths:
      - '.github/workflows/psq-inject-viewer-v28.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject independent 9-view gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('paper-squishy/factory.html')
          s=p.read_text(encoding='utf-8')
          marker="html=html.replace('</body>','<script src=\"./psq-i18n-v26.js?v=2600\"></scr'+'ipt></body>');"
          inject="html=html.replace('</body>','<script src=\"./psq-viewer-v28.js?v=2801\"></scr'+'ipt></body>');\n  "+marker
          if 'psq-viewer-v28.js' not in s:
              if marker not in s: raise SystemExit('i18n marker not found')
              s=s.replace(marker,inject)
          s=s.replace('PSQ 2.7R1 · Creator Plus · 60 personajes','PSQ 2.8 · Creator Plus · 60 personajes')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add paper-squishy/factory.html
          git commit -m 'fix(psq): activate independent 9-view gallery v2.8' || exit 0
          git push
