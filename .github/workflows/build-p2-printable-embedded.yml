name: Build P2 printable embedded art

on:
  push:
    branches: ["mejora-caso001-p2"]
    paths:
      - ".github/workflows/build-p2-printable-embedded.yml"
      - "caso001/printables/generator-p2.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mejora-caso001-p2
          fetch-depth: 0

      - name: Build self-contained printable
        shell: python
        run: |
          from pathlib import Path
          import re

          root=Path('index.html').read_text(encoding='utf-8')
          gen=Path('caso001/printables/generator-p2.html').read_text(encoding='utf-8')

          def extract_array(name):
              m=re.search(r'const\s+'+re.escape(name)+r'\s*=\s*(\[[\s\S]*?\]);',root)
              if not m: raise SystemExit(f'No se encontró array {name}')
              raw=m.group(1)
              if raw.count('data:image/') < 6: raise SystemExit(f'{name}: banco incompleto')
              return raw

          def extract_object(name):
              m=re.search(r'const\s+'+re.escape(name)+r'\s*=\s*(\{[\s\S]*?\});',root)
              if not m: raise SystemExit(f'No se encontró objeto {name}')
              raw=m.group(1)
              if raw.count('data:image/') < 6: raise SystemExit(f'{name}: banco incompleto')
              return raw

          portraits=extract_object('portraits')
          locations=extract_array('locationImages')
          objects=extract_array('weaponImages')

          # UI de producto: sin marcas técnicas visibles.
          gen=gen.replace('<title>EXPEDIENTES · Caso 001 · Generador imprimible P2.11F</title>',
                          '<title>EXPEDIENTES · Caso 001 · La Última Reunión · Kit imprimible</title>',1)
          gen=gen.replace('<b>EXPEDIENTES · CASO 001 · P2.11F</b><h1>Generador imprimible P2 V1</h1>',
                          '<b>EXPEDIENTES · CASO 001</b><h1>LA ÚLTIMA REUNIÓN · KIT IMPRIMIBLE</h1>',1)
          gen=gen.replace('<div class="dev">DESARROLLO · NO PUBLICAR CON PACKS EN CLIENTE</div>','',1)
          gen=gen.replace('.controls{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}',
                          '.controls{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px}',1)
          gen=gen.replace('.qa-panel{max-width:1240px',
                          '.dev-only{display:none!important}.qa-panel{max-width:1240px',1)
          gen=gen.replace('<div class="field filebtn"><label>Carga manual</label><button>Cargar JSON local</button><input id="file" type="file" accept=".json,application/json"></div>',
                          '<div class="field filebtn dev-only"><label>Carga manual</label><button>Cargar JSON local</button><input id="file" type="file" accept=".json,application/json"></div>',1)
          gen=gen.replace('<div id="qa" class="qa-panel no-print">',
                          '<div id="qa" class="qa-panel no-print dev-only">',1)

          marker='const TYPE_LABEL='
          if marker not in gen: raise SystemExit('Falta TYPE_LABEL')
          embedded=(
              'const ART={\n'
              f' portraits:{portraits},\n'
              f' locations:{locations},\n'
              f' objects:{objects}\n'
              '};\n'
              'function artImg(src,alt,fallback){return src?`<img src="${src}" alt="${esc(alt)}">`:`<span class="fallback-letter">${esc(fallback)}</span>`}\n'
          )
          gen=gen.replace(marker,embedded+marker,1)

          gen=gen.replace('const people=CHARS.map(c=>','const people=CHARS.map((c,i)=>',1)
          gen=gen.replace('const scenes=LOCS.map(x=>','const scenes=LOCS.map((x,i)=>',1)
          gen=gen.replace('const objects=OBJS.map(x=>','const objects=OBJS.map((x,i)=>',1)
          gen=gen.replace('${c.name.slice(0,1)}','${artImg(ART.portraits[i],c.name,c.name.slice(0,1))}',1)
          sym='<div class="symbol">${x[2]}</div>'
          if gen.count(sym) < 2: raise SystemExit('Faltan placeholders de escena/objeto')
          gen=gen.replace(sym,'<div class="symbol">${artImg(ART.locations[i],x[1],x[2])}</div>',1)
          gen=gen.replace(sym,'<div class="symbol">${artImg(ART.objects[i],x[1],x[2])}</div>',1)

          css=(
              '.portrait{overflow:hidden}\n'
              '.portrait img{width:100%;height:100%;object-fit:cover;display:block}\n'
              '.symbol{overflow:hidden;align-self:stretch;min-height:48mm;display:grid;place-items:center;background:var(--paper2);font-size:30pt;text-align:center}\n'
              '.symbol img{width:100%;height:100%;object-fit:cover;display:block}\n'
              '.eco .portrait img,.eco .symbol img{filter:grayscale(1) contrast(1.05)}\n'
              '.fallback-letter{font:900 26pt Georgia,serif}\n'
          )
          gen=gen.replace('.card-copy{padding:5mm}',css+'.card-copy{padding:5mm}',1)
          gen=gen.replace('Kit base listo. Cargá un Crime Pack para generar evidencias dinámicas.',
                          'Kit base listo. Seleccioná un Crime Pack para generar las evidencias correspondientes.')
          gen=gen.replace('<b>QA P2.11F:</b>','<b>QA P2.11F-FIX3:</b> Arte embebido 18/18 ·',1)

          out=Path('caso001/printables/generator-p2-embedded.html')
          out.write_text(gen,encoding='utf-8')
          text=out.read_text(encoding='utf-8')

          total=text.count('data:image/')
          if total < 18: raise SystemExit(f'QA FAIL: {total}/18 imágenes embebidas')
          if 'LEGACY_ART_URL' in text or 'loadLegacyArt' in text: raise SystemExit('QA FAIL: dependencia runtime de arte')
          for token in ('ART.portraits[i]','ART.locations[i]','ART.objects[i]'):
              if token not in text: raise SystemExit(f'QA FAIL: falta {token}')
          if 'CHARS.map((c,i)=>' not in text or 'LOCS.map((x,i)=>' not in text or 'OBJS.map((x,i)=>' not in text:
              raise SystemExit('QA FAIL: índices de arte no conectados')
          if '<h1>LA ÚLTIMA REUNIÓN · KIT IMPRIMIBLE</h1>' not in text:
              raise SystemExit('QA FAIL: encabezado público no aplicado')
          if '<div class="field filebtn dev-only">' not in text:
              raise SystemExit('QA FAIL: loader manual no quedó oculto')

          Path('caso001/printables/build-embedded-diagnostic.txt').write_text(
              f'BUILD=OK\nportraits=6\nlocations=6\nobjects=6\ntotal_data_images={total}\noutput_bytes={out.stat().st_size}\nruntime_fetch=false\nmanual_json_loader=hidden_dev_only\npublic_heading=clean\n',encoding='utf-8')
          print(f'QA OK · {total} imágenes embebidas · UI pública limpia · {out.stat().st_size} bytes')

      - name: Commit generated self-contained HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caso001/printables/generator-p2-embedded.html caso001/printables/build-embedded-diagnostic.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: clean Caso 001 printable UI"
            git push origin HEAD:mejora-caso001-p2
          fi

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: caso001-p2-printable-embedded
          path: caso001/printables/generator-p2-embedded.html
          if-no-files-found: error
