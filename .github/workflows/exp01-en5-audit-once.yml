name: EXP01 EN5 Printable Audit R4
on:
  push:
    paths:
      - '.github/workflows/exp01-en5-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit printable DOM and evidence pages
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en5-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/printables/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/caso001/printables/',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(900);
          const setSelect=async(id,value)=>page.evaluate(({id,value})=>{const el=document.getElementById(id);el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));},{id,value});
          await setSelect('pack','C001-01');
          await setSelect('stage','3');
          await setSelect('channel','CASEFILE');
          await page.waitForTimeout(700);
          const publicEv=await page.evaluate(()=>({pageCount:document.querySelectorAll('.page').length,evidence:[...document.querySelectorAll('.evidence-page')].map((p,i)=>({index:i+1,text:p.innerText.replace(/\n{3,}/g,'\n\n')})),status:document.querySelector('#status')?.textContent?.trim()||''}));
          await setSelect('channel','SANTIAGO');
          await page.waitForTimeout(700);
          const privateEv=await page.evaluate(()=>({pageCount:document.querySelectorAll('.page').length,evidence:[...document.querySelectorAll('.evidence-page')].map((p,i)=>({index:i+1,text:p.innerText.replace(/\n{3,}/g,'\n\n')})),status:document.querySelector('#status')?.textContent?.trim()||''}));
          console.log('EXP01_EN5_AUDIT_BEGIN');
          console.log(JSON.stringify({title:await page.title(),publicEv,privateEv,errors},null,2));
          console.log('EXP01_EN5_AUDIT_END');
          await browser.close();
          NODE
