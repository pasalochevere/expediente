name: EXP01 EN5 Printable Audit
on:
  push:
    paths:
      - '.github/workflows/exp01-en5-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit printable DOM
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en5-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/printables/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/caso001/printables/',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(800);
          const data=await page.evaluate(()=>({
            title:document.title,
            pageCount:document.querySelectorAll('.page').length,
            pages:[...document.querySelectorAll('.page')].map((p,i)=>({index:i+1,text:p.innerText.replace(/\n{3,}/g,'\n\n'),images:[...p.querySelectorAll('img')].map(img=>({alt:img.alt||'',cls:img.className,src:(img.getAttribute('src')||'').slice(0,80)}))})),
            controls:[...document.querySelectorAll('.toolbar label,.toolbar button,.toolbar option,.toolbar span,.status')].map(x=>x.textContent.trim()).filter(Boolean),
            errors
          }));
          console.log('EXP01_EN5_AUDIT_BEGIN');
          console.log(JSON.stringify(data,null,2));
          console.log('EXP01_EN5_AUDIT_END');
          await browser.close();
          NODE
