name: PSQ FIX TEXTO 01

on:
  push:
    paths:
      - '.github/workflows/psq-fix-texto-01.yml'

permissions:
  contents: write

# one-shot trigger 2026-10-09
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair idempotent ES/EN text translation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('paper-squishy/psq-i18n-v26.js')
          s = p.read_text(encoding='utf-8')
          old = """  function translateString(value,target=lang){
              if(value==null)return value;
              let out=String(value);
              const list=target==='en'?FORWARD:REVERSE;
              for(const [from,to] of list){if(from&&out.includes(from))out=out.split(from).join(to)}
              return out;
            }"""
          new = """  function translateString(value,target=lang){
              if(value==null)return value;
              let out=String(value);
              if(target==='es'){
                out=out.replace(/\\bText[o]{2,}\\b/g,'Texto').replace(/\\bTEXT[O]{2,}\\b/g,'TEXTO');
              }
              const list=target==='en'?FORWARD:REVERSE;
              for(const [from,to] of list){
                if(!from||!out.includes(from))continue;
                if(to.includes(from)&&out.includes(to))continue;
                out=out.split(from).join(to);
              }
              return out;
            }"""
          if old not in s:
              raise SystemExit('Expected translateString block not found; aborting without changes.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify repair
        run: |
          grep -F "if(to.includes(from)&&out.includes(to))continue;" paper-squishy/psq-i18n-v26.js
          grep -F "Text[o]{2,}" paper-squishy/psq-i18n-v26.js
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper-squishy/psq-i18n-v26.js
          git commit -m 'fix(psq): stop repeated Texto translation loop'
          git push
