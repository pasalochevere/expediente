name: EXP01 EN4 Visual Audit R4
on:
  push:
    paths:
      - '.github/workflows/exp01-en4-once.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate visual localization
        run: |
          python3 .github/scripts/exp01_en4_integrate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caso001/visual-en.js')
          s=p.read_text()
          s=s.replace("import {getLanguage} from './i18n.js';\n\n","")
          s=s.replace("function translatedSrc(src,language=getLanguage()){","function currentVisualLanguage(){return typeof document!=='undefined'&&document.documentElement.lang==='en'?'en':'es'}\n\nfunction translatedSrc(src,language=currentVisualLanguage()){")
          s=s.replace("const next=translatedSrc(current,getLanguage());","const next=translatedSrc(current,currentVisualLanguage());")
          p.write_text(s)
          PY
          node --check caso001/visual-en.js
          node --check caso001/i18n.js
          node --check caso001/content-en.js
          git diff --check
      - name: Browser QA
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en4-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
          node .github/scripts/exp01_en4_qa.mjs
      - name: Commit and publish passing build safely
        run: |
          rm -f package.json package-lock.json
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/index.html caso001/intro/index.html caso001/visual-en.js caso001/assets-en caso001/RELEASE.txt caso001/EXP01_EN4_AUDIT.md
          git diff --cached --check
          git commit -m 'EXP01-EN4 localize embedded visual text ES EN'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "EN4 pushed on attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          echo 'EN4 push failed after retries'
          exit 1
