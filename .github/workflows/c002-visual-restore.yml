name: C002 P2.2R.4 Visual Restore

on:
  push:
    paths:
      - 'caso002/.visual_restore/TRIGGER_P2_2R_4.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and install visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p caso002/assets/visual
          base64 -d caso002/.visual_restore/c002_visual_assets.b64 > /tmp/c002_visual_assets.zip
          unzip -oq /tmp/c002_visual_assets.zip -d caso002/assets/visual
          test "$(find caso002/assets/visual -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 21

      - name: Install visual restoration adapter
        shell: bash
        run: |
          cat > caso002/visual-restoration.js <<'EOF'
          (() => {
            'use strict';
            const asset = n => `assets/visual/${n}.jpg`;
            const data = window.CASE002_DATA;
            if (!data) return;

            const byId = (arr, prefix) => {
              if (!Array.isArray(arr)) return;
              arr.forEach(x => { if (x && x.id) x.image = asset(prefix + x.id.slice(-2)); });
            };

            byId(data.characters, 'P');
            byId(data.locations, 'L');
            byId(data.objects, 'O');
            if (data.special_location) data.special_location.image = asset('room_317');

            try {
              if (typeof SCENES !== 'undefined' && Array.isArray(SCENES)) {
                const sceneAssets = ['hero_hotel','hero_hotel','door_317','P01','P02','L01','O03','L03','room_317','door_317'];
                SCENES.forEach((scene, i) => { if (scene && sceneAssets[i]) scene.img = asset(sceneAssets[i]); });
              }
            } catch (_) {}

            const altMap = new Map();
            [...(data.characters || []), ...(data.locations || []), ...(data.objects || [])].forEach(x => {
              if (x && x.name && x.image) altMap.set(String(x.name).trim(), x.image);
            });

            const patchDom = root => {
              const scope = root && root.querySelectorAll ? root : document;
              const hero = document.querySelector('.hero-main > img');
              if (hero) hero.src = asset('hero_hotel');
              const door = document.querySelector('.door-card > img');
              if (door) door.src = asset('door_317');
              scope.querySelectorAll('img[alt]').forEach(img => {
                const mapped = altMap.get((img.getAttribute('alt') || '').trim());
                if (mapped && img.getAttribute('src') !== mapped) img.src = mapped;
              });
            };

            const style = document.createElement('style');
            style.id = 'c002-visual-restoration-style';
            style.textContent = `
              .hero-main>img,.door-card>img,.evidence-card img,.gallery-card img,.character-card img,
              .location-card img,.object-card img{object-fit:cover;object-position:center;}
              .hero-main>img{filter:saturate(.92) contrast(1.04);}
            `;
            document.head.appendChild(style);

            patchDom(document);
            document.addEventListener('DOMContentLoaded', () => patchDom(document), { once: true });
            const observer = new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(n => {
              if (n && n.nodeType === 1) patchDom(n);
            })));
            observer.observe(document.documentElement, { childList: true, subtree: true });

            window.C002_VISUAL_RESTORATION = Object.freeze({ version: 'P2.2R.4', assets: 21 });
          })();
          EOF

      - name: Patch loader injection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caso002/index.html')
          s=p.read_text()
          old="<script src=\"audio.js?v=220\"></'+'script><script src=\"rc.js?v=230\"></script></body>"
          new="<script src=\"visual-restoration.js?v=240\"></'+'script><script src=\"audio.js?v=220\"></'+'script><script src=\"rc.js?v=230\"></script></body>"
          if 'visual-restoration.js?v=240' not in s:
              if old not in s:
                  raise SystemExit('Expected loader injection anchor not found')
              s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: QA integration
        shell: bash
        run: |
          set -euo pipefail
          test -f caso002/visual-restoration.js
          grep -q 'visual-restoration.js?v=240' caso002/index.html
          grep -q "C002_VISUAL_RESTORATION" caso002/visual-restoration.js
          grep -q "data.characters" caso002/visual-restoration.js
          grep -q "data.locations" caso002/visual-restoration.js
          grep -q "data.objects" caso002/visual-restoration.js
          test "$(find caso002/assets/visual -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 21
          for f in P01 P02 P03 P04 P05 P06 L01 L02 L03 L04 L05 L06 O01 O02 O03 O04 O05 O06 hero_hotel door_317 room_317; do test -s "caso002/assets/visual/$f.jpg"; done

      - name: Freeze release note and clean temporary staging
        shell: bash
        run: |
          cat > caso002/RELEASE_P2_2R_4_VISUAL.txt <<'EOF'
          P2.2R.4 — RESTAURACIÓN VISUAL C002
          Estado: INTEGRATED / QA PASS

          21 assets web oficiales instalados:
          - 6 personajes
          - 6 lugares
          - 6 objetos
          - Hotel Orfeo hero
          - Puerta 317
          - Habitación 317

          Integración mediante visual-restoration.js.
          No modifica ENGINE P2, canon, solución, sesiones, recovery ni lógica de juego.
          EOF
          rm -rf caso002/.visual_restore
          rm -f .github/workflows/c002-visual-restore.yml

      - name: Commit production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PasaloChevere Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A caso002 .github/workflows/c002-visual-restore.yml
          git commit -m 'feat: integrate C002 P2.2R.4 visual library'
          git push
