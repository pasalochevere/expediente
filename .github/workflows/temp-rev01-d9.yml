name: Temp Rev01 D9 Cinematic Accusation
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d9.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D9
        run: python .github/scripts/patch_rev01_d9.py
      - name: Validate D9
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=['P2.12D.9 · CINEMATIC ACCUSATION','accDraft','accusationChoice','accusationAxis','bindAccusationDraft','SELLAR ACUSACIÓN','REVELAR RECONSTRUCCIÓN','suspect_index:Number(accDraft.suspect)','location_index:Number(accDraft.location)','object_index:Number(accDraft.object)','motive_text:String(accDraft.motive']
          for t in required: assert t in s,t
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m,'module script missing'
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d9.js').write_text(code)
          print('D9 cinematic accusation PASS · P2 accusation payload preserved')
          PY
          node --check /tmp/rev01-d9.js
      - name: Commit D9
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.9 cinematic accusation"
          git push
