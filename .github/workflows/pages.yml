name: Deploy EXPEDIENTES to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Torre intro as entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cp torre/index.html torre/game.html
          cp torre/intro-v2.html torre/index.html
          python - <<'PY'
          from pathlib import Path

          intro = Path('torre/index.html')
          s = intro.read_text(encoding='utf-8')
          s = s.replace("skipBtn.addEventListener('click',endIntro);", "skipBtn.addEventListener('click',()=>{location.href='./game.html'});")
          s = s.replace("enterBtn.addEventListener('click',()=>{location.href='./'});", "enterBtn.addEventListener('click',()=>{location.href='./game.html'});")
          intro.write_text(s, encoding='utf-8')

          game = Path('torre/game.html')
          g = game.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./visual-v2.css?v=2">'
          js = '<script src="./visual-v2.js?v=2" defer></script>'
          if './visual-v2.css' not in g:
              g = g.replace('</head>', css + '\n</head>', 1)
          if './visual-v2.js' not in g:
              g = g.replace('</body>', js + '\n</body>', 1)
          game.write_text(g, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
