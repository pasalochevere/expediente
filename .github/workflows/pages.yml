name: Deploy EXPEDIENTES to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Torre intro as entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cp torre/index.html torre/game.html
          cp torre/intro-v2.html torre/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('torre/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("skipBtn.addEventListener('click',endIntro);", "skipBtn.addEventListener('click',()=>{location.href='./game.html'});")
          s = s.replace("enterBtn.addEventListener('click',()=>{location.href='./'});", "enterBtn.addEventListener('click',()=>{location.href='./game.html'});")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
