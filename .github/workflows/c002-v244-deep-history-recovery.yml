name: C002 v244 Deep History Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c002-v244-deep-history-recovery.yml'
      - '.github/triggers/c002-v244-deep-history.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Scan all historical blobs
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,re,base64,hashlib
          from io import BytesIO
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True

          targets={
            'P05':'caso002/assets/visual/fix-P05-v242.js',
            'P06':'caso002/assets/visual/fix-P06-v242.js',
            'L03':'caso002/assets/visual/fix-L03-v242.js',
            'room_317':'caso002/assets/visual/fix-room-317-v242.js',
          }
          bundles=[f'caso002/assets/visual/assets-part-{i:02d}.js' for i in range(1,9)]
          seen={k:set() for k in targets}
          data_pat=re.compile(r'data:image/[a-zA-Z0-9.+-]+;base64,([A-Za-z0-9+/=]+)')

          def commits_for(path):
              try:
                  return subprocess.check_output(['git','log','--all','--format=%H','--',path],text=True,stderr=subprocess.DEVNULL).splitlines()
              except Exception:
                  return []

          def show(commit,path):
              try:
                  return subprocess.check_output(['git','show',f'{commit}:{path}'],stderr=subprocess.DEVNULL).decode('utf-8','ignore')
              except Exception:
                  return ''

          def test_b64(label,commit,path,b):
              try: raw=base64.b64decode(b+'='*((-len(b))%4),validate=False)
              except Exception:return
              sha=hashlib.sha256(raw).hexdigest()
              if sha in seen[label]:return
              try:
                  im=Image.open(BytesIO(raw)); im.load()
              except Exception as e:
                  if len(b)>15000:
                      print(f'DAMAGED_LONG key={label} commit={commit[:12]} path={path} b64chars={len(b)} rawbytes={len(raw)} error={type(e).__name__}:{e}')
                  return
              seen[label].add(sha)
              print(f'HEALTHY key={label} commit={commit} path={path} fmt={im.format} size={im.size} bytes={len(raw)} b64chars={len(b)} sha={sha}')

          # Exact fix-file histories.
          for label,path in targets.items():
              cs=commits_for(path)
              print(f'HISTORY {label} path={path} commits={len(cs)}')
              for c in cs:
                  txt=show(c,path)
                  for m in data_pat.finditer(txt):
                      test_b64(label,c,path,m.group(1))

          # Historical visual bundles. Find the key, then inspect the first data URI that follows it.
          for label in targets:
              needles=[f'"{label}"',f"'{label}'"]
              for path in bundles:
                  for c in commits_for(path):
                      txt=show(c,path)
                      if not txt:continue
                      for needle in needles:
                          start=0
                          while True:
                              pos=txt.find(needle,start)
                              if pos<0:break
                              m=data_pat.search(txt,pos,min(len(txt),pos+250000))
                              if m:
                                  test_b64(label,c,path,m.group(1))
                              start=pos+len(needle)

          for k,v in seen.items(): print(f'SUMMARY {k}: {len(v)} unique healthy historical image(s)')
          PY
