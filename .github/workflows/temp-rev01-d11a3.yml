name: Temp Rev01 D11A3 Final Browser QA
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11a3.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_rev01_d11_marks.py
      - run: python .github/scripts/patch_rev01_d11a.py
      - name: Validate syntax and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          for t in ['P2.12D.11A · ACCESS PREFLIGHT + MOBILE QA','MARKS_STORAGE_KEY','adapterReady','entryError','updateAccessPreflight','clearTheoryMarks']:
              assert t in s,t
          for d,n in [('personajes',6),('escenas',6),('objetos',6)]: assert len(list((Path('caso001-rev01/assets')/d).glob('*')))==n
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m
          Path('/tmp/d11.js').write_text(re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S))
          PY
          node --check /tmp/d11.js
      - name: Browser QA 1366 768 390
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          mkdir -p /tmp/qa && cd /tmp/qa && npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import {chromium} from 'playwright-core'; import fs from 'fs';
          const ep=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath:ep,args:['--no-sandbox']});
          for(const viewport of [{width:1366,height:900},{width:768,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport}); const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8000/caso001-rev01/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>/MOTOR P2 LISTO|MOTOR NO DISPONIBLE/.test(document.querySelector('#runtimeState')?.textContent||''),null,{timeout:20000});
            const runtime=await page.locator('#runtimeState').innerText(); if(!runtime.includes('MOTOR P2 LISTO')) throw new Error(`runtime ${viewport.width}: ${runtime}`);
            if(errors.length) throw new Error(`pageerror ${viewport.width}: ${errors.join(' | ')}`);
            if(!(await page.locator('#prologue').evaluate(el=>el.classList.contains('hidden')))) await page.click('#prologueSkip');
            const dims=await page.evaluate(()=>[document.documentElement.scrollWidth,window.innerWidth]); if(dims[0]>dims[1]+3) throw new Error(`overflow ${viewport.width}: ${dims}`);
            if(viewport.width===1366){
              await page.click('#enterRoom'); await page.waitForTimeout(100); const msg=await page.locator('#entryError').innerText(); if(!/Portal|acceso/i.test(msg)) throw new Error('missing access guidance');
              await page.click('#tabJoin'); if(await page.locator('#enterRoom').isDisabled()) throw new Error('join disabled');
              await page.evaluate(()=>{const m=document.querySelector('#motiveTheory');m.value='prueba local';m.dispatchEvent(new Event('input',{bubbles:true}));document.querySelector('#suspectChips .theoryCard').click()});
              const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('pc_exp_rev01_theory_v1')||'{}')); if(saved.motive!=='prueba local'||Number(saved.suspects?.[0])!==1) throw new Error('theory persistence');
            }
            console.log(`VIEWPORT ${viewport.width} PASS ${dims[0]}/${dims[1]}`); await page.close();
          }
          await browser.close(); console.log('D11A FINAL BROWSER QA PASS');
          JS
          node qa.mjs
      - name: Commit D11A
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.11A fix Rev01 startup and access preflight"
          git push
