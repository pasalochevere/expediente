name: EXP01 EN6 Final Public Freeze Gate R6
on:
  push:
    paths:
      - '.github/workflows/exp01-en6-final-qa-once-r6.yml'
permissions:
  contents: write
  actions: read
jobs:
  final-public-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hardened source
        run: |
          node --check caso001/printables/i18n-en5.js
          node --check caso001/p2-multiplayer-adapter.js
          grep -q "GLOBAL_STORAGE_KEY='expedientes_language'" caso001/printables/i18n-en5.js
          grep -q "pcUpperEntryDelegated" caso001/p2-multiplayer-adapter.js
          git diff --check
      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Local regression gate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en6-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
          QA_LABEL=LOCAL_R6 BASE_URL=http://127.0.0.1:4173/ node .github/scripts/exp01_en6_qa.mjs
      - name: Wait for this revision on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 72); do
            DATA="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=10")"
            STATUS="$(printf '%s' "$DATA" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/pages.yml")][0].status // "missing"')"
            CONCLUSION="$(printf '%s' "$DATA" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/pages.yml")][0].conclusion // ""')"
            echo "Pages: $STATUS $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Public production gate
        run: |
          QA_LABEL=PUBLIC_R6 BASE_URL=https://pasalochevere.github.io/expediente/ node .github/scripts/exp01_en6_qa.mjs
      - name: Freeze release and remove temporary EN6 QA
        run: |
          python3 .github/scripts/exp01_en6_finalize.py
          rm -f package.json package-lock.json
          git rm -f .github/workflows/exp01-en6-final-qa-once.yml || true
          git rm -f .github/workflows/exp01-en6-final-qa-once-r2.yml || true
          git rm -f .github/workflows/exp01-en6-final-qa-once-r3.yml || true
          git rm -f .github/workflows/exp01-en6-final-qa-once-r4.yml || true
          git rm -f .github/workflows/exp01-en6-final-qa-once-r5.yml || true
          git rm -f .github/workflows/exp01-en6-final-qa-once-r6.yml || true
          git rm -f .github/scripts/exp01_en6_apply.py
          git rm -f .github/scripts/exp01_en6_qa.mjs
          git rm -f .github/scripts/exp01_en6_finalize.py
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/EXP01_EN6_AUDIT.md caso001/RELEASE.txt
          git diff --cached --check
          git commit -m 'EXP01-EN6 freeze final bilingual release QA'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "EXP01-EN6 freeze pushed"
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
