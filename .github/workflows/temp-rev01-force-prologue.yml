name: Temp Rev01 Force Prologue
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-force-prologue.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force prologue on normal entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('caso001-rev01/index.html')
          s=p.read_text()
          old="if(invitedRoom||sessionStorage.getItem('pc_exp_rev01_prologue_seen')==='1'){$('#prologue').classList.add('hidden')}else{renderPrologueScene()}"
          new="if(invitedRoom){$('#prologue').classList.add('hidden')}else{sessionStorage.removeItem('pc_exp_rev01_prologue_seen');openPrologue()}"
          if old not in s:
              raise SystemExit('prologue init anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate inline module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          code=re.sub(r"^import .*?;\s*",'',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-module.js').write_text(code)
          assert "if(invitedRoom){$('#prologue').classList.add('hidden')}else{sessionStorage.removeItem('pc_exp_rev01_prologue_seen');openPrologue()}" in s
          print('prologue force-entry anchor PASS')
          PY
          node --check /tmp/rev01-module.js
      - name: Commit
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.2 fix prologue visibility in Rev01"
          git push
