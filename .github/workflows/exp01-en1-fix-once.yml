name: EXP01 EN1 QA polish
on:
  push:
    paths:
      - '.github/workflows/exp01-en1-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish language persistence UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              return text.replace(old,new,1)

          p=Path('caso001/i18n.js')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,
            "'setup.characterHint':'ELEGÍ UNA IDENTIDAD PARA INGRESAR AL EXPEDIENTE.','setup.rejoin':'Reingresar a mi última sala',",
            "'setup.characterHint':'ELEGÍ UNA IDENTIDAD PARA INGRESAR AL EXPEDIENTE.','setup.rejoin':'Reingresar a mi última sala','setup.rejoinCode':'Reingresar a {code}',",
            'ES rejoin key')
          s=replace_once(s,
            "'setup.characterHint':'CHOOSE AN IDENTITY TO ENTER THE CASE FILE.','setup.rejoin':'Rejoin my last room',",
            "'setup.characterHint':'CHOOSE AN IDENTITY TO ENTER THE CASE FILE.','setup.rejoin':'Rejoin my last room','setup.rejoinCode':'Rejoin {code}',",
            'EN rejoin key')
          p.write_text(s,encoding='utf-8')

          p=Path('caso001/index.html')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,
            "$('#rejoinLast').textContent=`Reingresar a ${last}`",
            "$('#rejoinLast').textContent=t('setup.rejoinCode',{code:last})",
            'rejoin runtime')
          s=replace_once(s,
            "const name=$('#displayName').value.trim()||'Investigador';",
            "const name=$('#displayName').value.trim()||t('setup.namePlaceholder');",
            'create default name')
          s=replace_once(s,
            "displayName:$('#displayName').value.trim()||'Investigador'",
            "displayName:$('#displayName').value.trim()||t('setup.namePlaceholder')",
            'rejoin default name')
          p.write_text(s,encoding='utf-8')

          # Safety assertions: language still absent from all server mutation payloads.
          adapter=Path('caso001/p2-multiplayer-adapter.js').read_text(encoding='utf-8')
          forbidden=['language:', 'lang:', 'expedientes_language']
          found=[x for x in forbidden if x in adapter]
          if found:
              raise SystemExit('Language leaked into multiplayer adapter: '+', '.join(found))
          if "mode:mode==='imp'?'imp':'dig'" not in adapter:
              raise SystemExit('Mode normalization changed unexpectedly')
          PY
          git diff --check
          git config user.name 'PasaloChevere Release Bot'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/i18n.js caso001/index.html
          git commit -m 'EXP01-EN1 polish localized rejoin without state changes' || exit 0
          git push
