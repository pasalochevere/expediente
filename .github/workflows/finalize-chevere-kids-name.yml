name: Finalize Chévere Kids naming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-chevere-kids-name.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean remaining public Torre Kids labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('torre-kids-matematica/index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('PASALOCHEVERE · TORRE KIDS · MATEMÁTICA','PASALOCHEVERE · CHÉVERE KIDS · MATEMÁTICA'),
            ('No encontré el código personal de Torre Kids Matemática.','No encontré el código personal de Chévere Kids · Matemática.'),
            ("lic.product_name||'Torre Kids Matemática'","lic.product_name||'Chévere Kids · Matemática'"),
            ('Volvé a tu biblioteca y abrí Torre Kids Matemática desde allí.','Volvé a tu biblioteca y abrí Chévere Kids · Matemática desde allí.')
          ]
          for old,new in pairs:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finalize Chévere Kids public naming"
            git push
          fi
