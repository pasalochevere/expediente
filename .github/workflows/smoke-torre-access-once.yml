name: One-time smoke Torre access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-torre-access-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployed guard marker
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsSL --max-time 20 https://pasalochevere.github.io/expediente/torre/ -o /tmp/torre.html && grep -q 'PC_TORRE_ACCESS_GUARD_V1' /tmp/torre.html; then
              echo "Guard marker found in live GitHub Pages."
              exit 0
            fi
            echo "Waiting for Pages deployment ($i/12)..."
            sleep 5
          done
          echo "Guard marker not found in live site."
          exit 1

      - name: Confirm unauthenticated direct URL is blocked
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not available on runner."
            exit 1
          fi
          timeout 30s "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom \
            https://pasalochevere.github.io/expediente/torre/ > /tmp/final-dom.html 2>/tmp/chrome.err || true

          if grep -q 'PasaloChevere · Acceso personal' /tmp/final-dom.html; then
            echo "PASS: unauthenticated direct URL ended at the PasaloChevere access portal."
            exit 0
          fi

          echo "Final DOM did not show the access portal."
          echo "--- chrome stderr ---"
          tail -80 /tmp/chrome.err || true
          echo "--- DOM head ---"
          head -80 /tmp/final-dom.html || true
          exit 1

      - name: Remove one-time smoke workflow
        if: always()
        uses: actions/checkout@v4

      - name: Commit workflow cleanup
        if: always()
        shell: bash
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          if [ -f .github/workflows/smoke-torre-access-once.yml ]; then
            git rm .github/workflows/smoke-torre-access-once.yml
            git commit -m "chore: remove one-time Torre access smoke workflow"
            git push
          fi
