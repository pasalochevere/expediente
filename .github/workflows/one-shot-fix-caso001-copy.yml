name: One-shot fix Caso 001 copy
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-shot-fix-caso001-copy.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix duplicate copy
        shell: python
        run: |
          from pathlib import Path
          p=Path('caso001/index.html')
          s=p.read_text(encoding='utf-8')
          old='Los personajes no elegidos siguen existiendo como NPC. Los personajes no elegidos siguen participando como NPC y también pueden resultar responsables del caso.'
          new='Los personajes no elegidos siguen participando como NPC y también pueden resultar responsables del caso.'
          if old not in s:
              raise SystemExit('Texto duplicado no encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "PasaloChevere Bot"
          git config user.email "actions@users.noreply.github.com"
          git add caso001/index.html
          git rm .github/workflows/one-shot-fix-caso001-copy.yml
          git commit -m "Polish Caso 001 customer copy"
          git push origin main
