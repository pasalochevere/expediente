name: PSQ80 Catalog Browser QA
on:
  push:
    branches: [feat/psq80-staging-20261110]
    paths:
      - paper-squishy/psq80/test-gallery.cjs
      - paper-squishy/factory-80-staging.html
      - .github/workflows/psq80-gallery-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Validate 80 original entries, filters, images, mobile and desktop
        run: node paper-squishy/psq80/test-gallery.cjs
