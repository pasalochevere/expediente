name: EXP01 EN2 UI QA2
on:
  push:
    paths:
      - '.github/workflows/exp01-en2-qa2-once.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Patch reverse-safe structural labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('caso001/i18n.js'); s=p.read_text()
          s=s.replace("['CASO','CASE'],['ABIERTO','OPEN'],['SALA','ROOM'],['ABIERTA','OPEN'],","")
          old="function localizeSpecialStructures(root){const scope=root?.querySelectorAll?root:document;scope.querySelectorAll?.('.evAccessLabel').forEach(el=>{const html=currentLanguage==='en'?'<span class=\"evAccessDot\"></span>CONTROL<br>LOG':'<span class=\"evAccessDot\"></span>CONTROL<br>REGISTRO';if(el.innerHTML!==html)el.innerHTML=html})}"
          new="function localizeSpecialStructures(root){const scope=root?.querySelectorAll?root:document;scope.querySelectorAll?.('.evAccessLabel').forEach(el=>{const html=currentLanguage==='en'?'<span class=\"evAccessDot\"></span>CONTROL<br>LOG':'<span class=\"evAccessDot\"></span>CONTROL<br>REGISTRO';if(el.innerHTML!==html)el.innerHTML=html});scope.querySelectorAll?.('.caseStamp').forEach(el=>{const html=currentLanguage==='en'?'CASE<br>OPEN':'CASO<br>ABIERTO';if(el.innerHTML!==html)el.innerHTML=html});scope.querySelectorAll?.('.lobbySeal').forEach(el=>{const html=currentLanguage==='en'?'ROOM<br>OPEN':'SALA<br>ABIERTA';if(el.innerHTML!==html)el.innerHTML=html})}"
          if old not in s: raise SystemExit('special structure function not found')
          p.write_text(s.replace(old,new))
          PY
          node --check caso001/i18n.js
      - name: Browser runtime
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"; echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
      - name: QA
        run: |
          cat > qa.mjs <<'JS'
          import {chromium} from 'playwright-core';import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});const r=[];const ck=(n,v,d='')=>{r.push([n,!!v,d]);if(!v)throw new Error(n+': '+d)};
          try{const c=await browser.newContext({viewport:{width:1280,height:900}}),p=await c.newPage();await p.goto('http://127.0.0.1:4173/caso001/?lang=en&skipintro=1&room=ABC123',{waitUntil:'domcontentloaded'});await p.waitForTimeout(900);
          ck('header',await p.locator('.caseKicker').innerText()==='CONFIDENTIAL FILE · EXPEDIENTES');ck('case stamp',await p.locator('.caseStamp').evaluate(e=>e.innerHTML)==='CASE<br>OPEN');ck('onboarding',await p.locator('.dossierLabel').innerText()==='PRELIMINARY CASE FILE');ck('setup helper',(await p.locator('#setup').innerText()).includes('Unselected characters remain in the investigation as NPCs'));ck('lobby shell',await p.locator('.lobbyHeader h2').innerText()==='Investigation table');ck('lobby seal',await p.locator('.lobbySeal').evaluate(e=>e.innerHTML)==='ROOM<br>OPEN');ck('invite',await p.locator('.inviteLabel').innerText()==='INVITE INVESTIGATOR');ck('accusation',await p.locator('.accHero h2').innerText()==='Final accusation');ck('board',(await p.locator('.boardEyebrow').innerText()).includes('HYPOTHESIS TABLE'));ck('director',(await p.locator('.directorIntro').innerText()).startsWith('You can ask for guidance'));ck('log',(await p.locator('.logSeal').innerText()).includes('PUBLIC LOG'));ck('alt',(await p.locator('#characterDossierPreview img').getAttribute('alt')||'').startsWith('Portrait of '));ck('header narrative deferred',(await p.locator('.subtitle').innerText()).startsWith('Seis personas.'));
          await p.evaluate(()=>document.querySelector('#clearMarks').click());await p.waitForTimeout(120);ck('toast',await p.locator('#toast').innerText()==='Board marks cleared.');
          await p.evaluate(()=>{let a=document.createElement('div');a.id='q1';a.textContent='Partida iniciada.';document.body.append(a);let b=document.createElement('div');b.id='q2';b.textContent='TESTIMONIO REGISTRADO · REGISTRO 02';document.body.append(b);let d=document.createElement('div');d.id='q3';d.className='evText';d.textContent='Partida iniciada.';document.body.append(d)});await p.waitForTimeout(120);ck('dynamic',await p.locator('#q1').innerText()==='Game started.');ck('meta composite',await p.locator('#q2').innerText()==='RECORDED TESTIMONY · RECORD 02');ck('payload protected',await p.locator('#q3').innerText()==='Partida iniciada.');
          const state='{"motive":"LANGUAGE-ISOLATED"}';await p.evaluate(v=>localStorage.setItem('pc_exp_rev01_theory_v1',v),state);await p.locator('.revTopActions [data-exp-lang="es"]').click();await p.waitForTimeout(180);ck('reverse case',await p.locator('.caseStamp').evaluate(e=>e.innerHTML)==='CASO<br>ABIERTO');ck('reverse lobby',await p.locator('.lobbySeal').evaluate(e=>e.innerHTML)==='SALA<br>ABIERTA');ck('reverse onboarding',await p.locator('.dossierLabel').innerText()==='EXPEDIENTE PRELIMINAR');ck('state isolated',(await p.evaluate(()=>localStorage.getItem('pc_exp_rev01_theory_v1')))===state);await p.locator('.revTopActions [data-exp-lang="en"]').click();await p.waitForTimeout(180);ck('switch again',await p.locator('.dossierLabel').innerText()==='PRELIMINARY CASE FILE');
          const ad=fs.readFileSync('caso001/p2-multiplayer-adapter.js','utf8'),main=fs.readFileSync('caso001/index.html','utf8'),ii=fs.readFileSync('caso001/i18n.js','utf8');ck('profile source untouched',main.includes("const REV01_PROFILES=['Socio del estudio'"));ck('no language payload',!ad.includes('expedientes_language')&&!/\blang\s*:|\blanguage\s*:/.test(ad));ck('ids preserved',ad.includes("mode:mode==='imp'?'imp':'dig'")&&ad.includes('pc_exp_p2_last_room')&&main.includes('pc_exp_rev01_theory_v1'));ck('narrative exclusions',ii.includes('.prologueCopy p,.evText,.privateObjective p'));console.log(JSON.stringify({ok:true,r},null,2));await c.close()}finally{await browser.close()}
          JS
          node qa.mjs
      - name: Commit passing patch
        run: |
          rm -f qa.mjs package.json package-lock.json
          git config user.name 'lunchpack-arg'; git config user.email 'pasalochevere@gmail.com'
          git add caso001/i18n.js; git diff --cached --check; git commit -m 'EXP01-EN2 harden bidirectional UI localization'; git push origin main
