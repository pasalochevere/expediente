name: Hotfix VÍNCORES P1.8 RC once
on:
  push:
    paths:
      - '.github/workflows/vincores-p18-hotfix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard optional backup hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vincores/p18/p18.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('renderJournal();wireP18Backup();','renderJournal();typeof wireP18Backup===\'function\'&&wireP18Backup();')
          p.write_text(s,encoding='utf-8')
          PY
          node --check vincores/p18/p18.js
          grep -q "typeof wireP18Backup==='function'" vincores/p18/p18.js
      - name: Commit runtime guard
        run: |
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add vincores/p18/p18.js
          if git diff --cached --quiet; then echo 'Already guarded'; exit 0; fi
          git commit -m 'Guard optional VÍNCORES P1.8 backup integration'
          git fetch origin main
          git rebase origin/main
          git push origin main
