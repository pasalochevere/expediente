name: VÍNCORES P1.8.8 integrate once
on:
  push:
    paths:
      - '.github/workflows/vincores-p188-integrate-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate P1.8.8 assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vincores/index.html')
          s=p.read_text(encoding='utf-8')
          if 'p18/p188.css?v=1881' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="p18/p188.css?v=1881">\n</head>',1)
          old='<script src="p18/p18.js?v=1805"></script>'
          new=old+'\n<script src="p18/p188.js?v=1881"></script>'
          if 'p18/p188.js?v=1881' not in s:
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check vincores/p18/p188.js
          grep -q 'p18/p188.css?v=1881' vincores/index.html
          grep -q 'p18/p188.js?v=1881' vincores/index.html
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          rm -f .github/workflows/vincores-p188-integrate-once.yml
          git add vincores/index.html vincores/p18/p188.js vincores/p18/p188.css .github/workflows
          git commit -m 'Integrate VÍNCORES P1.8.8 case guide and Face V3'
          git pull --rebase origin main
          git push origin main
