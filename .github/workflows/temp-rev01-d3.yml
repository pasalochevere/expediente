name: Temp Rev01 D3 Character Dossiers
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate D3
        run: python .github/scripts/patch_rev01_d3.py
      - name: Commit D3
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html caso001-rev01/assets/personajes/
          git commit -m "P2.12D.3 character dossiers with original portraits"
          git push
