name: Temp Rev01 D3 Character Dossiers
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d3.yml'
      - '.github/scripts/patch_rev01_d3.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden portrait extractor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_rev01_d3.py')
          s=p.read_text()
          start=s.index('entries = re.findall(')
          end=s.index('\n\nexpected =', start)
          new='''names_found = re.findall(r"\\bname\\s*:\\s*['\\\"]([^'\\\"]+)['\\\"]", block)
images_found = re.findall(r"\\bimg\\s*:\\s*['\\\"]data:image/png;base64,([^'\\\"]+)['\\\"]", block)
entries = list(zip(names_found, images_found))
print('CHARS names:', names_found)
print('CHARS images:', len(images_found))
if len(entries) != 6:
    raise SystemExit(f'expected 6 character portraits, got names={len(names_found)} images={len(images_found)}')'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Apply D3
        run: python .github/scripts/patch_rev01_d3.py
      - name: Validate D3 assets and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          files=['santiago.png','clara.png','vera.png','mateo.png','ines.png','tomas.png']
          for fn in files:
              f=Path('caso001-rev01/assets/personajes')/fn
              assert f.exists(), fn
              assert f.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), fn
              assert f.stat().st_size>10000, fn
              assert ('assets/personajes/'+fn) in s, fn
          for token in ['P2.12D.3 · CHARACTER DOSSIERS','characterDossierPreview','REV01_PORTRAITS','renderCharacterDossierPreview']:
              assert token in s, token
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          code=re.sub(r"^import .*?;\s*",'',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d3.js').write_text(code)
          print('D3 anchors/assets PASS')
          PY
          node --check /tmp/rev01-d3.js
      - name: Commit D3
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html caso001-rev01/assets/personajes/
          git commit -m "P2.12D.3 character dossiers with original portraits"
          git push
