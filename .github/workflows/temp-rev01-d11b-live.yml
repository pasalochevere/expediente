name: Temp Rev01 D11B Live Multiplayer QA
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11b-live.yml'
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Rev01 deploy with D11A fix
        run: |
          set -e
          URL='https://pasalochevere.github.io/expediente/caso001-rev01/?d11b=preflight'
          for i in $(seq 1 50); do
            if curl -fsSL "$URL&n=$i" | grep -q 'P2.12D.11A · ACCESS PREFLIGHT + MOBILE QA'; then
              echo 'REV01 D11A LIVE'
              exit 0
            fi
            echo "waiting Pages... $i"
            sleep 4
          done
          echo 'Rev01 D11A marker did not reach GitHub Pages in time'
          exit 1
      - name: Install browser QA dependency
        run: |
          mkdir -p /tmp/d11b && cd /tmp/d11b
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Three-browser live multiplayer QA
        run: |
          cd /tmp/d11b
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const LICENSE='QA-D11B-7X4M-9Q2K';
          const BASE='https://pasalochevere.github.io/expediente/caso001-rev01/';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome/Chromium not found');
          const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const contexts=[];
          const pages=[];
          const errors=[];
          const log=(s)=>console.log(`[D11B] ${s}`);
          const attachErrors=(page,label)=>{
            page.on('pageerror',e=>errors.push(`${label} pageerror: ${e.message||e}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text())) errors.push(`${label} console: ${m.text()}`)});
          };
          async function newPage(label,viewport={width:1280,height:900}){
            const ctx=await browser.newContext({viewport}); contexts.push(ctx);
            const page=await ctx.newPage(); pages.push(page); attachErrors(page,label); return page;
          }
          async function ready(page){
            await page.waitForFunction(()=>/MOTOR P2 LISTO|MOTOR NO DISPONIBLE/.test(document.querySelector('#runtimeState')?.textContent||''),null,{timeout:30000});
            const txt=await page.locator('#runtimeState').innerText();
            if(!txt.includes('MOTOR P2 LISTO')) throw new Error(`runtime not ready: ${txt}`);
            const pro=page.locator('#prologue');
            if(await pro.count() && !(await pro.evaluate(el=>el.classList.contains('hidden')))) await page.click('#prologueSkip');
          }
          async function assertNoErrors(label){if(errors.length) throw new Error(`${label}: ${errors.join(' | ')}`)}
          async function createHost(){
            const p=await newPage('HOST');
            await p.goto(`${BASE}?qa=d11b-host-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await ready(p);
            await p.fill('#displayName','QA Host');
            await p.fill('#licenseKey',LICENSE);
            await p.click('[data-char="0"]');
            await p.click('#enterRoom');
            await p.waitForFunction(()=>{const v=document.querySelector('#code')?.textContent?.trim();return v&&v!=='—'},null,{timeout:30000});
            const code=(await p.locator('#code').innerText()).trim();
            if(!/^[A-Z0-9]{4,12}$/.test(code)) throw new Error(`invalid room code ${code}`);
            log(`ROOM_CODE=${code}`);
            return {p,code};
          }
          async function joinPlayer(code,index,name,label){
            const p=await newPage(label,index===2?{width:390,height:844}:{width:900,height:900});
            await p.goto(`${BASE}?room=${encodeURIComponent(code)}&qa=${label}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await ready(p);
            await p.fill('#displayName',name);
            await p.click(`[data-char="${index}"]`);
            await p.click('#enterRoom');
            await p.waitForFunction(c=>document.querySelector('#code')?.textContent?.trim()===c,code,{timeout:30000});
            return p;
          }
          try{
            const {p:host,code}=await createHost();
            log('HOST CREATE PASS');
            const p2=await joinPlayer(code,1,'QA Clara','P2');
            log('P2 JOIN PASS');
            const p3=await joinPlayer(code,2,'QA Vera','P3');
            log('P3 JOIN PASS');

            await host.waitForFunction(()=>document.querySelectorAll('#players .lobbyPerson.human').length===3,null,{timeout:20000});
            const start=host.locator('#startGame');
            await start.waitFor({state:'visible',timeout:10000});
            if(await start.isDisabled()) throw new Error('startGame disabled with 3 humans');
            log('REALTIME LOBBY 3/3 PASS');
            await start.click();

            for(const [p,label] of [[host,'HOST'],[p2,'P2'],[p3,'P3']]){
              await p.waitForFunction(()=>!document.querySelector('#game')?.classList.contains('hidden'),null,{timeout:20000});
              await p.waitForFunction(()=>document.querySelectorAll('#publicEvidence .evidenceDoc').length>0,null,{timeout:20000});
              await p.waitForFunction(()=>!!document.querySelector('#roleBox .privateDossier'),null,{timeout:20000});
              log(`${label} E1 + PRIVATE PASS`);
            }

            await host.click('#directorHelp');
            await host.waitForFunction(()=>document.querySelector('#directorLatest')?.textContent?.trim().length>10,null,{timeout:15000});
            await p2.waitForFunction(()=>document.querySelectorAll('#timeline .directorDispatch').length>0,null,{timeout:15000});
            log('DIRECTOR + REALTIME PASS');

            await host.click('#pause');
            await host.waitForFunction(()=>/PAUSADO/.test(document.querySelector('#gameMeta')?.textContent||''),null,{timeout:15000});
            await p3.waitForFunction(()=>/PAUSADO/.test(document.querySelector('#gameMeta')?.textContent||''),null,{timeout:15000});
            await host.click('#pause');
            await host.waitForFunction(()=>!/PAUSADO/.test(document.querySelector('#gameMeta')?.textContent||''),null,{timeout:15000});
            log('PAUSE/RESUME REALTIME PASS');

            await host.click('#advanceStage');
            for(const p of [host,p2,p3]) await p.waitForFunction(()=>/ETAPA 2/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:15000});
            log('E2 REALTIME PASS');

            // Reingreso real del jugador 2 en el mismo contexto/sesión.
            await p2.goto(`${BASE}?qa=d11b-rejoin-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await ready(p2);
            const rejoin=p2.locator('#rejoinLast');
            await rejoin.waitFor({state:'visible',timeout:10000});
            await rejoin.click();
            await p2.waitForFunction(()=>!document.querySelector('#game')?.classList.contains('hidden'),null,{timeout:20000});
            await p2.waitForFunction(()=>/ETAPA 2/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:15000});
            log('P2 REJOIN PASS');

            await host.click('#advanceStage');
            for(const p of [host,p2,p3]) await p.waitForFunction(()=>/ETAPA 3/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:15000});
            log('E3 REALTIME PASS');

            await host.waitForFunction(()=>!document.querySelector('#accusationPanel')?.classList.contains('hidden'),null,{timeout:10000});
            await host.click('[data-acc-axis="suspect"][data-acc-index="0"]');
            await host.click('[data-acc-axis="location"][data-acc-index="0"]');
            await host.click('[data-acc-axis="object"][data-acc-index="0"]');
            await host.fill('#accM','Hipótesis QA automática para validar Persona + Escena + Objeto + Motivo.');
            await host.click('#lockAcc');
            await host.waitForFunction(()=>!!document.querySelector('#revealSolution'),null,{timeout:15000});
            log('ACCUSATION LOCK PASS');

            await host.click('#revealSolution');
            for(const [p,label] of [[host,'HOST'],[p2,'P2'],[p3,'P3']]){
              await p.waitForFunction(()=>!document.querySelector('#solutionPanel')?.classList.contains('hidden')&&document.querySelector('#solutionBody .revealHero'),null,{timeout:20000});
              const txt=(await p.locator('#solutionBody').innerText()).trim();
              if(!/RESPONSABLE|ESCENA CLAVE|OBJETO CLAVE/.test(txt)) throw new Error(`${label} reveal incomplete`);
            }
            log('REVEAL + REALTIME PASS');

            // Basic mobile integrity on P3 throughout completed state.
            const dims=await p3.evaluate(()=>[document.documentElement.scrollWidth,window.innerWidth]);
            if(dims[0]>dims[1]+4) throw new Error(`mobile horizontal overflow ${dims[0]}>${dims[1]}`);
            log(`MOBILE 390 PASS ${dims[0]}/${dims[1]}`);
            await assertNoErrors('final browser errors');
            log('P2.12D.11B LIVE MULTIPLAYER QA PASS');
          } finally {
            for(const c of contexts) await c.close().catch(()=>{});
            await browser.close().catch(()=>{});
          }
          JS
          node qa.mjs
