name: EXP01 EN1 fast browser QA
on:
  push:
    paths:
      - '.github/workflows/exp01-en1-browser-qa-fast-once.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve system Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo 'System Chrome not found'; exit 1; }
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1
      - name: QA
        run: |
          cat > exp01-en1-qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const base='http://127.0.0.1:4173';const r=[];const ck=(n,v,d='')=>{r.push([n,!!v,d]);if(!v)throw new Error(`${n}: ${d}`)};
          try{
            const c=await browser.newContext({viewport:{width:1280,height:900}}),p=await c.newPage();
            await p.goto(`${base}/caso001/?lang=es&skipintro=1&room=ABC123`,{waitUntil:'domcontentloaded'});await p.waitForTimeout(600);
            ck('QA01 ES',await p.getAttribute('html','lang')==='es');
            ck('QA08 params initial',new URL(p.url()).searchParams.get('room')==='ABC123'&&new URL(p.url()).searchParams.get('skipintro')==='1');
            const state='{"suspects":{"0":1},"motive":"KEEP"}';await p.evaluate(v=>localStorage.setItem('pc_exp_rev01_theory_v1',v),state);
            await p.locator('.revTopActions [data-exp-lang="en"]').click();await p.waitForTimeout(150);
            ck('QA02 EN structural',await p.getAttribute('html','lang')==='en'&&(await p.locator('#tabCreate').innerText()).trim()==='Create room');
            ck('QA03 state unchanged',(await p.evaluate(()=>localStorage.getItem('pc_exp_rev01_theory_v1')))===state);
            const u=new URL(p.url());ck('QA08 params after switch',u.searchParams.get('room')==='ABC123'&&u.searchParams.get('skipintro')==='1'&&u.searchParams.get('lang')==='en');
            await p.reload({waitUntil:'domcontentloaded'});await p.waitForTimeout(250);ck('QA04 reload EN',await p.getAttribute('html','lang')==='en');
            await p.goto(`${base}/caso001/?skipintro=1`,{waitUntil:'domcontentloaded'});await p.waitForTimeout(250);ck('QA05 saved preference',await p.getAttribute('html','lang')==='en');
            await p.goto(`${base}/caso001/?lang=es&skipintro=1`,{waitUntil:'domcontentloaded'});await p.waitForTimeout(250);ck('URL priority',await p.getAttribute('html','lang')==='es'&&(await p.evaluate(()=>localStorage.getItem('expedientes_language')))==='es');
            await c.close();

            const a=await browser.newContext(),b=await browser.newContext(),pa=await a.newPage(),pb=await b.newPage();
            await Promise.all([pa.goto(`${base}/caso001/?room=SAME01&lang=es&skipintro=1`,{waitUntil:'domcontentloaded'}),pb.goto(`${base}/caso001/?room=SAME01&lang=en&skipintro=1`,{waitUntil:'domcontentloaded'})]);await Promise.all([pa.waitForTimeout(300),pb.waitForTimeout(300)]);
            ck('QA06 local languages same room',(await pa.getAttribute('html','lang'))==='es'&&(await pb.getAttribute('html','lang'))==='en'&&(await pa.locator('#roomCode').inputValue())==='SAME01'&&(await pb.locator('#roomCode').inputValue())==='SAME01');await a.close();await b.close();

            const s=await browser.newContext(),ps=await s.newPage();await ps.goto(`${base}/caso001/?lang=es&skipintro=1`,{waitUntil:'domcontentloaded'});await ps.evaluate(v=>localStorage.setItem('pc_exp_rev01_theory_v1',v),state);await ps.goto(`${base}/caso001/?lang=en&skipintro=1`,{waitUntil:'domcontentloaded'});ck('QA07 ES save EN reopen',(await ps.evaluate(()=>localStorage.getItem('pc_exp_rev01_theory_v1')))===state);await s.close();

            const i=await browser.newContext(),pi=await i.newPage();await pi.goto(`${base}/caso001/intro/?lang=en&access=QA-CODE&room=QA123`,{waitUntil:'domcontentloaded'});await pi.waitForTimeout(200);ck('Intro EN',(await pi.locator('#skipBtn').innerText()).trim()==='SKIP');await pi.locator('#skipBtn').click();await pi.waitForURL('**/caso001/**');const iu=new URL(pi.url());ck('Intro handoff',iu.searchParams.get('lang')==='en'&&iu.searchParams.get('access')==='QA-CODE'&&iu.searchParams.get('room')==='QA123'&&iu.searchParams.get('skipintro')==='1');await i.close();

            const m=await browser.newContext({viewport:{width:390,height:844},isMobile:true}),pm=await m.newPage();await pm.goto(`${base}/caso001/?lang=en&skipintro=1`,{waitUntil:'domcontentloaded'});await pm.waitForTimeout(300);const box=await pm.locator('.revTopActions .languageSwitcher').boundingBox();ck('QA10 mobile selector',box&&box.x>=0&&box.x+box.width<=390&&box.y>=0&&box.y+box.height<=844,JSON.stringify(box));const body=await pm.locator('body').innerText();ck('QA09 no broken tokens',!/(^|\s)(undefined|null|\[object Object\])($|\s)/i.test(body));await m.close();

            const ad=fs.readFileSync('caso001/p2-multiplayer-adapter.js','utf8'),main=fs.readFileSync('caso001/index.html','utf8'),ii=fs.readFileSync('caso001/i18n.js','utf8');ck('No language payload',!ad.includes('expedientes_language')&&!/\blang\s*:|\blanguage\s*:/.test(ad));ck('Internal ids preserved',ad.includes("mode:mode==='imp'?'imp':'dig'")&&ad.includes('pc_exp_p2_last_room')&&main.includes('pc_exp_rev01_theory_v1'));ck('Fallback implemented',ii.includes('primary??fallback??key'));
            console.log(JSON.stringify({ok:true,results:r},null,2));
          } finally {await browser.close()}
          JS
          node ./exp01-en1-qa.mjs
