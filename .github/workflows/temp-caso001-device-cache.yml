name: Temp Caso001 device cache bust
on:
  push:
    paths:
      - '.github/workflows/temp-caso001-device-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update adapter cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('caso001/index.html')
          s=p.read_text()
          old="./p2-multiplayer-adapter.js?v=20260919-2312"
          new="./p2-multiplayer-adapter.js?v=20260919-2045"
          if old not in s:
              raise SystemExit('old cache version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html
          git commit -m "P2.12C.7C cache bust unified device adapter"
          git push
