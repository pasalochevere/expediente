name: Chévere Kids Cinema V3 launcher hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chevere-kids-cinema-v3-hotfix-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Override legacy launchCinema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('torre-kids-matematica/assets/cinema-engine-v3.js')
          s=p.read_text(encoding='utf-8')
          marker="  window.startCinemaV3=start;"
          add="  window.launchCinema=function(){try{sessionStorage.removeItem('tk_cinema_seen')}catch(e){};window.showCinema();};\n"
          if add.strip() not in s:
              s=s.replace(marker,add+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JS
        run: node --check torre-kids-matematica/assets/cinema-engine-v3.js
      - name: Commit hotfix
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/assets/cinema-engine-v3.js
          if ! git diff --cached --quiet; then
            git commit -m "Make Cinema V3 replace legacy intro launcher"
            git push
          fi
