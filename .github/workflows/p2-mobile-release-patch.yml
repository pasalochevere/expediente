name: P2 one-shot mobile release patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/p2-mobile-release-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded mobile CSS fixes
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('caso001/index.html')
          text = runtime.read_text(encoding='utf-8')
          old = "@media(max-width:900px){.gridMain,.grid2{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}.statusbar{grid-template-columns:1fr 1fr}.clock{grid-column:1/-1;grid-row:1}.stage{text-align:right}}@media(max-width:560px){.top{display:block}.tag{display:inline-block;margin-top:10px}.characters,.players{grid-template-columns:1fr 1fr}.wrap{padding-inline:10px}.panel{padding:13px}}"
          new = "@media(max-width:900px){.gridMain,.grid2{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}.statusbar{grid-template-columns:1fr 1fr}.clock{grid-column:1/-1;grid-row:1}.stage{text-align:right}}@media(max-width:560px){.top{display:block}.tag{display:inline-block;margin-top:10px}.wrap{padding-inline:10px}.panel{padding:13px}.roomHead{display:grid;grid-template-columns:1fr;align-items:start}.roomHead .meta{justify-content:flex-start}.statusbar{grid-template-columns:1fr}.clock{grid-column:1;grid-row:auto;text-align:left}.stage{text-align:left}.code{font-size:34px;overflow-wrap:anywhere}.evidence,.role,.solution,.event,.accLocked{overflow-wrap:anywhere}.toolbar>.btn{flex:1 1 140px;min-height:44px}}@media(max-width:420px){.characters,.players{grid-template-columns:1fr}.seg{display:grid;grid-template-columns:1fr}.wrap{padding-inline:8px}.panel{padding:12px}.toast{right:8px;bottom:8px;max-width:calc(100vw - 16px)}}"
          if text.count(old) != 1:
              raise SystemExit(f'Runtime media block mismatch: {text.count(old)}')
          runtime.write_text(text.replace(old,new), encoding='utf-8')

          printable = Path('caso001/printables/index.html')
          text = printable.read_text(encoding='utf-8')
          old = "@media(max-width:900px){.controls{grid-template-columns:repeat(2,1fr)}.page{transform-origin:top center;transform:scale(.62);margin-bottom:-105mm}.preview{overflow:hidden}}"
          new = "@media(max-width:900px){.controls{grid-template-columns:repeat(2,1fr)}.page{transform-origin:top center;transform:scale(.62);margin-bottom:-105mm}.preview{overflow:hidden}}@media(max-width:560px){.toolbar{padding:10px}.brand h1{font-size:21px}.controls{grid-template-columns:1fr!important;max-width:none}.page{transform:scale(.42);margin-bottom:-170mm}.preview{padding-top:14px;overflow:hidden}}"
          if text.count(old) != 1:
              raise SystemExit(f'Printable media block mismatch: {text.count(old)}')
          printable.write_text(text.replace(old,new), encoding='utf-8')

          print('Guarded replacements OK')
      - name: Commit mobile fixes
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html caso001/printables/index.html
          git diff --cached --check
          git commit -m "P2.12B-G mobile QA fixes"
          git push
