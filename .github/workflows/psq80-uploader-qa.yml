name: PSQ80 Protected Uploader QA
on:
  push:
    branches: [feat/psq80-staging-20261110]
    paths:
      - paper-squishy/psq80-upload.html
      - paper-squishy/psq80/test-uploader.cjs
      - .github/workflows/psq80-uploader-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uploader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Confirm administrator gate and reject incorrect files
        run: node paper-squishy/psq80/test-uploader.cjs
