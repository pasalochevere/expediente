name: Temp Rev01 D11B GQ8MSC Live QA
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11b-gq8msc.yml'
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA dependency
        run: |
          mkdir -p /tmp/d11b && cd /tmp/d11b
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Join two real browser players and verify multiplayer
        run: |
          cd /tmp/d11b
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const ROOM='GQ8MSC';
          const BASE='https://pasalochevere.github.io/expediente/caso001-rev01/';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome/Chromium not found');
          const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const contexts=[];
          const errors=[];
          const log=s=>console.log(`[D11B-GQ8MSC] ${s}`);
          function trap(page,label){
            page.on('pageerror',e=>errors.push(`${label} pageerror: ${e.message||e}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text())) errors.push(`${label} console: ${m.text()}`)});
          }
          async function make(label,characterIndex,name,viewport){
            const ctx=await browser.newContext({viewport}); contexts.push(ctx);
            const p=await ctx.newPage(); trap(p,label);
            await p.goto(`${BASE}?room=${ROOM}&qa=${label}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(()=>/MOTOR P2 LISTO|MOTOR NO DISPONIBLE/.test(document.querySelector('#runtimeState')?.textContent||''),null,{timeout:30000});
            const runtime=await p.locator('#runtimeState').innerText();
            if(!runtime.includes('MOTOR P2 LISTO')) throw new Error(`${label} runtime: ${runtime}`);
            const pro=p.locator('#prologue');
            if(await pro.count() && !(await pro.evaluate(el=>el.classList.contains('hidden')))) await p.click('#prologueSkip');
            await p.fill('#displayName',name);
            await p.click(`[data-char="${characterIndex}"]`);
            await p.click('#enterRoom');
            await p.waitForFunction(room=>document.querySelector('#code')?.textContent?.trim()===room,ROOM,{timeout:30000});
            log(`${label} JOIN PASS`);
            return p;
          }
          try{
            const p2=await make('P2',0,'QA Santiago',{width:900,height:900});
            const p3=await make('P3',2,'QA Vera',{width:390,height:844});
            log('TWO INDEPENDENT PLAYERS JOINED');
            await p2.waitForFunction(()=>!document.querySelector('#game')?.classList.contains('hidden'),null,{timeout:600000});
            await p3.waitForFunction(()=>!document.querySelector('#game')?.classList.contains('hidden'),null,{timeout:600000});
            log('GAME START REALTIME PASS');
            for(const [p,label] of [[p2,'P2'],[p3,'P3']]){
              await p.waitForFunction(()=>document.querySelectorAll('#publicEvidence .evidenceDoc').length>0,null,{timeout:30000});
              await p.waitForFunction(()=>!!document.querySelector('#roleBox .privateDossier'),null,{timeout:30000});
              log(`${label} E1 + PRIVATE DOSSIER PASS`);
            }
            await p2.click('#directorHelp');
            await p3.waitForFunction(()=>document.querySelectorAll('#timeline .directorDispatch').length>0,null,{timeout:30000});
            log('DIRECTOR CROSS-CLIENT REALTIME PASS');
            await p2.waitForFunction(()=>/ETAPA 2/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:600000});
            await p3.waitForFunction(()=>/ETAPA 2/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:30000});
            log('E2 REALTIME PASS');
            // Reingreso real del P2 en la misma sesión/contexto.
            await p2.goto(`${BASE}?qa=rejoin-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await p2.waitForFunction(()=>/MOTOR P2 LISTO|MOTOR NO DISPONIBLE/.test(document.querySelector('#runtimeState')?.textContent||''),null,{timeout:30000});
            const pro2=p2.locator('#prologue');
            if(await pro2.count() && !(await pro2.evaluate(el=>el.classList.contains('hidden')))) await p2.click('#prologueSkip');
            await p2.locator('#rejoinLast').waitFor({state:'visible',timeout:15000});
            await p2.click('#rejoinLast');
            await p2.waitForFunction(()=>!document.querySelector('#game')?.classList.contains('hidden')&&/ETAPA 2/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:30000});
            log('P2 REJOIN PASS');
            await p2.waitForFunction(()=>/ETAPA 3/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:600000});
            await p3.waitForFunction(()=>/ETAPA 3/.test(document.querySelector('#stageLabel')?.textContent||''),null,{timeout:30000});
            log('E3 REALTIME PASS');
            await p2.waitForFunction(()=>!document.querySelector('#solutionPanel')?.classList.contains('hidden')&&!!document.querySelector('#solutionBody .revealHero'),null,{timeout:600000});
            await p3.waitForFunction(()=>!document.querySelector('#solutionPanel')?.classList.contains('hidden')&&!!document.querySelector('#solutionBody .revealHero'),null,{timeout:30000});
            log('REVEAL CROSS-CLIENT PASS');
            const dims=await p3.evaluate(()=>[document.documentElement.scrollWidth,window.innerWidth]);
            if(dims[0]>dims[1]+4) throw new Error(`mobile overflow ${dims[0]}>${dims[1]}`);
            log(`MOBILE 390 PASS ${dims[0]}/${dims[1]}`);
            if(errors.length) throw new Error(errors.join(' | '));
            log('P2.12D.11B LIVE MULTIPLAYER QA PASS');
          } finally {
            for(const c of contexts) await c.close().catch(()=>{});
            await browser.close().catch(()=>{});
          }
          JS
          node qa.mjs