name: Portal dynamic duration patch
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/portal-duration-patch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded portal patch
        run: python scripts/patch_portal_dynamic_duration.py
      - name: Commit portal update
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add portal-v2/index.html
          git diff --cached --check
          git commit -m "Portal: show dynamic license duration"
          git push
