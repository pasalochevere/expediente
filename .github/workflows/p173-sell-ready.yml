name: VINC P1.7.3 Sell Ready

on:
  push:
    paths:
      - '.github/workflows/p173-sell-ready.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup and patch VÍNCORES + Portal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vincores/backups portal-v2/backups
          cp vincores/index.html vincores/backups/P1.7.2_before_P1.7.3_sell_ready.html
          cp portal-v2/index.html portal-v2/backups/portal_before_vincores_sell_ready.html
          python3 - <<'PY'
          from pathlib import Path

          vp=Path('vincores/index.html')
          s=vp.read_text(encoding='utf-8')

          replacements={
            'PASALOCHEVERE · BIENESTAR & VÍNCULOS · P1.6.1':'PASALOCHEVERE · BIENESTAR & VÍNCULOS',
            '<div class="eyebrow">SISTEMA VISUAL FÍSICO + DIGITAL</div>':'<div class="eyebrow">VÍNCORES DIGITAL · CAMPO INTERACTIVO</div>',
            'La experiencia digital conserva la lógica del kit físico: figuras de madera, tamaños, formas y una guía de conceptos; y suma color, rostros, vínculos, etapas, guardado y exportación.':'Creá escenas con figuras personalizables, vínculos, conceptos, etapas, práctica guiada, bitácora y exportación. Todo desde el navegador, sin instalar programas.',
            '<div class="introBadges"><span>Físico + digital</span><span>Campo interactivo</span><span>Guía de emociones</span><span>Escenas por etapas</span><span>Uso remoto</span></div>':'<div class="introBadges"><span>100% DIGITAL</span><span>Campo interactivo</span><span>Práctica guiada</span><span>Bitácora</span><span>Exportación PNG</span></div>',
            '<div class="notice">Herramienta visual de exploración sistémica. No realiza diagnósticos ni reemplaza atención psicológica, médica o profesional.</div>':'<div class="notice"><b>Producto 100% digital.</b> No incluye el kit físico. Herramienta visual de exploración sistémica; no realiza diagnósticos ni reemplaza atención psicológica, médica o profesional.</div>',
            '<div class="eyebrow">DEL OBJETO FÍSICO AL CAMPO DIGITAL</div>':'<div class="eyebrow">CAMPO DIGITAL INTERACTIVO</div>',
            '<h2>El mismo sistema, con más posibilidades</h2>':'<h2>Representá, observá, mové y registrá</h2>',
            '<p>VÍNCORES DIGITAL no reemplaza al kit: lo extiende. Podés preparar una escena, trabajar a distancia, probar movimientos y conservar distintas etapas sin perder el estado anterior.</p>':'<p>VÍNCORES DIGITAL funciona como una herramienta independiente. Podés crear una escena, probar movimientos, guardar distintas etapas y registrar la práctica sin necesitar el kit físico.</p>',
            '<article class="featureCard"><b>32 figuras de referencia</b><p>Cilindros y prismas de distintas alturas para representar personas, generaciones y roles.</p></article>':'<article class="featureCard"><b>Figuras ilimitadas</b><p>Agregá todos los cilindros y prismas que necesites, en distintos tamaños, con nombre, color, rostro y orientación.</p></article>',
            '<article class="featureCard"><b>40 emociones y conceptos</b><p>La biblioteca mantiene la guía del sistema físico y permite sumar conceptos directamente al campo.</p></article>':'<article class="featureCard"><b>34 conceptos únicos</b><p>Biblioteca digital reutilizable basada en los 40 cubos del sistema físico, sin límite de repeticiones dentro del campo.</p></article>',
            '<div class="eyebrow">MATERIAL DEL SISTEMA</div>':'<div class="eyebrow">ORIGEN DEL SISTEMA</div>',
            '<h2>Producto, figuras y guía</h2>':'<h2>Inspirado en nuestro sistema físico</h2>',
            '<p>Recuperamos la referencia visual del producto real y de la guía porque ayudan a entender de dónde nace la herramienta digital.</p>':'<p>Estas imágenes muestran el sistema físico que inspiró VÍNCORES DIGITAL. <b>El acceso digital no incluye piezas, caja ni elementos físicos.</b></p>',
            '<figcaption>Kit VÍNCORES: figuras de madera, cubos de emociones, guía y caja contenedora.</figcaption>':'<figcaption>Referencia del kit físico VÍNCORES. Se vende por separado y no está incluido en el acceso digital.</figcaption>',
            "let brand=D.querySelector('.brand small');brand&&brand.insertAdjacentHTML('beforeend','<span class=\"p17review\">P1.7.2</span>');":"let brand=D.querySelector('.brand small');",
            '<h2>P1.7.2 · Facilitador de sesión</h2>':'<h2>Facilitador de sesión</h2>'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Falta patrón VÍNCORES: '+old[:90])
              s=s.replace(old,new,1)

          library = r'''
          <style id="p173-sell-ready-style">
          .sceneLibraryOverlay{position:fixed;inset:0;z-index:180;background:rgba(24,20,18,.64);backdrop-filter:blur(5px);display:none;place-items:center;padding:18px}.sceneLibraryOverlay.open{display:grid}.sceneLibraryCard{width:min(920px,100%);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#fffdfa,#f2ece4);border:1px solid #d9cfc2;border-radius:24px;padding:20px;box-shadow:0 28px 80px rgba(0,0,0,.3)}.sceneLibraryHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sceneLibraryHead h2{margin:4px 0 6px}.sceneLibraryHead p{margin:0;color:#716960;font-size:.78rem;line-height:1.5}.sceneLibraryGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.sceneCard{background:#fff;border:1px solid #ded4c8;border-radius:16px;padding:13px}.sceneCard b{display:block;font-size:.9rem;margin-bottom:4px}.sceneCard small{display:block;color:#776f67;line-height:1.45}.sceneCard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.sceneCard button{border:1px solid #d7cec2;background:#fff;border-radius:9px;padding:7px 9px;font-size:.68rem;font-weight:900}.sceneCard button.primary{background:#2f8f83;border-color:#2f8f83;color:#fff}.sceneCard button.danger{background:#fff2ef;border-color:#ebcbc5;color:#9c4d43}.sceneLibraryTools{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #e1d8cd;padding-top:13px}.sceneLibraryNote{font-size:.7rem;line-height:1.5;color:#6f675f;background:#f8f4ee;border:1px solid #e3d9cc;border-radius:12px;padding:10px;margin-top:12px}.sellReadyBadge{display:inline-flex;align-items:center;gap:5px;background:#e8f5f1;color:#1e6d64;border:1px solid #cce4de;border-radius:999px;padding:5px 9px;font-size:.62rem;font-weight:950;letter-spacing:.05em}.stageTools .leftTools{flex-wrap:wrap}@media(max-width:700px){.sceneLibraryGrid{grid-template-columns:1fr}}
          </style>
          <div class="sceneLibraryOverlay" id="sceneLibraryOverlay">
            <div class="sceneLibraryCard">
              <div class="sceneLibraryHead"><div><div class="sellReadyBadge">MIS ESCENAS · GUARDADO LOCAL</div><h2>Biblioteca de escenas</h2><p>Guardá varias prácticas en este navegador y retomá cada una con sus etapas y su bitácora.</p></div><button class="btn" id="sceneLibraryClose">Cerrar</button></div>
              <div class="sceneLibraryGrid" id="sceneLibraryGrid"></div>
              <div class="sceneLibraryTools"><button class="btn primary" id="sceneLibraryNew">+ Nueva escena</button><button class="btn" id="sceneLibraryExport">Exportar respaldo</button><label class="btn" for="sceneLibraryImport" style="cursor:pointer">Importar respaldo</label><input id="sceneLibraryImport" type="file" accept="application/json,.json" hidden></div>
              <div class="sceneLibraryNote"><b>Privacidad y respaldo:</b> escenas y bitácoras se guardan únicamente en este navegador. No se sincronizan entre dispositivos. Evitá el modo incógnito y exportá un respaldo si querés conservar una copia. En equipos compartidos, evitá registrar información sensible o eliminá la escena al finalizar.</div>
            </div>
          </div>
          <script id="p173-scene-library">
          (()=>{
            const LIB='vincores_scene_library_v1', CURRENT='vincores_current_scene_id_v1', OLD='vincores_scene_v2';
            const $=id=>document.getElementById(id); let currentId=sessionStorage.getItem(CURRENT)||null;
            window.vincoresCurrentSceneId=currentId;
            function uid(){return 'sc-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
            function readLib(){try{return JSON.parse(localStorage.getItem(LIB)||'[]')}catch{return[]}}
            function writeLib(v){localStorage.setItem(LIB,JSON.stringify(v))}
            function journalData(){const ids=['jtitle','jintent','jobs','jmoves','jins','jfree'],keys=['title','intent','obs','moves','ins','free'],o={};ids.forEach((id,i)=>o[keys[i]]=$(id)?.value||'');return o}
            function applyJournal(j={}){const map={jtitle:'title',jintent:'intent',jobs:'obs',jmoves:'moves',jins:'ins',jfree:'free'};for(const [id,k] of Object.entries(map)){if($(id))$(id).value=j[k]||''}try{localStorage.setItem('vincores_p17_journal_v1',JSON.stringify({...j,updatedAt:new Date().toISOString()}))}catch{}}
            function migrate(){let lib=readLib();if(lib.length)return;const raw=localStorage.getItem(OLD);if(!raw)return;try{const d=JSON.parse(raw);lib=[{id:uid(),name:d.name||'Escena recuperada',state:d.state||{nodes:d.data||[],relations:[]},stages:d.stages||[],activeStage:Number.isInteger(d.activeStage)?d.activeStage:-1,journal:{},updatedAt:d.updatedAt||Date.now()}];writeLib(lib)}catch{}}
            function syncCurrentJournal(){if(!currentId)return;let lib=readLib(),i=lib.findIndex(x=>x.id===currentId);if(i<0)return;lib[i].journal=journalData();lib[i].updatedAt=Date.now();writeLib(lib)}
            function saveCurrent(){let lib=readLib(),name=($('sceneName')?.value||'').trim()||'Escena sin nombre';if(!currentId){currentId=uid();window.vincoresCurrentSceneId=currentId;sessionStorage.setItem(CURRENT,currentId)}let i=lib.findIndex(x=>x.id===currentId);const rec={id:currentId,name,state:serializeState(),stages:clone(stages),activeStage,journal:journalData(),updatedAt:Date.now()};if(i>=0)lib[i]=rec;else lib.unshift(rec);writeLib(lib);renderLibrary();showToast('Escena guardada en Mis escenas')}
            function loadScene(id){syncCurrentJournal();const r=readLib().find(x=>x.id===id);if(!r)return;currentId=id;window.vincoresCurrentSceneId=id;sessionStorage.setItem(CURRENT,id);$('sceneName').value=r.name||'';restoreState(r.state||{nodes:[],relations:[]});stages=clone(r.stages||[]);activeStage=Number.isInteger(r.activeStage)?r.activeStage:-1;renderStages();resetHistory();applyJournal(r.journal||{});closeLibrary();showToast('Escena cargada')}
            function newScene(){if((board.querySelector('.node')||journalData().free||journalData().obs)&&!confirm('¿Crear una escena nueva? Guardá la actual si querés conservarla.'))return;currentId=null;window.vincoresCurrentSceneId=null;sessionStorage.removeItem(CURRENT);clearBoard(true);stages=[];activeStage=-1;renderStages();$('sceneName').value='';applyJournal({});closeLibrary();showToast('Nueva escena lista')}
            function removeScene(id){const r=readLib().find(x=>x.id===id);if(!r||!confirm('¿Eliminar “'+r.name+'”? Esta acción no se puede deshacer.'))return;let lib=readLib().filter(x=>x.id!==id);writeLib(lib);if(currentId===id){currentId=null;window.vincoresCurrentSceneId=null;sessionStorage.removeItem(CURRENT)}renderLibrary()}
            function renameScene(id){let lib=readLib(),i=lib.findIndex(x=>x.id===id);if(i<0)return;const n=prompt('Nuevo nombre:',lib[i].name||'Escena');if(!n?.trim())return;lib[i].name=n.trim();lib[i].updatedAt=Date.now();writeLib(lib);if(currentId===id)$('sceneName').value=n.trim();renderLibrary()}
            function duplicateScene(id){let lib=readLib(),r=lib.find(x=>x.id===id);if(!r)return;let cp=JSON.parse(JSON.stringify(r));cp.id=uid();cp.name=(r.name||'Escena')+' · copia';cp.updatedAt=Date.now();lib.unshift(cp);writeLib(lib);renderLibrary()}
            function renderLibrary(){const g=$('sceneLibraryGrid'),lib=readLib().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));if(!lib.length){g.innerHTML='<div class="sceneLibraryNote" style="grid-column:1/-1">Todavía no hay escenas guardadas. Cerrá esta ventana, armá tu campo y tocá <b>Guardar</b>.</div>';return}g.innerHTML=lib.map(r=>`<article class="sceneCard"><b>${escapeHTML(r.name||'Escena')}</b><small>${new Date(r.updatedAt||Date.now()).toLocaleString('es-AR')} · ${(r.state?.nodes||[]).length} elementos · ${(r.stages||[]).length} etapas</small><div class="row"><button class="primary" data-open="${r.id}">Abrir</button><button data-rename="${r.id}">Renombrar</button><button data-copy="${r.id}">Duplicar</button><button class="danger" data-del="${r.id}">Eliminar</button></div></article>`).join('');g.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>loadScene(b.dataset.open));g.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameScene(b.dataset.rename));g.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>duplicateScene(b.dataset.copy));g.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeScene(b.dataset.del))}
            function openLibrary(){syncCurrentJournal();renderLibrary();$('sceneLibraryOverlay').classList.add('open')}
            function closeLibrary(){$('sceneLibraryOverlay').classList.remove('open')}
            function exportBackup(){syncCurrentJournal();const payload={type:'VINCORES_BACKUP',version:1,exportedAt:new Date().toISOString(),scenes:readLib()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='vincores-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
            async function importBackup(file){try{const p=JSON.parse(await file.text());if(p?.type!=='VINCORES_BACKUP'||!Array.isArray(p.scenes))throw new Error('Archivo de respaldo no válido.');if(!confirm('¿Importar '+p.scenes.length+' escenas? Se combinarán con las actuales.'))return;let lib=readLib(),ids=new Set(lib.map(x=>x.id));for(const r of p.scenes){let x=JSON.parse(JSON.stringify(r));if(!x.id||ids.has(x.id))x.id=uid();ids.add(x.id);lib.push(x)}writeLib(lib);renderLibrary();showToast('Respaldo importado')}catch(e){alert(e.message||'No pude importar el respaldo.')}}
            migrate();
            const save=$('saveBtn'),load=$('loadBtn');if(save)save.onclick=saveCurrent;if(load){load.textContent='Mis escenas';load.onclick=openLibrary}
            const left=document.querySelector('.stageTools .leftTools');if(left&&!$('newSceneBtn')){const b=document.createElement('button');b.className='btn';b.id='newSceneBtn';b.textContent='+ Nueva';b.onclick=newScene;left.appendChild(b)}
            $('sceneLibraryClose').onclick=closeLibrary;$('sceneLibraryOverlay').addEventListener('click',e=>{if(e.target===$('sceneLibraryOverlay'))closeLibrary()});$('sceneLibraryNew').onclick=newScene;$('sceneLibraryExport').onclick=exportBackup;$('sceneLibraryImport').onchange=e=>{const f=e.target.files?.[0];if(f)importBackup(f);e.target.value=''};
            setTimeout(()=>{['jtitle','jintent','jobs','jmoves','jins','jfree'].forEach(id=>$(id)?.addEventListener('input',()=>{if(currentId){clearTimeout(window.__vincJournalTimer);window.__vincJournalTimer=setTimeout(syncCurrentJournal,400)}}))},900);
          })();
          </script>
          '''
          if 'id="p173-scene-library"' in s:
              raise SystemExit('P1.7.3 ya estaba inyectado')
          s=s.replace('</body>',library+'\n</body>',1)
          vp.write_text(s,encoding='utf-8')

          pp=Path('portal-v2/index.html')
          p=pp.read_text(encoding='utf-8')
          old='<article class="card" data-cat="wellbeing"><span class="status live">● BETA DISPONIBLE</span><h3>VÍNCORES DIGITAL</h3><div class="accent">Campo de constelación interactivo</div><p>Representá personas, roles, emociones y escenas relacionales en un campo visual personalizable. Incluye guardado local y exportación PNG.</p><div class="actions"><button class="btn primary" onclick="scrollToActivation()">ACTIVAR / PROBAR</button></div></article>'
          new='<article class="card" data-cat="wellbeing"><span class="status live">● DISPONIBLE</span><h3>VÍNCORES DIGITAL</h3><div class="accent">Campo de constelación interactivo</div><p>Representá personas, roles, emociones y escenas relacionales. Incluye práctica guiada, bitácora, biblioteca de escenas, etapas y exportación PNG.</p><div class="actions"><button class="btn primary" onclick="scrollToActivation()">ACTIVAR ACCESO</button></div></article>'
          if old not in p: raise SystemExit('No encontré card VÍNCORES en portal')
          p=p.replace(old,new,1)
          oldnews='<article class="newsCard" onclick="openCategory(\'wellbeing\')" style="cursor:pointer"><span class="newsTag new">NUEVO · BETA</span><b>VÍNCORES DIGITAL</b><p>Campo interactivo de vínculos, roles y emociones. Ya disponible para prueba.</p></article>'
          newnews='<article class="newsCard" onclick="openCategory(\'wellbeing\')" style="cursor:pointer"><span class="newsTag new">NUEVO</span><b>VÍNCORES DIGITAL</b><p>Campo interactivo con práctica guiada, bitácora y biblioteca de escenas. Disponible para activar.</p></article>'
          if oldnews not in p: raise SystemExit('No encontré novedad VÍNCORES en portal')
          p=p.replace(oldnews,newnews,1)
          pp.write_text(p,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          v=Path('vincores/index.html').read_text(encoding='utf-8')
          p=Path('portal-v2/index.html').read_text(encoding='utf-8')
          required=['100% DIGITAL','Figuras ilimitadas','34 conceptos únicos','id="p173-scene-library"','vincores_scene_library_v1','Exportar respaldo','Privacidad y respaldo','Facilitador de sesión','register_device','VINC-001','height:620px']
          for x in required:
              assert x in v, x
          forbidden=['SISTEMA VISUAL FÍSICO + DIGITAL','<span class="p17review">P1.7.2</span>','<h2>P1.7.2 · Facilitador de sesión</h2>']
          for x in forbidden:
              assert x not in v, x
          assert '<span class="status live">● DISPONIBLE</span><h3>VÍNCORES DIGITAL</h3>' in p
          assert 'NUEVO · BETA</span><b>VÍNCORES DIGITAL' not in p
          print('P1.7.3 validation OK',len(v),len(p))
          PY

      - name: Commit sell-ready release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PasaloChevere Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vincores/index.html portal-v2/index.html vincores/backups/P1.7.2_before_P1.7.3_sell_ready.html portal-v2/backups/portal_before_vincores_sell_ready.html
          git commit -m 'Release VÍNCORES P1.7.3 sell-ready'
          git push origin HEAD:main
