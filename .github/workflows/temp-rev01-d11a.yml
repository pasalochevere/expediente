name: Temp Rev01 D11A Access Mobile QA
on:
  push:
    paths:
      - '.github/workflows/temp-rev01-d11a.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply D11A
        run: python .github/scripts/patch_rev01_d11a.py
      - name: Static validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caso001-rev01/index.html').read_text()
          required=['P2.12D.11A · ACCESS PREFLIGHT + MOBILE QA','runtimeState','accessState','entryError','entryHelp','adapterReady','updateAccessPreflight','canCreateWithCurrentAccess','rev01-d11a-20260920']
          for t in required: assert t in s,t
          for d,n in [('personajes',6),('escenas',6),('objetos',6)]:
              files=[x for x in (Path('caso001-rev01/assets')/d).glob('*') if x.is_file()]
              assert len(files)==n,(d,len(files))
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S); assert m
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.S)
          Path('/tmp/rev01-d11a.js').write_text(code)
          print('D11A static anchors PASS · visual assets 18/18 PASS')
          PY
          node --check /tmp/rev01-d11a.js
      - name: Browser startup diagnostics
        run: |
          python3 -m http.server 8000 >/tmp/d11-http.log 2>&1 &
          mkdir -p /tmp/d11qa && cd /tmp/d11qa
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const paths=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath=paths.find(p=>fs.existsSync(p));
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1366,height:900}});
          const errors=[],logs=[],failed=[];
          page.on('pageerror',e=>errors.push(String(e.message||e)));
          page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`));
          page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText}`));
          await page.goto('http://127.0.0.1:8000/caso001-rev01/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(10000);
          console.log('RUNTIME=',await page.locator('#runtimeState').innerText().catch(()=>'<missing>'));
          console.log('ENTRY_ERROR=',await page.locator('#entryError').innerText().catch(()=>'<missing>'));
          console.log('SUPABASE_GLOBAL=',await page.evaluate(()=>!!globalThis.supabase));
          console.log('ENTER_DISABLED=',await page.locator('#enterRoom').isDisabled().catch(()=>true));
          console.log('PAGE_ERRORS=',JSON.stringify(errors));
          console.log('FAILED_REQUESTS=',JSON.stringify(failed));
          console.log('CONSOLE=',JSON.stringify(logs.slice(-30)));
          await browser.close();
          JS
          node diag.mjs
      - name: Browser and mobile QA
        run: |
          cd /tmp/d11qa
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const paths=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath=paths.find(p=>fs.existsSync(p));
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          for(const viewport of [{width:1366,height:900},{width:768,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8000/caso001-rev01/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const runtime=await page.locator('#runtimeState').innerText();
            if(!runtime.includes('MOTOR P2 LISTO')) throw new Error(`P2 init failed at ${viewport.width}: ${runtime} errors=${pageErrors.join(' | ')}`);
            const overflow=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:window.innerWidth}));
            if(overflow.sw>overflow.iw+3) throw new Error(`Horizontal overflow at ${viewport.width}: ${overflow.sw}>${overflow.iw}`);
            if(pageErrors.length) throw new Error(`pageerror ${viewport.width}: ${pageErrors.join(' | ')}`);
            if(viewport.width===1366){
              await page.click('#enterRoom'); await page.waitForTimeout(150);
              const err=await page.locator('#entryError').innerText();
              if(!/Portal|acceso/i.test(err)) throw new Error(`Missing persistent access guidance: ${err}`);
              await page.click('#tabJoin');
              if(await page.locator('#enterRoom').isDisabled()) throw new Error('Join button remained disabled after P2 init');
            }
            console.log(`VIEWPORT ${viewport.width} PASS overflow=${overflow.sw}/${overflow.iw}`);
            await page.close();
          }
          await browser.close();
          console.log('D11A browser/mobile QA PASS');
          JS
          node qa.mjs
      - name: Commit D11A
        run: |
          git config user.name "lunchpack-arg"
          git config user.email "pasalochevere@gmail.com"
          git add caso001-rev01/index.html
          git commit -m "P2.12D.11A access preflight and mobile hardening"
          git push
