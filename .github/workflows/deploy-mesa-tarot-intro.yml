name: Deploy Mesa Tarot Intro

on:
  push:
    paths:
      - '.github/workflows/deploy-mesa-tarot-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact approved Tarot intro
        env:
          SOURCE_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/8762f01e-827e-4ce7-9785-3e4fab9925e9.html'
        run: |
          set -euo pipefail
          mkdir -p mesa-tarot
          curl --fail --location --retry 3 "$SOURCE_URL" -o mesa-tarot/intro.html.new
          echo 'b22e0ca3973d16c956a5b3509d4132b12b28b29cd4b4f8bbf4f6918b3684acfc  mesa-tarot/intro.html.new' | sha256sum -c -
          mv mesa-tarot/intro.html.new mesa-tarot/intro.html

      - name: Integrate intro with existing Mesa Tarot app
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          intro = Path('mesa-tarot/intro.html')
          s = intro.read_text(encoding='utf-8')
          old = "enterHref: './MESA_TAROT_GUIA_INTERACTIVA_DE_TAROT.html',"
          new = "enterHref: './index.html' + window.location.search,"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('No encontré el enlace final esperado en la intro de Tarot')
          intro.write_text(s, encoding='utf-8')

          alias = Path('mesa-tarot/MESA_TAROT_GUIA_INTERACTIVA_DE_TAROT.html')
          alias.write_text('''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa Tarot</title></head><body><script>location.replace('./index.html'+location.search+location.hash)</script></body></html>''', encoding='utf-8')

          route = Path('portal-v2/tarot-intro-route.js')
          route.write_text(r'''(()=>{
            if(window.__pcTarotIntroRouteBoot)return;
            window.__pcTarotIntroRouteBoot=true;
            const install=()=>{
              if(typeof window.gameHref!=='function')return false;
              if(window.gameHref.__pcTarotIntroRoute)return true;
              const previous=window.gameHref;
              const wrapped=function(l){
                const product=String(l?.product_code||'').toUpperCase();
                if(product==='TAROT-78'||product.startsWith('TAROT-')){
                  const access=encodeURIComponent(l?.activation_code||'');
                  return '../mesa-tarot/intro.html?access='+access+'&build=20260923-tarot-intro-v1';
                }
                return previous(l);
              };
              wrapped.__pcTarotIntroRoute=true;
              window.gameHref=wrapped;
              return true;
            };
            if(install())return;
            let tries=0;
            const timer=setInterval(()=>{tries++;if(install()||tries>120)clearInterval(timer)},100);
          })();
          ''', encoding='utf-8')

          loader = Path('portal-v2/c002-rc.js')
          l = loader.read_text(encoding='utf-8')
          marker = 'pc-tarot-intro-route-js'
          if marker not in l:
              l += r'''

          (()=>{
            if(document.getElementById('pc-tarot-intro-route-js'))return;
            const js=document.createElement('script');
            js.id='pc-tarot-intro-route-js';
            js.src='tarot-intro-route.js?v=20260923-1';
            js.defer=true;
            document.head.appendChild(js);
          })();
          '''
              loader.write_text(l, encoding='utf-8')
          PY

      - name: QA deploy package
        run: |
          set -euo pipefail
          test -s mesa-tarot/intro.html
          grep -Fq 'Mesa Tarot · Intro Cinematográfica Final Corregida' mesa-tarot/intro.html
          grep -Fq "enterHref: './index.html' + window.location.search" mesa-tarot/intro.html
          grep -Fq 'TAROT-78' portal-v2/tarot-intro-route.js
          grep -Fq 'pc-tarot-intro-route-js' portal-v2/c002-rc.js
          test -s mesa-tarot/index.html
          echo 'Mesa Tarot intro package OK'

      - name: Commit production integration
        run: |
          set -euo pipefail
          git config user.name 'PasaloChevere Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add mesa-tarot/intro.html mesa-tarot/MESA_TAROT_GUIA_INTERACTIVA_DE_TAROT.html portal-v2/tarot-intro-route.js portal-v2/c002-rc.js
          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
            exit 0
          fi
          git commit -m 'feat(tarot): publish approved cinematic intro [skip ci]'
          git push origin HEAD:main
