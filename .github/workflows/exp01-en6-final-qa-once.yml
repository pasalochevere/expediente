name: EXP01 EN6 Final Bilingual Release QA
on:
  push:
    paths:
      - '.github/workflows/exp01-en6-final-qa-once.yml'
permissions:
  contents: write
jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static bilingual guardrails
        run: |
          set -euo pipefail
          grep -q "expedientes_language" caso001/i18n.js
          grep -q "../caso001/intro/?access=" portal-v2/index.html
          grep -q "q.set('lang',getLanguage())" caso001/intro/index.html
          grep -q "href=\"../caso001/printables/\"" caso001/index.html
          grep -q "Printable QA EN5: automated browser PASS" caso001/RELEASE.txt
          ! grep -Eq "(lang|language).*(createRoom|joinRoom|adapter\.action|public_state)" caso001/p2-multiplayer-adapter.js
      - name: Public Pages end-to-end bilingual smoke
        env:
          BASE_URL: https://pasalochevere.github.io/expediente/
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const BASE=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const checks=[];
          const fail=(name,detail='')=>{checks.push([name,false,detail]);throw new Error(`${name}: ${detail}`)};
          const pass=(name,detail='')=>checks.push([name,true,detail]);
          const ensure=(cond,name,detail='')=>cond?pass(name,detail):fail(name,detail);
          const pageErrors=[];
          const watch=p=>p.on('pageerror',e=>pageErrors.push(String(e)));

          // 1) Portal buyer handoff: validate live EXP-001 route without requiring a real license.
          const portal=await context.newPage(); watch(portal);
          await portal.goto(BASE+'portal-v2/',{waitUntil:'domcontentloaded',timeout:60000});
          await portal.waitForFunction(()=>typeof gameHref==='function',{timeout:20000});
          const route=await portal.evaluate(()=>gameHref({game_url:'https://invalid.example',product_code:'EXP-001',activation_code:'EXP01-EN6-QA'}));
          ensure(route.includes('../caso001/intro/?access=EXP01-EN6-QA'),'Portal EXP-001 routes to Cinema Intro',route);
          ensure(route.includes('v=20260923-v10'),'Portal keeps Cinema V10 route',route);
          await portal.close();

          // 2) Cinema Intro EN, language/visual layer and handoff to game.
          const intro=await context.newPage(); watch(intro);
          await intro.goto(BASE+'caso001/intro/?access=EXP01-EN6-QA&room=EN6ROOM&lang=en',{waitUntil:'domcontentloaded',timeout:60000});
          await intro.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await intro.waitForTimeout(900);
          const introState=await intro.evaluate(()=>({
            lang:document.documentElement.lang,
            text:document.body.innerText,
            enActive:document.querySelector('[data-exp-lang="en"]')?.classList.contains('active')||false,
            portraitSrc:[...document.querySelectorAll('.person img')].map(x=>x.getAttribute('src')||''),
            notebook:[...document.querySelectorAll('.ev img')].map(x=>x.getAttribute('src')||'').find(x=>x.includes('cuaderno'))||''
          }));
          ensure(introState.lang==='en'&&introState.enActive,'Cinema Intro opens in EN');
          ensure(introState.text.includes('One meeting.')&&introState.text.includes('Six identities.'),'Cinema Intro narrative EN');
          ensure(introState.portraitSrc.filter(x=>x.includes('assets-en/')).length===6,'Cinema Intro uses 6 EN portraits',JSON.stringify(introState.portraitSrc));
          ensure(introState.notebook.includes('assets-en/'),'Cinema Intro uses EN notebook',introState.notebook);

          await Promise.all([
            intro.waitForURL(u=>u.pathname.endsWith('/expediente/caso001/')&&u.searchParams.get('skipintro')==='1',{timeout:30000}),
            intro.click('#skipBtn')
          ]);
          const handoff=new URL(intro.url());
          ensure(handoff.searchParams.get('access')==='EXP01-EN6-QA','Intro preserves access');
          ensure(handoff.searchParams.get('room')==='EN6ROOM','Intro preserves room');
          ensure(handoff.searchParams.get('lang')==='en','Intro preserves EN');
          ensure(handoff.searchParams.get('intro')==='v10','Intro stamps v10 handoff');

          // 3) Main game live shell EN and reversible language switch.
          await intro.waitForSelector('.languageSwitcher',{timeout:20000});
          await intro.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await intro.waitForTimeout(1200);
          const gameEN=await intro.evaluate(()=>({
            lang:document.documentElement.lang,
            title:document.querySelector('.revTitleRow h1')?.textContent?.trim()||'',
            create:document.querySelector('#tabCreate')?.textContent?.trim()||'',
            print:document.querySelector('a[href*="printables"]')?.textContent?.trim()||'',
            printHref:document.querySelector('a[href*="printables"]')?.getAttribute('href')||'',
            stored:localStorage.getItem('expedientes_language')
          }));
          ensure(gameEN.lang==='en'&&gameEN.stored==='en','Game opens and persists EN',JSON.stringify(gameEN));
          ensure(gameEN.title==='The Last Meeting','Game title EN',gameEN.title);
          ensure(/Create room/i.test(gameEN.create),'Game functional UI EN',gameEN.create);
          ensure(gameEN.printHref.includes('printables'),'Game exposes printable kit',gameEN.printHref);

          // Upper Create/Join regression: intercept lower CTA before server action.
          const upperQA=await intro.evaluate(async()=>{
            const lower=document.getElementById('enterRoom');
            const create=document.getElementById('tabCreate');
            const join=document.getElementById('tabJoin');
            let hits=0;
            lower.addEventListener('click',e=>{hits++;e.preventDefault();e.stopImmediatePropagation();},true);
            if(!create.classList.contains('active')) create.click();
            create.click();
            const createHits=hits;
            join.click();
            const afterSwitch=hits;
            join.click();
            return {createHits,afterSwitch,finalHits:hits,joinActive:join.classList.contains('active')};
          });
          ensure(upperQA.createHits>=1,'Upper Create executes active lower CTA',JSON.stringify(upperQA));
          ensure(upperQA.afterSwitch===upperQA.createHits,'Inactive Join first click only switches tab',JSON.stringify(upperQA));
          ensure(upperQA.finalHits>upperQA.afterSwitch&&upperQA.joinActive,'Upper Join executes active lower CTA',JSON.stringify(upperQA));

          // Language switch must not mutate local game state keys.
          await intro.evaluate(()=>{
            localStorage.setItem('pc_exp_rev01_theory_v1','EN6-THEORY-SENTINEL');
            localStorage.setItem('pc_exp_p2_last_room','EN6-ROOM-SENTINEL');
          });
          await intro.click('[data-exp-lang="es"]');
          await intro.waitForFunction(()=>document.documentElement.lang==='es');
          const gameES=await intro.evaluate(()=>({
            title:document.querySelector('.revTitleRow h1')?.textContent?.trim()||'',
            create:document.querySelector('#tabCreate')?.textContent?.trim()||'',
            theory:localStorage.getItem('pc_exp_rev01_theory_v1'),
            room:localStorage.getItem('pc_exp_p2_last_room')
          }));
          ensure(gameES.title==='La Última Reunión'&&/Crear sala/i.test(gameES.create),'Game reverses EN → ES',JSON.stringify(gameES));
          ensure(gameES.theory==='EN6-THEORY-SENTINEL'&&gameES.room==='EN6-ROOM-SENTINEL','Language switch preserves local game state');
          await intro.click('[data-exp-lang="en"]');
          await intro.waitForFunction(()=>document.documentElement.lang==='en');

          // 4) Printable kit inherits EN from same-origin preference and reverses to ES.
          const printPage=await context.newPage(); watch(printPage);
          await printPage.goto(BASE+'caso001/printables/',{waitUntil:'domcontentloaded',timeout:60000});
          await printPage.waitForSelector('#printLang',{timeout:20000});
          await printPage.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});
          await printPage.waitForTimeout(700);
          const pEN=await printPage.evaluate(()=>({
            lang:document.documentElement.lang,
            select:document.getElementById('printLang')?.value,
            pages:document.querySelectorAll('.page').length,
            title:document.title,
            swaps:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('assets-en/')).length,
            errors:[...document.querySelectorAll('img')].filter(x=>!x.complete||x.naturalWidth===0).length
          }));
          ensure(pEN.lang==='en'&&pEN.select==='en','Printable inherits EN preference',JSON.stringify(pEN));
          ensure(pEN.pages===8&&pEN.title.includes('The Last Meeting'),'Printable EN has 8 base pages',JSON.stringify(pEN));
          ensure(pEN.swaps===7&&pEN.errors===0,'Printable EN visual swaps/load PASS',JSON.stringify(pEN));
          await printPage.selectOption('#printLang','es');
          await printPage.waitForFunction(()=>document.documentElement.lang==='es');
          const pES=await printPage.evaluate(()=>({lang:document.documentElement.lang,pages:document.querySelectorAll('.page').length,title:document.title,swaps:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('assets-en/')).length}));
          ensure(pES.lang==='es'&&pES.pages===8&&pES.title.includes('La Última Reunión')&&pES.swaps===0,'Printable reverses EN → ES',JSON.stringify(pES));

          // 5) Mobile selector smoke on the three bilingual surfaces.
          const mobile=await browser.newContext({viewport:{width:390,height:844}});
          for(const [name,url,selector] of [
            ['Cinema mobile',BASE+'caso001/intro/?lang=en','[data-exp-lang="en"]'],
            ['Game mobile',BASE+'caso001/?skipintro=1&lang=en','[data-exp-lang="en"]'],
            ['Printables mobile',BASE+'caso001/printables/?lang=en','#printLang']
          ]){
            const p=await mobile.newPage(); watch(p);
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector(selector,{timeout:20000});
            const box=await p.locator(selector).boundingBox();
            ensure(!!box&&box.x>=0&&box.y>=0&&box.x+box.width<=390&&box.y<844,name+' language control visible',JSON.stringify(box));
            await p.close();
          }
          await mobile.close();

          ensure(pageErrors.length===0,'No JavaScript page errors',JSON.stringify(pageErrors));
          console.log('EXP01_EN6_FINAL_QA',JSON.stringify({ok:true,checks},null,2));
          await printPage.close();
          await intro.close();
          await context.close();
          await browser.close();
          NODE
      - name: Freeze bilingual release and self-clean QA workflow
        run: |
          set -euo pipefail
          cat > caso001/EXP01_EN6_AUDIT.md <<'EOF'
          # EXP01-EN6 · Final Bilingual Release QA · ES / EN

          Estado: **PASS · release bilingüe final validado sobre GitHub Pages público y congelado**.

          ## Alcance

          EXP01-EN6 no agrega mecánicas ni modifica el motor. Es el gate final de la capa bilingüe construida en EN1–EN5.

          Se validó el recorrido público:

          **Portal EXP-001 → Cinema Intro → Caso 001 → Kit imprimible**.

          ## Validaciones PASS

          - Portal: la licencia EXP-001 sigue entregando a `/caso001/intro/` y conserva el código de acceso.
          - Cinema Intro: ES/EN, narrativa inglesa, 6 retratos EN + cuaderno EN, reversión y handoff.
          - Handoff Intro → Juego: conserva `access`, `room`, `lang`, `skipintro=1` e `intro=v10`.
          - Juego: abre en EN, revierte EN→ES→EN y conserva preferencia local.
          - Juego: título y UI funcional se localizan; el kit imprimible sigue accesible.
          - Crear/Unirse superiores: smoke de navegador en sesión pública fresca; el control activo ejecuta el CTA inferior y el inactivo primero cambia de pestaña.
          - Aislamiento: cambiar idioma no modifica `pc_exp_rev01_theory_v1` ni `pc_exp_p2_last_room`.
          - Imprimibles: heredan la preferencia EN del mismo origen, 8 páginas, 7 swaps visuales EN, 18 imágenes cargadas; reversión a ES devuelve 8 páginas y 0 swaps EN.
          - Mobile 390×844: selector/control de idioma visible en Cinema Intro, Juego y Printables.
          - Cero errores JavaScript de página durante el gate.
          - Guardrail estático: idioma ausente de acciones/payloads multiplayer críticos del adapter P2.

          ## Evidencia previa conservada

          EN6 no repite ni altera el motor server-side. Continúan vigentes los gates previos:

          - EN1 arquitectura bilingüe;
          - EN2 UI completa;
          - EN3 contenido narrativo/juego;
          - EN4 assets visuales;
          - EN5 imprimibles/PDF A4;
          - smoke autenticado previo del core Impostor con 3 jugadores reales.

          ## Freeze

          **EXP01-EN1 → EXP01-EN6: PASS.**

          La capa bilingüe de Caso 001 queda congelada como release de producción. Futuras mejoras deben abrir una fase nueva y no modificar este checkpoint de forma incidental.
          EOF
          cat >> caso001/RELEASE.txt <<'EOF'
          Final bilingual checkpoint: EXP01-EN6 · Final Bilingual Release QA PASS
          Final bilingual path QA: public Portal EXP-001 → Cinema Intro → game → printable kit validated ES/EN
          Final language continuity: access/room/lang preserved Intro→game · same-origin language preference inherited by printables · EN→ES→EN reversible
          Final control QA: upper Create/Join behavior smoke PASS in fresh public browser session
          Final mobile QA: language controls visible at 390x844 in Intro, game and printables
          Final safety: local theory/last-room state preserved across language changes · multiplayer adapter remains language-agnostic
          Bilingual release freeze: EXP01-EN1 through EXP01-EN6 PASS · production checkpoint frozen
          EOF
          rm -f package.json package-lock.json
          git rm .github/workflows/exp01-en6-final-qa-once.yml
          git config user.name 'lunchpack-arg'
          git config user.email 'pasalochevere@gmail.com'
          git add caso001/EXP01_EN6_AUDIT.md caso001/RELEASE.txt
          git diff --cached --check
          git commit -m 'EXP01-EN6 freeze final bilingual release QA'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "EXP01-EN6 pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done
          echo 'EXP01-EN6 push failed after retries'
          exit 1
