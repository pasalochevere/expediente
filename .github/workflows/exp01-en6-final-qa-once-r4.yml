name: EXP01 EN6 Final Bilingual Release QA R4
on:
  push:
    paths:
      - '.github/workflows/exp01-en6-final-qa-once-r4.yml'
permissions:
  contents: write
  actions: read
jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply EN6 hardening patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Printables inherit the global language chosen in Intro/Game.
          p=Path('caso001/printables/i18n-en5.js')
          s=p.read_text(encoding='utf-8')
          if "GLOBAL_STORAGE_KEY='expedientes_language'" not in s:
              a="const STORAGE_KEY='expedientes.c001.printables.lang';\nconst VALID_LANGS=new Set(['es','en']);"
              b="const STORAGE_KEY='expedientes.c001.printables.lang';\nconst GLOBAL_STORAGE_KEY='expedientes_language';\nconst VALID_LANGS=new Set(['es','en']);"
              if a not in s: raise SystemExit('printable storage anchor missing')
              s=s.replace(a,b,1)
              a="if(persist){try{localStorage.setItem(STORAGE_KEY,next)}catch{}}"
              b="if(persist){try{localStorage.setItem(STORAGE_KEY,next);localStorage.setItem(GLOBAL_STORAGE_KEY,next)}catch{}}"
              if a not in s: raise SystemExit('printable persist anchor missing')
              s=s.replace(a,b,1)
              a="  try{\n    const stored=localStorage.getItem(STORAGE_KEY);\n    if(VALID_LANGS.has(stored)) return stored;\n  }catch{}\n  return 'es';"
              b="  try{\n    const globalStored=localStorage.getItem(GLOBAL_STORAGE_KEY);\n    if(VALID_LANGS.has(globalStored)) return globalStored;\n    const stored=localStorage.getItem(STORAGE_KEY);\n    if(VALID_LANGS.has(stored)) return stored;\n  }catch{}\n  return 'es';"
              if a not in s: raise SystemExit('printable initialLanguage anchor missing')
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          # 2) Robust upper Create/Join delegation. Active control executes lower CTA;
          # inactive control remains a mode switch. No server/backend changes.
          p=Path('caso001/p2-multiplayer-adapter.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function wireUpperEntryActions(){')
          end=s.index('\nfunction hydrateEntryUi(){',start)
          new=r'''function wireUpperEntryActions(){
  if(typeof document==='undefined') return;
  const root=document.documentElement;
  if(root?.dataset?.pcUpperEntryDelegated==='1') return;
  if(root?.dataset) root.dataset.pcUpperEntryDelegated='1';

  // Delegamos desde document para que ambos controles superiores tengan
  // exactamente el mismo comportamiento, incluso tras re-render/localización.
  document.addEventListener('click',(event)=>{
    const raw=event.target;
    const upper=raw instanceof Element?raw.closest('#tabCreate,#tabJoin'):null;
    if(!(upper instanceof HTMLButtonElement)) return;

    // Si está inactivo, el handler original sólo cambia de pestaña.
    if(!upper.classList.contains('active')) return;

    // Si ya está activo, se comporta como el CTA inferior de esa acción.
    const lower=document.getElementById('enterRoom');
    if(!(lower instanceof HTMLButtonElement)||lower.disabled) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    lower.click();
  },true);
}
'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check caso001/printables/i18n-en5.js
          node --check caso001/p2-multiplayer-adapter.js
          grep -q "GLOBAL_STORAGE_KEY='expedientes_language'" caso001/printables/i18n-en5.js
          grep -q "pcUpperEntryDelegated" caso001/p2-multiplayer-adapter.js
          git diff --check

      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Local full bilingual gate
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exp01-en6-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/caso001/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173/ node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const B=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const c=await browser.newContext({viewport:{width:1280,height:900}});
          const errs=[],checks=[];const watch=p=>p.on('pageerror',e=>errs.push(String(e)));const ok=(x,n,d='')=>{if(!x)throw new Error(`${n}: ${d}`);checks.push([n,true,d])};

          const portal=await c.newPage();watch(portal);await portal.goto(B+'portal-v2/',{waitUntil:'domcontentloaded',timeout:60000});await portal.waitForFunction(()=>typeof gameHref==='function',{timeout:20000});const route=await portal.evaluate(()=>gameHref({game_url:'x',product_code:'EXP-001',activation_code:'EXP01-EN6-QA'}));ok(route.includes('../caso001/intro/?access=EXP01-EN6-QA'),'portal route',route);await portal.close();

          const p=await c.newPage();watch(p);await p.goto(B+'caso001/intro/?access=EXP01-EN6-QA&room=EN6ROOM&lang=en',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForTimeout(500);
          let x=await p.evaluate(()=>({text:document.body.textContent||'',portraits:[...document.querySelectorAll('.person img')].map(i=>i.getAttribute('src')||''),notebook:[...document.querySelectorAll('.ev img')].map(i=>i.getAttribute('src')||'').find(s=>s.includes('cuaderno'))||''}));
          ok(x.text.includes('One meeting.')&&x.text.includes('Six identities.'),'intro EN narrative');ok(x.portraits.filter(s=>s.includes('assets-en/')).length===6,'intro EN portraits',JSON.stringify(x.portraits));ok(x.notebook.includes('assets-en/'),'intro EN notebook',x.notebook);
          await Promise.all([p.waitForURL(u=>u.pathname.endsWith('/caso001/')&&u.searchParams.get('skipintro')==='1',{timeout:30000}),p.click('#skipBtn')]);const h=new URL(p.url());ok(h.searchParams.get('access')==='EXP01-EN6-QA'&&h.searchParams.get('room')==='EN6ROOM'&&h.searchParams.get('lang')==='en'&&h.searchParams.get('intro')==='v10','intro handoff',h.search);
          await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForSelector('#tabCreate',{state:'attached',timeout:20000});await p.waitForTimeout(500);x=await p.evaluate(()=>({title:document.querySelector('.revTitleRow h1')?.textContent?.trim(),create:document.getElementById('tabCreate')?.textContent?.trim(),stored:localStorage.getItem('expedientes_language')}));ok(x.title==='The Last Meeting'&&/Create room/i.test(x.create||'')&&x.stored==='en','game EN',JSON.stringify(x));

          const wiring=await p.evaluate(()=>{
            const lower=document.getElementById('enterRoom'),create=document.getElementById('tabCreate'),join=document.getElementById('tabJoin');let hits=0;
            lower.addEventListener('click',e=>{hits++;e.preventDefault();e.stopImmediatePropagation();},true);
            if(!create.classList.contains('active'))create.click();lower.disabled=false;create.click();const c=hits;
            join.click();const switchHits=hits;lower.disabled=false;join.click();const j=hits;
            return {c,switchHits,j,joinActive:join.classList.contains('active')};
          });
          ok(wiring.c===1&&wiring.switchHits===1&&wiring.j===2&&wiring.joinActive,'upper Create/Join wiring',JSON.stringify(wiring));

          await p.evaluate(()=>{localStorage.setItem('pc_exp_rev01_theory_v1','EN6-THEORY');localStorage.setItem('pc_exp_p2_last_room','EN6-ROOM')});await p.evaluate(()=>[...document.querySelectorAll('[data-exp-lang="es"]')].find(e=>e.offsetParent!==null)?.click());await p.waitForFunction(()=>document.documentElement.lang==='es');x=await p.evaluate(()=>({title:document.querySelector('.revTitleRow h1')?.textContent?.trim(),create:document.getElementById('tabCreate')?.textContent?.trim(),theory:localStorage.getItem('pc_exp_rev01_theory_v1'),room:localStorage.getItem('pc_exp_p2_last_room')}));ok(x.title==='La Última Reunión'&&/Crear sala/i.test(x.create||'')&&x.theory==='EN6-THEORY'&&x.room==='EN6-ROOM','game EN→ES state',JSON.stringify(x));await p.evaluate(()=>[...document.querySelectorAll('[data-exp-lang="en"]')].find(e=>e.offsetParent!==null)?.click());await p.waitForFunction(()=>document.documentElement.lang==='en');

          const pr=await c.newPage();watch(pr);await pr.goto(B+'caso001/printables/',{waitUntil:'domcontentloaded',timeout:60000});await pr.waitForSelector('#printLang',{timeout:20000});await pr.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await pr.waitForTimeout(700);x=await pr.evaluate(()=>({lang:document.documentElement.lang,sel:document.getElementById('printLang')?.value,global:localStorage.getItem('expedientes_language'),pages:document.querySelectorAll('.page').length,title:document.title,swaps:[...document.images].filter(i=>(i.getAttribute('src')||'').includes('assets-en/')).length,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).length}));ok(x.lang==='en'&&x.sel==='en'&&x.global==='en'&&x.pages===8&&x.title.includes('The Last Meeting'),'printables inherit EN',JSON.stringify(x));ok(x.swaps===7&&x.broken===0,'printables EN assets',JSON.stringify(x));await pr.selectOption('#printLang','es');await pr.waitForFunction(()=>document.documentElement.lang==='es');x=await pr.evaluate(()=>({global:localStorage.getItem('expedientes_language'),legacy:localStorage.getItem('expedientes.c001.printables.lang'),pages:document.querySelectorAll('.page').length,swaps:[...document.images].filter(i=>(i.getAttribute('src')||'').includes('assets-en/')).length}));ok(x.global==='es'&&x.legacy==='es'&&x.pages===8&&x.swaps===0,'printables ES restore',JSON.stringify(x));ok(errs.length===0,'local JS errors',JSON.stringify(errs));console.log('EXP01_EN6_LOCAL_PASS',JSON.stringify({checks},null,2));await pr.close();await p.close();await c.close();await browser.close();
          NODE

      - name: Commit EN6 functional hardening
        id: fix
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          git config user.name 'lunchpack-arg';git config user.email 'pasalochevere@gmail.com'
          git add caso001/printables/i18n-en5.js caso001/p2-multiplayer-adapter.js
          git diff --cached --check
          git commit -m 'EXP01-EN6 harden language continuity and entry controls'
          for a in 1 2 3 4 5;do git fetch origin main;if git rebase origin/main&&git push origin HEAD:main;then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT";exit 0;fi;git rebase --abort||true;sleep 2;done;exit 1

      - name: Wait for hardened Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 72);do D="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?head_sha=${FIX_SHA}&per_page=3")";S="$(printf '%s' "$D"|jq -r '.workflow_runs[0].status//"missing"')";C="$(printf '%s' "$D"|jq -r '.workflow_runs[0].conclusion//""')";echo "Pages $S $C";if [ "$S" = completed ];then test "$C" = success;exit 0;fi;sleep 5;done;exit 1

      - name: Public final gate
        env:
          BASE_URL: https://pasalochevere.github.io/expediente/
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';const B=process.env.BASE_URL,b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']}),c=await b.newContext({viewport:{width:1280,height:900}}),errs=[];const watch=p=>p.on('pageerror',e=>errs.push(String(e))),ok=(x,n,d='')=>{if(!x)throw new Error(`${n}: ${d}`)};
          const po=await c.newPage();watch(po);await po.goto(B+'portal-v2/',{waitUntil:'domcontentloaded',timeout:60000});await po.waitForFunction(()=>typeof gameHref==='function',{timeout:20000});const r=await po.evaluate(()=>gameHref({game_url:'x',product_code:'EXP-001',activation_code:'EXP01-EN6-QA'}));ok(r.includes('../caso001/intro/?access=EXP01-EN6-QA'),'portal',r);await po.close();
          const p=await c.newPage();watch(p);await p.goto(B+'caso001/intro/?access=EXP01-EN6-QA&room=EN6ROOM&lang=en',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForTimeout(500);ok((await p.evaluate(()=>document.body.textContent||'')).includes('One meeting.'),'intro EN');await Promise.all([p.waitForURL(u=>u.pathname.endsWith('/caso001/')&&u.searchParams.get('lang')==='en',{timeout:30000}),p.click('#skipBtn')]);await p.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await p.waitForTimeout(500);ok((await p.locator('.revTitleRow h1').textContent())?.trim()==='The Last Meeting','game EN');
          const w=await p.evaluate(()=>{const l=document.getElementById('enterRoom'),a=document.getElementById('tabCreate'),j=document.getElementById('tabJoin');let h=0;l.addEventListener('click',e=>{h++;e.preventDefault();e.stopImmediatePropagation()},true);if(!a.classList.contains('active'))a.click();l.disabled=false;a.click();const c=h;j.click();const s=h;l.disabled=false;j.click();return{c,s,f:h,j:j.classList.contains('active')}});ok(w.c===1&&w.s===1&&w.f===2&&w.j,'public upper controls',JSON.stringify(w));ok(await p.evaluate(()=>localStorage.getItem('expedientes_language'))==='en','global EN');
          const pr=await c.newPage();watch(pr);await pr.goto(B+'caso001/printables/',{waitUntil:'domcontentloaded',timeout:60000});await pr.waitForSelector('#printLang',{timeout:20000});await pr.waitForFunction(()=>document.documentElement.lang==='en',{timeout:15000});await pr.waitForTimeout(700);const s=await pr.evaluate(()=>({lang:document.documentElement.lang,sel:document.getElementById('printLang')?.value,pages:document.querySelectorAll('.page').length,title:document.title,swaps:[...document.images].filter(i=>(i.getAttribute('src')||'').includes('assets-en/')).length,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).length}));ok(s.lang==='en'&&s.sel==='en'&&s.pages===8&&s.title.includes('The Last Meeting')&&s.swaps===7&&s.broken===0,'public printables',JSON.stringify(s));
          const m=await b.newContext({viewport:{width:390,height:844}});for(const[n,u,sel]of[['Intro',B+'caso001/intro/?lang=en','[data-exp-lang="en"]:visible'],['Game',B+'caso001/?skipintro=1&lang=en','[data-exp-lang="en"]:visible'],['Printables',B+'caso001/printables/?lang=en','#printLang']]){const q=await m.newPage();watch(q);await q.goto(u,{waitUntil:'domcontentloaded',timeout:60000});await q.waitForSelector(sel,{timeout:20000});const z=await q.locator(sel).first().boundingBox();ok(z&&z.x>=0&&z.x+z.width<=390&&z.y>=0&&z.y<844,'mobile '+n,JSON.stringify(z));await q.close()}await m.close();ok(errs.length===0,'public JS errors',JSON.stringify(errs));console.log('EXP01_EN6_PUBLIC_PASS');await pr.close();await p.close();await c.close();await b.close();
          NODE

      - name: Freeze EN6 and self-clean
        run: |
          set -euo pipefail
          cat > caso001/EXP01_EN6_AUDIT.md <<'EOF'
          # EXP01-EN6 · Final Bilingual Release QA · ES / EN

          Estado: **PASS · release bilingüe final validado localmente y sobre GitHub Pages público; checkpoint congelado**.

          ## Hallazgos cerrados en EN6

          1. **Continuidad de idioma en imprimibles.** EN5 usaba una preferencia propia y podía abrir el kit en ES aunque el jugador hubiera elegido EN. Printables ahora prioriza `?lang`, luego `expedientes_language`, conserva la clave EN5 como fallback y sincroniza ambas al cambiar idioma.
          2. **Controles superiores Crear / Unirse.** El gate fresco confirmó que el wiring anterior era asimétrico: Unirse activo ejecutaba el CTA y Crear activo no. EN6 reemplaza ese wiring por delegación única desde `document`: un control inactivo cambia de pestaña; uno ya activo ejecuta exactamente el CTA inferior. No modifica estética ni backend.

          ## Recorrido final PASS

          - Portal EXP-001 → Cinema Intro.
          - Cinema Intro EN: narrativa y assets localizados.
          - Handoff Intro → Juego conserva `access`, `room`, `lang`, `skipintro=1` e `intro=v10`.
          - Juego ES/EN reversible y estado local de teoría/última sala preservado.
          - Crear/Unirse superiores PASS en gate local y nuevamente sobre GitHub Pages público, sin ejecutar acción server-side durante QA.
          - Printables heredan idioma del juego; 8 páginas EN, 7 swaps visuales EN y assets completos; reversión ES restaura assets y sincroniza preferencias.
          - Mobile 390×844: controles de idioma visibles en Intro, Juego y Printables.
          - Sin errores JavaScript en gates finales.

          ## Seguridad

          No se modificaron Crime Packs, Edge Functions, room state, timers, licencias, roles ni payloads multiplayer. Continúan vigentes EN1–EN5 y el smoke autenticado previo del core Impostor con 3 jugadores reales.

          ## Freeze

          **EXP01-EN1 → EXP01-EN6: PASS.** La capa bilingüe de Caso 001 queda congelada como checkpoint de producción.
          EOF
          cat >> caso001/RELEASE.txt <<'EOF'
          Final bilingual checkpoint: EXP01-EN6 · Final Bilingual Release QA PASS
          EN6 language continuity: Printables inherit global `expedientes_language`; legacy EN5 key retained as fallback and synchronized on change
          EN6 entry-control hardening: upper Create/Join use one delegated wiring; inactive switches mode, active executes lower CTA; local + public browser smoke PASS
          Final path QA: Portal EXP-001 → Cinema Intro → game → printables PASS locally and on public GitHub Pages
          Final handoff QA: access/room/lang/skipintro/intro-v10 preserved
          Final mobile QA: language controls visible at 390x844 on Intro, game and printables
          Final safety: theory/last-room local state preserved · backend/multiplayer payloads unchanged
          Bilingual release freeze: EXP01-EN1 through EXP01-EN6 PASS · production checkpoint frozen
          EOF
          rm -f package.json package-lock.json
          git rm -f .github/workflows/exp01-en6-final-qa-once.yml .github/workflows/exp01-en6-final-qa-once-r2.yml .github/workflows/exp01-en6-final-qa-once-r3.yml .github/workflows/exp01-en6-final-qa-once-r4.yml
          git config user.name 'lunchpack-arg';git config user.email 'pasalochevere@gmail.com';git add caso001/EXP01_EN6_AUDIT.md caso001/RELEASE.txt;git diff --cached --check;git commit -m 'EXP01-EN6 freeze final bilingual release QA'
          for a in 1 2 3 4 5;do git fetch origin main;if git rebase origin/main&&git push origin HEAD:main;then exit 0;fi;git rebase --abort||true;sleep 2;done;exit 1
