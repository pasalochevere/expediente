name: Chévere Kids P0.8.6 wire once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chevere-kids-p086-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire P0.8.6 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('torre-kids-matematica/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/kids-qa-v1.css?v=1.0.0">'
          js='<script src="assets/kids-qa-v1.js?v=1.0.0"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          s=s.replace("const TK_VERSION='1.2.0';","const TK_VERSION='1.3.0';")
          if "const KIDS_QA_VERSION='1.0.0';" not in s:
              s=s.replace("const ANSWER_ENGINE_VERSION='1.0.0';","const ANSWER_ENGINE_VERSION='1.0.0';\nconst KIDS_QA_VERSION='1.0.0';")
          s=s.replace('<span class="kid-chip">✓ V1.0 · FINAL</span>','<span class="kid-chip">✨ EXPERIENCIA MEJORADA</span>')
          s=s.replace('<span class="kid-chip">🔒 RESPUESTA ACTIVA</span>','<span class="kid-chip">✍️ RESPUESTA ACTIVA</span>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JS and wiring
        run: |
          node --check torre-kids-matematica/assets/kids-qa-v1.js
          node --check torre-kids-matematica/assets/answer-engine-v1.js
          node --check torre-kids-matematica/assets/cinema-engine-v3.js
          grep -q "kids-qa-v1.css" torre-kids-matematica/index.html
          grep -q "kids-qa-v1.js" torre-kids-matematica/index.html
          grep -q "TK_VERSION='1.3.0'" torre-kids-matematica/index.html
          grep -q "KIDS_QA_VERSION='1.0.0'" torre-kids-matematica/index.html
      - name: Commit wiring
        run: |
          git config user.name "pasalochevere-bot"
          git config user.email "pasalochevere@gmail.com"
          git add torre-kids-matematica/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Activate Chévere Kids P0.8.6 QA polish"
            git push
          fi
