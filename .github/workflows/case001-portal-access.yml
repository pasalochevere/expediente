name: Caso001 portal access patch
on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch_case001_portal_access.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Caso001 portal access
        run: python tools/patch_case001_portal_access.py
      - name: Commit fix
        run: |
          git config user.name "PasaloChevere Release Bot"
          git config user.email "pasalochevere@gmail.com"
          git add caso001/index.html
          git diff --cached --check
          git commit -m "Caso001: prioritize portal access over stale local license"
          git push
