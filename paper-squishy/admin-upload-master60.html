pe="button">REVISAR SESIÓN</button><a class="btn secondary" href="../portal-v2/">ABRIR PORTAL</a></div><p id="status"></p><pre id="log">Esperando archivo…</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
