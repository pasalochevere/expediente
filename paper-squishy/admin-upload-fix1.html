<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSQ P2.4.2-FIX.1A · Deploy</title><style>:root{--bg:#fff9ef;--ink:#34251f;--muted:#806f64;--line:#eadfd4;--yellow:#ffd458;--coral:#ff7867;--green:#2f8b57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(74,52,38,.10);margin:16px 0}.ey{font-size:11px;font-weight:900;letter-spacing:.15em;color:var(--coral)}h1{font-size:42px;line-height:.95;margin:8px 0 12px}p{color:var(--muted);line-height:1.55}.btn{border:2px solid var(--ink);border-radius:15px;padding:12px 16px;font-weight:900;background:#fff;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}.btn.primary{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}input[type=file]{width:100%;padding:16px;border:1px dashed #b7a89c;border-radius:16px;background:#fffaf3}.bar{height:16px;background:#eee5dc;border-radius:999px;overflow:hidden;margin:14px 0}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--yellow));transition:.2s}.log{white-space:pre-wrap;background:#171412;color:#f6eee7;border-radius:16px;padding:16px;min-height:140px;max-height:300px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace}.ok{color:var(--green);font-weight:900}.bad{color:#b73131;font-weight:900}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef8f1;color:#267343;font-weight:900;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><div class="ey">PAPER SQUISHY FACTORY · P2.4.2-FIX.1A</div><h1>Deploy del core restaurado</h1><p>El control compara <b>bytes reales + SHA-256 exacto</b>. Si ambos coinciden, la copia online es idéntica al archivo aprobado.</p><div id="account"></div></div><div class="card"><input id="coreFile" type="file" accept=".html,text/html"><div class="actions"><button id="uploadBtn" class="btn primary">PUBLICAR CORE RESTAURADO</button><button id="verifyBtn" class="btn">VERIFICAR CORE YA SUBIDO</button><a class="btn" href="./">VOLVER</a></div><div class="bar"><i id="bar"></i></div><div id="status"></div><div id="log" class="log">Listo para verificar…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://fzbndgfnqxcacsvlitui.supabase.co',K='sb_publishable_bJ91vnQUWHfFqWRO99fFkQ_dh0icDxo',BUCKET='paper-squishy-assets',PATH='v2.4/factory-core.html',SIZE=231666,HASH='6ffdfefb572188db8e4c99ccaa42a3d6ff28d3949df8d443f7eef69bb8497e00';const sb=supabase.createClient(U,K,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});const $=s=>document.querySelector(s),log=t=>{$('#log').textContent+='\n'+t;$('#log').scrollTop=$('#log').scrollHeight};async function hashBuffer(b){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function verifyAccess(){const r=await sb.functions.invoke('pasalochevere-access',{body:{action:'me'}});if(r.error||!r.data?.ok)throw new Error('No pude verificar tu cuenta.');const lic=(r.data.licenses||[]).find(x=>x.product_code==='PSQ-FACTORY'&&x.status==='active');if(!lic)throw new Error('Esta cuenta no tiene PAPER SQUISHY FACTORY activo.')}async function verifyOnline(){try{$('#status').textContent='';$('#log').textContent='Verificando copia online…';$('#bar').style.width='55%';const url=U+'/storage/v1/object/public/'+BUCKET+'/'+PATH+'?v='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const ab=await r.arrayBuffer(),h=await hashBuffer(ab);log('Bytes online: '+ab.byteLength);log('SHA-256 online: '+h);if(ab.byteLength!==SIZE)throw new Error('Tamaño online incorrecto.');if(h!==HASH)throw new Error('SHA-256 online no coincide.');$('#bar').style.width='100%';$('#status').innerHTML='<span class="ok">✓ DEPLOY COMPLETO · CORE RESTAURADO PUBLICADO</span>';log('✓ Integridad online exacta confirmada.');return true}catch(e){$('#status').innerHTML='<span class="bad">'+String(e.message||e)+'</span>';log('FALLO: '+String(e.message||e));return false}}(async()=>{const r=await sb.auth.getSession(),session=r.data.session;if(!session){$('#account').innerHTML='<span class="bad">No hay sesión. Ingresá primero desde el Portal PasaloChevere.</span>';$('#uploadBtn').disabled=$('#verifyBtn').disabled=true;return}try{await verifyAccess();$('#account').innerHTML='<span class="pill">✓ '+session.user.email+'</span>'}catch(e){$('#account').innerHTML='<span class="bad">'+e.message+'</span>';$('#uploadBtn').disabled=$('#verifyBtn').disabled=true}})();$('#verifyBtn').onclick=verifyOnline;$('#uploadBtn').onclick=async()=>{const file=$('#coreFile').files[0];if(!file){alert('Elegí el HTML restaurado.');return}$('#uploadBtn').disabled=true;$('#log').textContent='Validando archivo local…';$('#status').textContent='';try{const ab=await file.arrayBuffer(),h=await hashBuffer(ab);log('Bytes locales: '+ab.byteLength);log('SHA-256 local: '+h);if(ab.byteLength!==SIZE)throw new Error('Tamaño incorrecto.');if(h!==HASH)throw new Error('El archivo no coincide con el core aprobado.');log('✓ Integridad local correcta.');$('#bar').style.width='35%';const blob=new Blob([ab],{type:'text/html'});const {error}=await sb.storage.from(BUCKET).upload(PATH,blob,{contentType:'text/html; charset=utf-8',upsert:true,cacheControl:'0'});if(error)throw error;log('✓ Core subido a Storage.');$('#bar').style.width='70%';await verifyOnline()}catch(e){$('#status').innerHTML='<span class="bad">'+String(e.message||e)+'</span>';log('FALLO: '+String(e.message||e))}finally{$('#uploadBtn').disabled=false}};</script></body></html>
