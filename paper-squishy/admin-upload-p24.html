<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSQ P2.4 · Carga de assets</title><style>:root{--bg:#fff9ef;--ink:#34251f;--muted:#806f64;--line:#eadfd4;--yellow:#ffd458;--coral:#ff7867;--green:#2f8b57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:820px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(74,52,38,.10);margin:16px 0}.ey{font-size:11px;font-weight:900;letter-spacing:.15em;color:var(--coral)}h1{font-size:42px;line-height:.95;margin:8px 0 12px}p{color:var(--muted);line-height:1.55}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:2px solid var(--ink);border-radius:15px;padding:12px 16px;font-weight:900;background:#fff;cursor:pointer}.btn.primary{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}input[type=file]{width:100%;padding:16px;border:1px dashed #b7a89c;border-radius:16px;background:#fffaf3}.bar{height:16px;background:#eee5dc;border-radius:999px;overflow:hidden;margin:14px 0}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--yellow));transition:.2s}.log{white-space:pre-wrap;background:#171412;color:#f6eee7;border-radius:16px;padding:16px;min-height:140px;max-height:300px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace}.ok{color:var(--green);font-weight:900}.bad{color:#b73131;font-weight:900}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef8f1;color:#267343;font-weight:900;font-size:12px}</style></head><body><div class="wrap"><div class="card"><div class="ey">PAPER SQUISHY FACTORY · P2.4</div><h1>Carga de 50 diseños</h1><p>Esta pantalla carga al portal los assets de las 5 colecciones. Usá únicamente el ZIP preparado para P2.4.</p><div id="account"></div></div><div class="card"><input id="zipFile" type="file" accept=".zip,application/zip"><div class="row" style="margin-top:14px"><button id="uploadBtn" class="btn primary">SUBIR AL PORTAL</button><a class="btn" href="./">VOLVER</a></div><div class="bar"><i id="bar"></i></div><div id="status"></div><div id="log" class="log">Esperando archivo…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const U='https://fzbndgfnqxcacsvlitui.supabase.co',K='sb_publishable_bJ91vnQUWHfFqWRO99fFkQ_dh0icDxo',BUCKET='paper-squishy-assets';
const sb=supabase.createClient(U,K,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s),log=t=>{$('#log').textContent+=`\n${t}`;$('#log').scrollTop=$('#log').scrollHeight};
let session=null;
(async()=>{const r=await sb.auth.getSession();session=r.data.session;if(!session){$('#account').innerHTML='<span class="bad">No hay sesión. Ingresá primero desde el Portal PasaloChevere.</span>';$('#uploadBtn').disabled=true;return}$('#account').innerHTML='<span class="pill">✓ '+session.user.email+'</span>'})();
function mimeFor(path){if(path.endsWith('.json'))return 'application/json';if(path.endsWith('.webp'))return 'image/webp';if(path.endsWith('.png'))return 'image/png';return 'application/octet-stream'}
async function uploadOne(path,bytes){const mime=mimeFor(path);const payload=new Blob([bytes],{type:mime});const {error}=await sb.storage.from(BUCKET).upload(path,payload,{contentType:mime,upsert:false,cacheControl:'3600'});if(error){const m=String(error.message||error);if(/exist|duplicate|resource already/i.test(m))return 'skip';throw error}return 'ok'}
$('#uploadBtn').onclick=async()=>{const file=$('#zipFile').files[0];if(!file){alert('Elegí el ZIP P2.4.');return}if(!session){alert('Ingresá primero al Portal.');return}$('#uploadBtn').disabled=true;$('#bar').style.width='0%';$('#log').textContent='Leyendo ZIP…';$('#status').textContent='';try{const zip=await JSZip.loadAsync(file);const entries=Object.values(zip.files).filter(x=>!x.dir&&x.name.startsWith('v2.4/')&&(x.name.endsWith('.webp')||x.name.endsWith('.json')));if(entries.length!==401)throw new Error('El ZIP debe contener 401 archivos útiles (400 WebP + library.json). Encontré '+entries.length+'.');log('✓ Estructura correcta: '+entries.length+' archivos.');log('✓ MIME corregido: WebP → image/webp · JSON → application/json');let done=0,ok=0,skip=0,fail=0;const queue=[...entries];const workers=Array.from({length:4},async()=>{while(queue.length){const e=queue.shift();try{const bytes=await e.async('uint8array');const r=await uploadOne(e.name,bytes);r==='skip'?skip++:ok++;}catch(err){fail++;log('ERROR '+e.name+' · '+(err.message||err));}done++;$('#bar').style.width=(done/entries.length*100).toFixed(1)+'%';$('#status').textContent=`${done}/${entries.length} · nuevos ${ok} · existentes ${skip} · errores ${fail}`;if(done%20===0)log('Progreso '+done+'/'+entries.length);}});await Promise.all(workers);if(fail)throw new Error('La carga terminó con '+fail+' errores. Podés volver a ejecutarla; los archivos ya cargados se omiten.');const test=U+'/storage/v1/object/public/'+BUCKET+'/v2.4/library.json?v='+Date.now();const rr=await fetch(test);if(!rr.ok)throw new Error('Se cargaron los archivos pero no pude verificar library.json.');const lib=await rr.json();if(lib?.stats?.characters!==50)throw new Error('library.json no informa 50 personajes.');$('#status').innerHTML='<span class="ok">✓ CARGA COMPLETA · 50 PERSONAJES · 400 ASSETS</span>';log('✓ library.json verificado.');log('✓ P2.4 lista para QA online.');}catch(e){$('#status').innerHTML='<span class="bad">'+String(e.message||e)+'</span>';log('FALLO: '+String(e.message||e));}finally{$('#uploadBtn').disabled=false}};
</script></body></html>
