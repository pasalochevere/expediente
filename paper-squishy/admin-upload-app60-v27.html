function log(t){$('log').textContent+='\n'+t;$('log').scrollTop=$('log').scrollHeight}function ready(){$('upload').disabled=busy||!admin||!$('file').files[0]}function progress(n,total){$('bar').style.width=Math.round(100*n/total)+'%'}
function paint(session){const email=String(session?.user?.email||'').toLowerCase();admin=email===ADMIN;$('session').innerHTML=admin?'<span class="ok">✓ '+email+' · sesión administradora activa</span>':'<span class="bad">No detecté la sesión administradora.</span>';$('sessionHint').textContent=admin?'Ya podés publicar los assets.':'Abrí el Portal, iniciá sesión y luego tocá REVISAR SESIÓN.';ready()}

async function worker(queue,state,total){while(queue.length){const item=queue.shift();const bytes=await item.entry.async('uint8array');const webp=new Blob([bytes],{type:'image/webp'});const {error}=await sb.storage.from(BUCKET).upload(item.path,webp,{upsert:true,contentType:'image/webp',cacheControl:'3600'});if(error)throw new Error(item.path+': '+error.message);state.done++;progress(state.done,total);if(state.done%10===0||state.done===total)log('Subidos '+state.done+' / '+total)}}
$('upload').onclick=async()=>{if(busy)return;busy=true;ready();$('log').textContent='Inicio…';$('status').textContent='';progress(0,1);try{await check();if(!admin)throw new Error('Sesión administradora requerida.');const f=$('file').files[0];if(!f)throw new Error('Seleccioná el ZIP.');if(f.size!==EXPECT.size)throw new Error('Tamaño incorrecto: '+f.size+' bytes. Esperado: '+EXPECT.size+'.');log('Calculando SHA-256…');const sha=hex(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()));if(sha!==EXPECT.sha)throw new Error('SHA-256 incorrecto. Seleccionaste otro ZIP.');log('✓ ZIP correcto');log('Abriendo paquete…');const zip=await JSZip.loadAsync(f);const queue=[];zip.forEach((name,entry)=>{if(!entry.dir&&name.startsWith('v2.7/')&&name.endsWith('.webp'))queue.push({path:name,entry})});if(queue.length!==EXPECT.files)throw new Error('Cantidad de assets incorrecta: '+queue.length+'. Esperado: '+EXPECT.files+'.');log('✓ 290 assets detectados');log('Subiendo en paralelo…');const state={done:0},total=queue.length;await Promise.all([worker(queue,state,total),worker(queue,state,total),worker(queue,state,total),worker(queue,state,total)]);log('Verificando Ocean Buddies…');const {data,error}=await sb.storage.from(BUCKET).list('v2.7/ocean_buddies/ollie',{limit:20});if(error)throw error;if((data||[]).filter(x=>x.name.endsWith('.webp')).length<9)throw new Error('No pude verificar los 9 assets de Ollie.');$('status').innerHTML='<span class="ok">✓ ASSETS APP 60 · V2.7 PUBLICADOS</span>';log('✓ Verificación final OK');}catch(e){$('status').innerHTML='<span class="bad">'+String(e.message||e)+'</span>';log('FALLO: '+String(e.message||e))}finally{busy=false;ready()}};
