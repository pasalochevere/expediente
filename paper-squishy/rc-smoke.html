<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAPER SQUISHY FACTORY · RC Smoke 0.1A</title><style>:root{--bg:#fff8ee;--ink:#35251f;--ok:#218754;--bad:#b63131;--warn:#a66b00;--line:#eadbcf;--yellow:#ffd45b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:940px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 14px 38px rgba(60,40,28,.08)}h1{margin:5px 0 8px;font-size:34px}.ey{font-size:11px;font-weight:900;letter-spacing:.15em;color:#ff7466}.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.warn{color:var(--warn);font-weight:900}.muted{color:#7b6d65}.btn{display:inline-block;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:900;text-decoration:none;border-radius:14px;padding:11px 15px;margin-right:8px}.btn.primary{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}pre{white-space:pre-wrap;background:#181411;color:#f6eee8;padding:16px;border-radius:16px;max-height:260px;overflow:auto}.big{font-size:22px;font-weight:950}#frame{position:fixed;left:-99999px;top:0;width:1280px;height:900px;border:0;visibility:hidden}</style></head><body><div class="wrap"><div class="card"><div class="ey">PSQ-AUDIT 0.1A · CURRENT BASELINE</div><h1>PAPER SQUISHY FACTORY</h1><div class="muted">Smoke técnico actual: 60 personajes · 6 colecciones · 9 vistas por personaje = 540 assets esperados.</div></div><div class="card"><div id="summary" class="big">Ejecutando controles…</div><div id="checks"></div></div><div class="card"><a class="btn primary" href="./factory.html">ABRIR FACTORY</a><a class="btn" href="./psq-audit-01.html">AUDITORÍA COMPLETA</a><button class="btn" onclick="location.reload()">REPETIR QA</button></div><div class="card"><b>Registro</b><pre id="log">Inicio RC 0.1A…</pre></div></div><iframe id="frame" title="PSQ smoke sandbox"></iframe><script>
let pass=0,fail=0,warn=0;const checks=document.getElementById('checks'),logEl=document.getElementById('log'),sleep=ms=>new Promise(r=>setTimeout(r,ms));function log(x){logEl.textContent+='\n'+x}function add(name,state,detail=''){if(state==='PASS')pass++;else if(state==='FAIL')fail++;else warn++;const cls=state==='PASS'?'ok':state==='FAIL'?'bad':'warn';checks.insertAdjacentHTML('beforeend','<div class="row"><div><b>'+name+'</b><div class="muted">'+detail+'</div></div><div class="'+cls+'">'+state+'</div></div>');log(state+' · '+name+(detail?' · '+detail:''))}async function waitFor(fn,ms=20000){const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch{}await sleep(250)}return null}
(async()=>{try{const r=await fetch('./factory.html?t='+Date.now(),{cache:'no-store'}),t=await r.text();add('Loader comercial',r.ok?'PASS':'FAIL','HTTP '+r.status);add('Baseline 60 / 6',t.includes('60 personajes · 6 colecciones')?'PASS':'FAIL','Factory declara 60 personajes y 6 colecciones.');add('Sin cm no calibrados',!/Mini · 8 cm|Normal · 12 cm|XL · 17 cm/.test(t)?'PASS':'FAIL','No debe haber tamaños comerciales en centímetros.');add('Baseline runtime 2.9.8',t.includes('psq-baseline-v298.js')?'PASS':'FAIL','Hotfix baseline enlazado desde factory.html.')}catch(e){add('Factory source','FAIL',String(e.message||e))}
try{const r=await fetch('./psq-baseline-v298.js?t='+Date.now(),{cache:'no-store'}),t=await r.text();add('Traducción · Seis mundos',t.includes('Six worlds to create')?'PASS':'FAIL','Entrada EN actual.');add('Traducción · XL sin cm',t.includes('XL: front and back print')?'PASS':'FAIL','Texto EN actualizado sin centímetros.');add('Popup impresión bloqueado',t.includes('blocked the print window')&&t.includes('bloqueó la ventana de impresión')?'PASS':'FAIL','Aviso ES/EN disponible.');add('Descargas actuales',t.includes('downloads-v298.html')?'PASS':'FAIL','Links de descargas pasan por wrapper actual.')}catch(e){add('Baseline source','FAIL',String(e.message||e))}
try{const r=await fetch('./downloads-v298.html?t='+Date.now(),{cache:'no-store'});add('Wrapper de descargas',r.ok?'PASS':'FAIL','HTTP '+r.status)}catch(e){add('Wrapper de descargas','FAIL',String(e.message||e))}
const frame=document.getElementById('frame');frame.src='./factory.html?rc=01a&t='+Date.now();const win=await waitFor(()=>frame.contentWindow&&frame.contentWindow.document?.body&&frame.contentWindow);if(!win){add('Factory runtime','FAIL','No se obtuvo DOM.')}else{const path=win.location.pathname;if(path.includes('/portal-v2/'))add('Sesión QA','WARN','Sin sesión PSQ activa: el runtime profundo requiere entrar por Portal.');else{add('Factory runtime','PASS',path);const lib=await waitFor(()=>win.PS_LIBRARY&&Array.isArray(win.PS_LIBRARY.characters)&&win.PS_LIBRARY,18000);if(lib){const chars=lib.characters||[],cols=lib.collections||[],keys=['hero','front_print','back_print','coloring','coloring_back','editor_asset','character_card','tutorial','mockup'];let assets=0,missing=0;for(const ch of chars)for(const k of keys){if(ch?.assets?.[k]?.path)assets++;else missing++}add('6 colecciones runtime',cols.length===6?'PASS':'FAIL','Detectadas: '+cols.length);add('60 personajes runtime',chars.length===60?'PASS':'FAIL','Detectados: '+chars.length);add('540 vistas runtime',assets===540&&missing===0?'PASS':'FAIL','Rutas válidas: '+assets+' · faltantes: '+missing);await sleep(1200);add('Baseline runtime activo',win.PSQ_BASELINE_V298?.active?'PASS':'WARN',win.PSQ_BASELINE_V298?.active?'PSQ_BASELINE_V298 activo':'No expuso bandera todavía.')}else add('PS_LIBRARY','FAIL','No cargó la biblioteca actual.')}}
document.getElementById('summary').innerHTML=fail===0?'<span class="ok">RC 0.1A: PASS</span> · '+pass+' controles OK'+(warn?' · '+warn+' aviso(s)':''):'<span class="bad">RC 0.1A: FAIL</span> · '+fail+' error(es)';})();
</script></body></html>
