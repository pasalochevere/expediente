<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040c">
<title>PasaloChévere · Fábrica de Squishies</title>
<style>
:root{--pink:#ff6eb9;--gold:#ffd36f;--ink:#fff8fc;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050309;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit}.app{position:fixed;inset:0;overflow:hidden;background:#050309;isolation:isolate}.stage{position:absolute;inset:0}.scene{position:absolute;inset:-2.5%;opacity:0;background-size:cover;background-position:center;transform:scale(1.095);filter:brightness(.76) saturate(1.05);transition:opacity 1.15s ease,transform 5.4s var(--ease),filter 1.15s ease;will-change:opacity,transform}.scene.active{opacity:1;transform:scale(1.01);filter:brightness(.96) saturate(1.08)}.scene.out{opacity:0;transform:scale(1.045)}
.vignette,.shade,.glow,.grain,.sparks{position:absolute;inset:0;pointer-events:none}.vignette{z-index:2;background:radial-gradient(circle at 50% 46%,transparent 22%,rgba(0,0,0,.08) 48%,rgba(0,0,0,.58) 100%)}.shade{z-index:2;background:linear-gradient(to bottom,rgba(2,1,6,.36),transparent 30%,transparent 56%,rgba(3,1,7,.78) 100%)}.glow{z-index:2;background:radial-gradient(circle at 50% 72%,rgba(255,191,90,.12),transparent 31%),radial-gradient(circle at 50% 44%,rgba(255,100,186,.055),transparent 42%);mix-blend-mode:screen}.grain{z-index:2;opacity:.055;background-image:radial-gradient(rgba(255,255,255,.72) .7px,transparent .7px),radial-gradient(rgba(255,255,255,.38) .55px,transparent .55px);background-size:25px 25px,33px 33px;background-position:0 0,17px 14px;animation:grain 8s linear infinite}@keyframes grain{50%{transform:translate3d(-1%,1%,0)}}
.spark{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe9a7 38%,rgba(255,202,100,0) 75%);opacity:0;animation:rise linear infinite}@keyframes rise{0%{transform:translateY(32px) scale(.45);opacity:0}16%{opacity:.76}75%{opacity:.4}100%{transform:translateY(-110px) scale(1.35);opacity:0}}
.skip,.soundless{position:absolute;top:max(16px,env(safe-area-inset-top));z-index:7;border:1px solid rgba(255,255,255,.18);color:white;background:rgba(10,6,16,.26);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);border-radius:999px;padding:10px 14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.16)}.skip{right:16px}.soundless{left:16px;pointer-events:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.copy{position:absolute;left:clamp(18px,5vw,72px);right:clamp(18px,5vw,72px);bottom:clamp(72px,12vh,140px);z-index:5;max-width:850px;text-shadow:0 4px 24px rgba(0,0,0,.55)}.eyebrow,.title,.sub{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .9s var(--ease)}.copy.on .eyebrow,.copy.on .title,.copy.on .sub{opacity:1;transform:none}.copy.on .title{transition-delay:.06s}.copy.on .sub{transition-delay:.15s}.eyebrow{display:inline-block;padding:8px 12px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(8,4,12,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.78)}.title{margin:12px 0 10px;font-size:clamp(2.15rem,5vw,5rem);line-height:.94;letter-spacing:-.048em;font-weight:900;max-width:13.5ch}.sub{margin:0;max-width:60ch;font-size:clamp(.98rem,1.55vw,1.23rem);line-height:1.55;color:rgba(255,255,255,.78)}
.progress{position:absolute;z-index:6;left:clamp(18px,5vw,72px);right:clamp(18px,5vw,72px);bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.seg{height:4px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.13)}.seg i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold));box-shadow:0 0 15px rgba(255,120,193,.48)}
.loader{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#050309;transition:opacity .5s ease}.loader.hide{opacity:0;pointer-events:none}.loaderbox{text-align:center}.loaderlogo{font-weight:900;font-size:clamp(1.35rem,4vw,2.3rem);letter-spacing:-.03em}.loadertext{margin-top:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62)}.pulse{width:52px;height:3px;margin:18px auto 0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold));animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scaleX(.45);opacity:.55}}
.final{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at center,rgba(5,2,9,.03),rgba(4,2,8,.32) 55%,rgba(4,2,8,.78));opacity:0;pointer-events:none;transition:opacity .8s ease}.final.show{opacity:1;pointer-events:auto}.finalbox{text-align:center;max-width:760px;padding:26px 24px 24px;border:1px solid rgba(255,255,255,.17);background:linear-gradient(180deg,rgba(20,10,27,.35),rgba(10,5,15,.24));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;box-shadow:0 22px 80px rgba(0,0,0,.3)}.finalbox .tiny{font-size:12px;letter-spacing:.19em;text-transform:uppercase;color:rgba(255,255,255,.74)}.finalbox h1{margin:8px 0 10px;font-size:clamp(2.25rem,5.4vw,5.2rem);line-height:.9;letter-spacing:-.05em}.finalbox p{margin:0 auto 19px;max-width:44ch;color:rgba(255,255,255,.8);font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.55}.enter{border:0;border-radius:999px;padding:15px 22px;font-weight:900;cursor:pointer;color:#28101e;background:linear-gradient(135deg,var(--pink),#ff9d70 58%,var(--gold));box-shadow:0 18px 46px rgba(255,110,185,.34);transition:transform .2s ease,box-shadow .2s ease}.enter:hover{transform:translateY(-2px);box-shadow:0 22px 55px rgba(255,110,185,.42)}
@media(max-width:720px){.scene{inset:-1.5%;background-position:center center}.skip{right:12px}.soundless{left:12px}.copy{left:18px;right:18px;bottom:105px}.title{font-size:clamp(2.1rem,10.8vw,3.7rem);max-width:12ch}.sub{font-size:.98rem;max-width:38ch}.progress{left:18px;right:18px;gap:5px}.soundless{display:none}.finalbox{padding:22px 18px;border-radius:24px}}
@media(orientation:portrait){.scene{background-position:center center}}
@media(prefers-reduced-motion:reduce){.scene,.eyebrow,.title,.sub,.final{transition:none!important}.grain,.spark{animation:none!important}}
</style>
</head>
<body>
<!-- P3.0 CINEMA ENGINE SQUISHY · production 2026-09-22 -->
<main class="app" id="app">
  <div class="loader" id="loader"><div class="loaderbox"><div class="loaderlogo">PasaloChévere</div><div class="loadertext">Encendiendo la Fábrica de Squishies…</div><div class="pulse"></div></div></div>
  <div class="stage" id="stage"></div>
  <div class="vignette"></div><div class="shade"></div><div class="glow"></div><div class="grain"></div><div class="sparks" id="sparks"></div>
  <div class="soundless">Cinema Engine · Squishy</div>
  <button class="skip" id="skip">Saltar intro</button>
  <section class="copy" id="copy"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><p class="sub" id="sub"></p></section>
  <div class="progress" id="progress"></div>
  <section class="final" id="final"><div class="finalbox"><div class="tiny">PasaloChévere presenta</div><h1>Fábrica de Squishies</h1><p>Tu imaginación. Tu diseño. Tu squishy.</p><button class="enter" id="enter">ENTRAR A LA FÁBRICA →</button></div></section>
</main>
<script>
const scenes=[
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/ea17913d-564b-439d-bae8-812ead78c441.png','La fábrica despierta','Todo comienza con una chispa.','El taller duerme en silencio… hasta que una línea de luz toca el papel y despierta la imaginación.',4300],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/7e49bcd0-31d8-4554-90c4-05bef381a5bf.png','El primer trazo','La idea encuentra su forma.','Papel, color y magia empiezan a construir algo que todavía no existía.',4200],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/84e652ea-e9d7-4b51-9f91-f40edf9e9ee8.png','El taller cobra vida','Miles de ideas empiezan a moverse.','Bocetos, cintas, estrellas y personajes aparecen por todas partes.',4300],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/4446cbd1-4e22-45be-9194-e2df489bc644.png','La transformación','Del dibujo… al squishy.','La idea deja de ser plana. Se infla, sonríe y cobra vida frente a tus ojos.',4600],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/c3387ea8-4b99-492f-8a9d-e7d274eca8da.png','La gran revelación','Bienvenido a la Fábrica de Squishies.','Una fábrica hecha de imaginación, papel, color y personajes que esperan ser creados.',5100],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/9b719a80-dff5-4742-b341-3c1193294f07.png','Explosión creativa','Un universo infinito de diseños.','Comida, animales, fantasía y nuevas colecciones: cada idea puede convertirse en un nuevo squishy.',4600],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/66ad6552-e741-4f37-80a8-1aefd787384e.png','El origen','Todo vuelve al papel.','Porque antes de cada personaje hubo una idea, una hoja en blanco y ganas de crear.',4100],
['https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/ee39654b-c3d4-4d7b-a9e4-6d96cdb56ecf.png','PasaloChévere','Tu imaginación. Tu diseño. Tu squishy.','La fábrica ya está lista. Ahora te toca crear.',5400]
];
const stage=document.getElementById('stage'),copy=document.getElementById('copy'),ey=document.getElementById('eyebrow'),ti=document.getElementById('title'),su=document.getElementById('sub'),prog=document.getElementById('progress'),final=document.getElementById('final');
let idx=0,timer=null,raf=null,start=0,ended=false;
const els=scenes.map((s,i)=>{const d=document.createElement('div');d.className='scene';d.style.backgroundImage=`url("${s[0]}")`;stage.appendChild(d);const p=document.createElement('div');p.className='seg';const fill=document.createElement('i');p.appendChild(fill);prog.appendChild(p);return {d,fill}});
function sparks(){const box=document.getElementById('sparks');for(let i=0;i<24;i++){const e=document.createElement('i');e.className='spark';const z=3+Math.random()*5;e.style.cssText=`left:${Math.random()*100}%;top:${45+Math.random()*50}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*7}s;animation-duration:${5+Math.random()*7}s`;box.appendChild(e)}}
function text(s){copy.classList.remove('on');void copy.offsetWidth;ey.textContent=s[1];ti.textContent=s[2];su.textContent=s[3];copy.classList.add('on')}
function show(i){idx=i;ended=false;final.classList.remove('show');els.forEach((x,n)=>{x.d.classList.toggle('active',n===i);x.d.classList.toggle('out',n<i);x.fill.style.width=n<i?'100%':'0%'});text(scenes[i]);start=performance.now();progress();clearTimeout(timer);timer=setTimeout(next,scenes[i][4])}
function progress(){cancelAnimationFrame(raf);const dur=scenes[idx][4],fill=els[idx].fill,base=start;function tick(now){if(ended)return;fill.style.width=Math.min(100,((now-base)/dur)*100)+'%';raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
function next(){if(idx<scenes.length-1)show(idx+1);else finish()}
function finish(){ended=true;clearTimeout(timer);cancelAnimationFrame(raf);els[7].fill.style.width='100%';copy.classList.remove('on');final.classList.add('show')}
function factoryURL(){const u=new URL('./factory.html',location.href);const q=new URLSearchParams(location.search);q.delete('intro');q.delete('v');q.forEach((v,k)=>u.searchParams.append(k,v));u.searchParams.set('v','2422');return u.href}
function enter(){location.href=factoryURL()}
document.getElementById('skip').onclick=enter;document.getElementById('enter').onclick=enter;
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')enter();if(e.key==='ArrowRight')next()});
let sx=0;document.getElementById('app').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('app').addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-sx<-65)next()},{passive:true});
sparks();
function preload(src){return new Promise((resolve,reject)=>{const im=new Image();im.decoding='async';im.onload=()=>resolve(src);im.onerror=reject;im.src=src})}
(async()=>{
  try{
    await preload(scenes[0][0]);
    document.getElementById('loader').classList.add('hide');
    show(0);
    scenes.slice(1).forEach(s=>preload(s[0]).catch(()=>{}));
  }catch(e){
    document.querySelector('.loadertext').textContent='La fábrica está lista para entrar';
    setTimeout(enter,900);
  }
})();
</script>
</body>
</html>
