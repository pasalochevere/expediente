<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP3.0B · Creator Plus · Prueba</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#fff9ef;color:#34251f}.box{max-width:600px;padding:20px;text-align:center}.spin{display:block;margin:20px auto;border:4px solid #efd8e2;border-top-color:#e7789e;border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#error{color:#a33745}</style></head><body><div class="box"><h1>Creator Plus · CP3.0B</h1><p>Abriendo la prueba de presets con personajes originales…</p><span class="spin"></span><p id="error"></p></div><script>
(async()=>{
  try{
    // Approved shell freezes/verifies the same core as the published Factory.
    const frozen='https://cdn.jsdelivr.net/gh/pasalochevere/expediente@e7f545d189846a48d14e1d3ce6e0c5c21b9b0e13/paper-squishy/factory.html';
    const response=await fetch(frozen,{cache:'no-store'});
    if(!response.ok)throw new Error('No pude obtener el master congelado.');
    let shell=await response.text();
    const marker='document.open();document.write(html);document.close();';
    if(!shell.includes(marker))throw new Error('La Factory maestra cambió su sistema de carga.');
    const addon=`
      // Test-only patch. The master HTML and the licensing check remain untouched.
      const cpResponse=await fetch('./psq-cp30b-patch.js?v=301',{cache:'no-store'});
      if(!cpResponse.ok)throw new Error('No se pudo cargar CP3.0B.');
      const cpSource=await cpResponse.text();
      const cpAnchor="renderHome();renderCollections();show('home');\\n})();";
      if(!html.includes(cpAnchor))throw new Error('No se encontró la integración del editor original.');
      html=html.replace(cpAnchor,cpSource+'\\n'+cpAnchor);
      html=html.replace('psq-catalog-v27.js?v=2711','psq-catalog-v27.js?v=2981');
      html=html.replace('Mini · 8 cm','Mini').replaceAll('Normal · 12 cm','Normal').replaceAll('XL · 17 cm','XL');
      html=html.replace('</body>','<script src="./psq-baseline-v298.js?v=2981"><\\/script></body>');
    `;
    shell=shell.replace(marker,addon+'\n  '+marker);
    document.open();document.write(shell);document.close();
  }catch(e){document.querySelector('.spin').style.display='none';document.querySelector('#error').textContent='No se pudo abrir la prueba: '+String(e.message||e)}
})();
</script></body></html>
