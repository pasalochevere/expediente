<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Torre 5 en 1 · Intro Prototype V2 · Corregido</title>
<style>
  :root{
    --bg:#0f0d09;
    --gold:#f5c34d;
    --teal:#15b5a7;
    --white:#ffffff;
    --shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  .app{position:relative;width:100vw;height:100vh;background:#000}
  .scene{
    position:absolute;inset:0;opacity:0;pointer-events:none;
    background-size:cover;background-position:center center;
    transition:opacity 1.2s ease;
    transform:scale(1.04);
  }
  .scene.active{opacity:1}
  .scene::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,210,120,.18), transparent 30%),
      linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.05) 35%, rgba(0,0,0,.35));
    mix-blend-mode:normal;
  }
  .kenburns-slow{animation:kenburnsSlow 10s ease-in-out infinite alternate}
  .kenburns-mid{animation:kenburnsMid 7s ease-in-out infinite alternate}
  .kenburns-fast{animation:kenburnsFast 6s ease-in-out infinite alternate}
  @keyframes kenburnsSlow{from{transform:scale(1.03) translate3d(0,0,0)}to{transform:scale(1.10) translate3d(1.5%,-1.5%,0)}}
  @keyframes kenburnsMid{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.2%,1.2%,0)}}
  @keyframes kenburnsFast{from{transform:scale(1.05) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(1.5%,.6%,0)}}
  .grain,.vignette,.glow,.lightSweep{position:absolute;inset:0;pointer-events:none}
  .grain{opacity:.10;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity=".7"/></svg>');mix-blend-mode:soft-light}
  .vignette{background:radial-gradient(circle at center, transparent 45%, rgba(0,0,0,.22) 70%, rgba(0,0,0,.6) 100%)}
  .glow{background:radial-gradient(circle at 50% 18%, rgba(255,210,130,.15), transparent 35%)}
  .lightSweep{opacity:0;background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.18) 50%, transparent 62%);transform:translateX(-120%)}
  .lightSweep.play{animation:sweep 1.8s ease}
  @keyframes sweep{0%{opacity:0;transform:translateX(-120%)}15%{opacity:1}100%{opacity:0;transform:translateX(140%)}}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(18px,4vw,44px);z-index:5}
  .titleBlock{max-width:min(90vw,820px);margin-bottom:8vh;opacity:0;transform:translateY(20px);transition:all .8s ease}
  .titleBlock.show{opacity:1;transform:translateY(0)}
  .eyebrow{display:inline-block;font-weight:700;font-size:clamp(12px,2vw,18px);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;text-shadow:var(--shadow)}
  .headline{font-weight:900;line-height:.96;letter-spacing:-.03em;font-size:clamp(34px,8vw,88px);text-shadow:0 8px 30px rgba(0,0,0,.5)}
  .headline .accent{color:var(--gold)}
  .sub{margin-top:12px;font-size:clamp(16px,2.4vw,28px);font-weight:500;color:rgba(255,255,255,.96);text-shadow:0 4px 20px rgba(0,0,0,.42)}
  .mini{font-size:clamp(14px,2vw,20px);font-weight:600;color:#fff;opacity:.95}
  .centerBlock{position:absolute;inset:0;display:grid;place-items:center;z-index:6;text-align:center;padding:8vw;pointer-events:none}
  .centerCard{opacity:0;transform:scale(.96) translateY(10px);transition:all .8s ease;max-width:min(90vw,900px)}
  .centerCard.show{opacity:1;transform:scale(1) translateY(0)}
  .heroTitle{font-size:clamp(42px,11vw,120px);font-weight:900;line-height:.92;letter-spacing:-.04em;text-shadow:0 12px 32px rgba(0,0,0,.58)}
  .heroTitle .small{display:block;font-size:clamp(22px,5vw,54px);margin-top:8px;color:var(--teal)}
  .claim{margin-top:18px;font-size:clamp(18px,2.7vw,34px);font-weight:600;text-shadow:0 6px 24px rgba(0,0,0,.58)}
  .accentLine{width:min(56vw,420px);height:5px;border-radius:999px;margin:18px auto 0;background:linear-gradient(90deg,var(--gold),var(--teal));box-shadow:0 0 24px rgba(245,195,77,.55)}
  .logoDot{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:20;width:44px;height:44px;border-radius:50%;background:#111;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:10px;font-weight:800;line-height:1.05;text-align:center;box-shadow:var(--shadow)}

  .controls{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;z-index:25}
  .btn{appearance:none;border:none;border-radius:999px;padding:10px 14px;background:rgba(10,10,12,.64);color:#fff;font-weight:700;font-size:14px;backdrop-filter:blur(10px);box-shadow:var(--shadow);cursor:pointer}
  .btn:hover{background:rgba(20,20,22,.78)}
  .progressWrap{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:0 0 max(10px, env(safe-area-inset-bottom)) 0}
  .progressBg{height:5px;background:rgba(255,255,255,.16)}
  .progress{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));box-shadow:0 0 16px rgba(21,181,167,.5)}
  .footerHint{position:absolute;left:20px;bottom:max(18px, calc(env(safe-area-inset-bottom) + 12px));z-index:10;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62)}

  .endScreen{
    position:absolute; inset:0; z-index:50; display:none; place-items:center;
    background:linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.35)); backdrop-filter:blur(6px);
    text-align:center; padding:24px;
  }
  .endScreen.show{display:grid}
  .endCard{max-width:840px}
  .endTitle{font-size:clamp(32px,8vw,90px);font-weight:900;line-height:.95;letter-spacing:-.04em}
  .endSub{margin:14px auto 26px;font-size:clamp(18px,2.7vw,30px);opacity:.95}
  .ctaRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .cta{border:none;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
  .cta.primary{background:linear-gradient(90deg,var(--gold),#ffd866);color:#111}
  .cta.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}

  @media (orientation:landscape) {
    .overlay{justify-content:flex-end;padding:28px 36px 28px 36px}
    .titleBlock{max-width:min(52vw,760px);margin-bottom:6vh}
    .footerHint{font-size:11px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="logoDot">PASALO<br>CHEVERE</div>

  <div class="scene kenburns-slow" id="scene1" style="background-image:url('https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/133f2d53-0a2e-4ee5-ac91-1fa6b74b60b1.png')"></div>
  <div class="scene kenburns-fast" id="scene2" style="background-image:url('https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/d26da14d-d428-4b9a-9cb0-8aef5b93d757.png')"></div>
  <div class="scene kenburns-mid" id="scene3" style="background-image:url('https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/bcb46ec5-29ce-4c73-976e-fa05a6d5a023.png')"></div>
  <div class="scene kenburns-slow" id="scene4" style="background-image:url('https://d2ol7oe51mr4n9.cloudfront.net/user_3HsxoUqhL2jq6HZbpDZ6JgCwUeq/1081a9f9-6568-40c2-869a-2e4250e8c569.png')"></div>

  <div class="grain"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
  <div class="lightSweep" id="lightSweep"></div>

  <div class="overlay">
    <div class="titleBlock" id="lowerText">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="headline" id="headline"></div>
      <div class="sub" id="subline"></div>
    </div>
  </div>

  <div class="centerBlock">
    <div class="centerCard" id="centerCard">
      <div class="heroTitle" id="heroTitle"></div>
      <div class="claim" id="heroClaim"></div>
      <div class="accentLine"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="skipBtn">Saltar intro</button>
    <button class="btn" id="fsBtn">Pantalla completa</button>
  </div>

  <div class="footerHint">Intro Prototype V2 · Torre 5 en 1 · CORREGIDO</div>
  <div class="progressWrap"><div class="progressBg"><div class="progress" id="progress"></div></div></div>

  <div class="endScreen" id="endScreen">
    <div class="endCard">
      <div class="endTitle">TORRE 5 EN 1<br><span style="color:var(--teal)">+ DIGITAL</span></div>
      <div class="endSub">Un mismo juego, distintos momentos.</div>
      <div class="ctaRow">
        <button class="cta primary" id="enterBtn">JUGAR</button>
        <button class="cta secondary" id="replayBtn">REPETIR INTRO</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const TOTAL = 36000;
  const scenes = [
    {start:0,end:7000, id:'scene1', sweep:true, lower:{eyebrow:'MOMENTO', headline:'Más que un juego…', sub:'una experiencia para compartir.'}},
    {start:7000,end:14500, id:'scene2', lower:{eyebrow:'TENSIÓN', headline:'Cada bloque importa.', sub:'cada partida se siente distinta.'}},
    {start:14500,end:23500, id:'scene3', lower:{eyebrow:'DIGITAL', headline:'Físico + <span class="accent">portal</span>', sub:'jugá desde la torre, el celular o la compu.'}},
    {start:23500,end:32500, id:'scene4', center:{title:'TORRE<br>5 EN 1 <span class="small">+ DIGITAL</span>', claim:'Un mismo juego, distintos momentos.'}, sweep:true},
    {start:32500,end:36000, id:'scene4', end:true}
  ];

  const sceneEls = Object.fromEntries(['scene1','scene2','scene3','scene4'].map(id => [id, document.getElementById(id)]));
  const lowerText = document.getElementById('lowerText');
  const eyebrow = document.getElementById('eyebrow');
  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');
  const centerCard = document.getElementById('centerCard');
  const heroTitle = document.getElementById('heroTitle');
  const heroClaim = document.getElementById('heroClaim');
  const progress = document.getElementById('progress');
  const lightSweep = document.getElementById('lightSweep');
  const endScreen = document.getElementById('endScreen');
  const skipBtn = document.getElementById('skipBtn');
  const fsBtn = document.getElementById('fsBtn');
  const replayBtn = document.getElementById('replayBtn');
  const enterBtn = document.getElementById('enterBtn');

  let startTime = null;
  let raf = null;
  let finished = false;

  function setActiveScene(id){
    Object.values(sceneEls).forEach(el => el.classList.remove('active'));
    sceneEls[id].classList.add('active');
  }

  function hideText(){
    lowerText.classList.remove('show');
    centerCard.classList.remove('show');
  }

  let currentIndex = -1;
  function applySceneConfig(cfg){
    setActiveScene(cfg.id);
    hideText();
    if(cfg.sweep){
      lightSweep.classList.remove('play');
      void lightSweep.offsetWidth;
      lightSweep.classList.add('play');
    }
    if(cfg.lower){
      eyebrow.textContent = cfg.lower.eyebrow || '';
      headline.innerHTML = cfg.lower.headline || '';
      subline.innerHTML = cfg.lower.sub || '';
      setTimeout(() => lowerText.classList.add('show'), 60);
    } else {
      lowerText.classList.remove('show');
    }
    if(cfg.center){
      heroTitle.innerHTML = cfg.center.title || '';
      heroClaim.textContent = cfg.center.claim || '';
      setTimeout(() => centerCard.classList.add('show'), 80);
    } else {
      centerCard.classList.remove('show');
    }
  }

  function endIntro(){
    finished = true;
    if(raf) cancelAnimationFrame(raf);
    progress.style.width = '100%';
    hideText();
    endScreen.classList.add('show');
  }

  function update(ts){
    if(!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const clamped = Math.min(elapsed, TOTAL);
    progress.style.width = ((clamped/TOTAL)*100).toFixed(2) + '%';

    const index = scenes.findIndex(s => clamped >= s.start && clamped < s.end);
    if(index !== currentIndex && index >= 0){
      currentIndex = index;
      applySceneConfig(scenes[index]);
    }

    if(clamped >= TOTAL){
      endIntro();
      return;
    }
    raf = requestAnimationFrame(update);
  }

  function startIntro(){
    finished = false;
    startTime = null;
    currentIndex = -1;
    endScreen.classList.remove('show');
    progress.style.width = '0%';
    raf = requestAnimationFrame(update);
  }

  function skipIntro(){
    endIntro();
  }

  skipBtn.addEventListener('click', skipIntro);
  replayBtn.addEventListener('click', startIntro);
  enterBtn.addEventListener('click', () => {
    alert('Prototype V2 corregido · Preview de entrada al juego.\n\nSiguiente paso sugerido: conectar este botón al menú real o al portal.');
  });
  fsBtn.addEventListener('click', async () => {
    if(!document.fullscreenElement){
      try { await document.documentElement.requestFullscreen(); }
      catch(e){}
    } else {
      try { await document.exitFullscreen(); }
      catch(e){}
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){ e.preventDefault(); if(finished) startIntro(); else skipIntro(); }
    if(e.key.toLowerCase() === 'f') fsBtn.click();
  });

  startIntro();
})();
</script>
</body>
</html>
