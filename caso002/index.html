<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EXPEDIENTES · Caso 002 · Hotel Orfeo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050608;color:#e8e2d8;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;background:#050608}.box{text-align:center;letter-spacing:.12em}.dot{width:42px;height:42px;border:2px solid #655b50;border-top-color:#d7c5a2;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}button{margin-top:14px;padding:9px 13px;background:#171313;color:#eee;border:1px solid #7d5e55;cursor:pointer}
</style>
</head><body>
<div id="load"><div class="box"><div class="dot"></div><div>ABRIENDO EXPEDIENTE 002…</div></div></div>
<script>
(async()=>{
  try{
    const names=Array.from({length:12},(_,i)=>`cinema.part${String(i+1).padStart(2,'0')}`);
    const parts=[];
    for(const n of names){
      const r=await fetch(n+'?v=20260923-cinema-v3',{cache:'no-store'});
      if(!r.ok) throw new Error('Falta '+n);
      parts.push(await r.text());
    }
    const html=parts.join('');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('load').innerHTML='<div class="box">No pude abrir la intro.<br><button onclick="location.reload()">REINTENTAR</button></div>';
    console.error(e);
  }
})();
</script>
</body></html>
