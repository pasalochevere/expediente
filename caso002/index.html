<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXPEDIENTES · Caso 002 · La Habitación que No Existe</title>
<style>
html,body{margin:0;min-height:100%;background:#090a0b;color:#d8c3a5;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:grid;place-items:center}
#s{text-align:center;padding:28px;letter-spacing:.08em}
#s b{display:block;font-family:Georgia,serif;font-size:clamp(1.5rem,5vw,3rem);margin-bottom:8px}
#s small{color:#9f9180;letter-spacing:.04em}
.spin{width:34px;height:34px;border:2px solid #4f3a27;border-top-color:#c89a55;border-radius:50%;margin:20px auto;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="s"><b>EXPEDIENTES · CASO 002</b><small>LA HABITACIÓN QUE NO EXISTE</small><div class="spin"></div><small>Cargando Hotel Orfeo…</small></div>
<script>
(async()=>{
  const names=['payload.part00a1a.correct','payload.part00a1b','payload.part00a2','payload.part00b','payload.part01','payload.part02','payload.part03','payload.part04','payload.part05'];
  let b64='';
  for(const n of names){
    const r=await fetch(n,{cache:'no-store'});
    if(!r.ok)throw new Error('Falta '+n);
    b64+=(await r.text()).trim();
  }
  const bin=atob(b64),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Tu navegador necesita una versión más reciente.');
  const ds=new DecompressionStream('gzip');
  let html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
  html=html.replace('<script src="rc.js?v=230"></script></body>','<script src="audio.js?v=220"></'+'script><script src="rc.js?v=230"></script></body>');
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById('s').innerHTML='<b>No pude abrir el Caso 002</b><small>'+String(e.message||e)+'</small>';
});
</script>
<script src="rc.js?v=230"></script></body>
</html>
