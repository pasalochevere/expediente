*{box-sizing:border-box}html,body{margin:0}body{background:#0a0e12;color:var(--uit);font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:30;background:rgba(10,14,18,.97);border-bottom:1px solid #2b3540;padding:14px}.tool-inner{max-width:1240px;margin:auto;display:grid;gap:12px}.brand{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand b{letter-spacing:.16em;color:#e7bf6b;font-size:12px}.brand h1{font-family:Georgia,serif;margin:4px 0 0;font-size:28px}.dev{border:1px solid #725b2b;border-radius:999px;padding:7px 10px;color:#f2d17c;font-size:11px}.controls{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}.field{display:grid;gap:5px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--uim);font-weight:800}.field select,.field button,.field input{border:1px solid #34414d;background:#121920;color:#fff;border-radius:9px;padding:9px;font:inherit}.field button{cursor:pointer;font-weight:800}.field button.primary{background:#b78b3c;color:#16120b;border-color:#d7ad61}.field button.good{background:#173523;border-color:#386447;color:#baf0cb}.checks{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#c5cfd5}.checks label{display:flex;gap:6px;align-items:center}.status{border:1px solid #2d3944;background:#111820;border-radius:10px;padding:9px 11px;font-size:12px;color:#b8c4ca}.status.good{border-color:#325f43;color:#a8e4bb}.status.bad{border-color:#6c363b;color:#ffb0b5}.preview{padding:22px 0 60px}.page{position:relative;width:210mm;min-height:297mm;margin:0 auto 18px;background:var(--paper);color:var(--ink);box-shadow:0 12px 38px #0008;overflow:hidden;page-break-after:always}.page-inner{min-height:297mm;padding:12mm;position:relative}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(55,42,26,.025) 0 1px,transparent 1px 4px)}.eco .page{--paper:#fff;--paper2:#f3f3f3;--red:#111;--gold:#333;--muted:#55 opy h3{font-size:18pt;margin:0 0 2mm}.role{font-size:9pt;color:var(--red);font-weight:900;text-transform:uppercase}.quote{margin-top:5mm;font:italic 10.5pt/1.35 Georgia,serif}.scene-grid,.object-grid{display:grid;grid-template-columns:1fr 1fr;gap:7mm}.scene,.object{min-height:70mm;border:1px solid var(--ink);padding:6mm;display:grid;grid-template-columns:24mm 1fr;gap:5mm;align-items:center}.symbol{font-size:30pt;text-align:center;filter:grayscale(.15)}.eco .symbol{filter:grayscale(1)}.scene h3,.object h3{margin:0 0 2mm;font-size:17pt}.code{font:800 8pt ui-monospace,monospace;letter-spacing:.12em;color:var(--red)}.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}.axis{border:1.5px solid var(--ink);min-height:28mm;padding:4mm}.axis b{font-size:9pt;letter-spacing:.12em}.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:6mm}.note-box{border:1px solid var(--line);min-height:43mm;padding:4mm;background:rgba(255,255,255,.2)}.note-box h3{font:900 8pt Arial;letter-spacing:.1em;margin:0 0 3mm}.lines{height:100%;background:repeating-linear-gradient(180deg,transparent 0 8mm,rgba(0,0,0,.18) 8mm 8.25mm)}.timeline{border-top:1px solid var(--ink)}.tlrow{display:grid;grid-template-columns:22mm 1fr 36mm 26mm 40mm;min-height:18mm;border:1px solid var(--line);border-top:0}.tlrow>div{padding:3mm;border-right:1px solid var(--line);font-size:8.5pt}.tlrow>div:last-child{border-right:0}.tlhead{font-weight:900;background:var(--paper2);min-height:auto}.relations{display:grid;grid-template-columns:1fr 1fr;gap:5mm}.rel{border:1px solid var(--line);padding:4mm;min-height:65mm}.rel-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:2mm;margin-bottom:3mm}.rel h3{margin:0;font-size:14pt}.rel-lines{display:grid;grid-template-columns:30mm 1fr;gap:2mm;font-size:8.5pt}.rel-lines b{color:var(--red)}.victim{border:2px solid var(--red);padding:4mm;text-align:center;margin:0 0 6mm;background:rgba(120,20,20,.05)}.acc-fields{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.acc{border:2px solid var(--ink);min-height:35mm;padding:5mm}.acc b{font-size:9pt;letter-spacing:.12em}.bigbox{border:1px solid var(--ink);min-height:82mm;margin-top:6mm;padding:5mm}.signature{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm}.sign{border-top:1px solid var(--ink);padding-top:2mm;text-align:center;font-size:8pt}.evidence-page .page-inner{padding:12mm}.evidence-docs{display:grid;grid-template-rows:1fr 1fr;gap:8mm;height:265mm}.evidence-doc{border:1.5px solid var(--ink);padding:7mm;position:relative;overflow:hidden;background:rgba(255,255,255,.3)}.evidence-doc:after{content:"EVIDENCIA";position:absolute;right:-11mm;bottom:11mm;transform:rotate(-90deg);font-size:8pt;letter-spacing:.25em;color:rgba(100,20,20,.35);font-weight:900}.evtop{display:flex;justify-content:space-between;gap:4mm;border-bottom:1px solid var(--line);padding-bottom:3mm}.evtype{font-size:8pt;font-weight:900;letter-spacing:.12em;color:var(--red)}.evstage{font:8pt ui-monospace,monospace}.evtitle{font-size:19pt;margin:6mm 0}.evtext{font:12pt/1.5 Georgia,serif}.evmeta{position:absolute;left:7mm;right:7mm;bottom:7mm;border-top:1px solid var(--line);padding-top:3mm;font-size:8pt;display:flex;justify-content:space-between}.watermark{position:absolute;inset:auto 8mm 20mm auto;font:900 24pt Georgia,serif;color:rgba(100,20,20,.09);transform:rotate(-8deg)}.hidden{display:none!important}.qa-panel{max-width:1240px;margin:0 auto 14px;border:1px solid #384550;background:#111820;border-radius:10px;padding:10px;font-size:12px;color:#c8d2d8}.qa-panel b{color:#f0d17f}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

<section class="toolbar no-print"><div class="tool-inner"><div class="brand"><div><b>EXPEDIENTES · CASO 001 · P2.11F</b><h1>Generador imprimible P2 V1</h1></div><div class="dev">DESARROLLO · NO PUBLICAR CON PACKS EN CLIENTE</div></div><div class="controls"><div class="field"><label>Versión</label><select id="theme"><option value="color">COLOR</option><option value="eco">ECO / B&N</option></select></div><div class="field"><label>Etapa liberada</label><select id="stage"><option value="1">E1 · Apertura</option><option value="2">E2 · Fractura</option><option value="3">E3 · Pivote</option></select></div><div class="field"><label>Crime Pack</label><select id="pack"><option value="">— sin pack —</option></select></div><div class="field"><label>Canal evidencia</label><select id="channel"><option value="CASEFILE">Expediente público + NPC</option><option value="SANTIAGO">Privada · Santiago</option><option value="CLARA">Privada · Clara</option><option value="VERA">Privada · Vera</option><option value="MATEO">Privada · Mateo</option><option value="INES">Privada · Inés</option><option value="TOMAS">Privada · Tomás</option></select></div><div class="field filebtn"><label>Carga manual</label><button>Cargar JSON local</button><input id="file" type="file" accept=".json,application/json"></div><div class="field"><label>Salida</label><button id="print" class="primary">Imprimir / Guardar PDF</button></div></div><div class="checks"><label><input id="baseOn" type="checkbox" checked> Incluir 8 A4 base</label><label><input id="evidenceOn" type="checkbox" checked> Incluir evidencias</label><span>Humanos:</span><label><input class="human" type="checkbox" value="SANTIAGO" checked> Santiago</label><label><input class="human" type="checkbox" value="CLARA" checked> Clara</label><label><input class="human" type="checkbox" value="VERA" checked> Vera</label><label><input class="human" type="checkbox" value="MATEO"> Mateo</label><label><input class="human" type="checkbox" value="INES"> Inés</label><label><input class="human" type="checkbox" value="TOMAS"> Tomás</label></div><div id="status" class="status">Kit base listo. Cargá un Crime Pack para generar evidencias dinámicas.</div></div></section>
<div id="qa" class="qa-panel no-print"><b>QA P2.11F:</b> <span id="qaText">8 páginas base · sin datos de solución · sin pack cargado.</span></div><main id="app" class="preview"></main>
<script>
const CHARS=[{id:'SANTIAGO',code:'P1',name:'Santiago',role:'Socio · Empresario',quote:'Siempre pienso en el largo plazo.'},{id:'CLARA',code:'P2',name:'Clara',role:'Hermana',quote:'Te conozco mejor que nadie.'},{id:'VERA',code:'P3',name:'Vera',role:'Expareja',quote:'No todo lo nuestro quedó atrás.'},{id:'MATEO',code:'P4',name:'Mateo',role:'Encargado',quote:'Yo solo hago mi trabajo.'},{id:'INES',code:'P5',name:'Inés',role:'Periodista',quote:'Las preguntas correctas cambian todo.'},{id:'TOMAS',code:'P6',name:'Tomás',role:'Amigo',quote:'Contá conmigo.'}];
const LOCS=[['L1','Sala de estar','▣','Sillón, mesa y lámpara'],['L2','Cocina','◫','Mesada, hornallas y vajilla'],['L3','Estudio','▤','Escritorio, papeles y libros'],['L4','Dormitorio','▱','Cama y mesa de luz'],['L5','Jardín / exterior','⌂','Patio o zona exterior'],['L6','Pasillo / acceso','▥','Puerta, hall y corredor']];
const OBJS=[['O1','Arma','†','Elemento agresor o amenaza'],['O2','Cuaderno','▤','Notas y apuntes'],['O3','Celular','▯','Llamadas, mensajes y registros'],['O4','Llave','⚿','Acceso o cerradura'],['O5','Memoria USB','▰','Archivos y copias digitales'],['O6','Pañuelo','≈','Tela, fibra o rastro']];
const TYPE_LABEL={temporal:'REGISTRO TEMPORAL',testimonial:'DECLARACIÓN',physical:'FICHA PERICIAL',digital:'EVIDENCIA DIGITAL',access:'CONTROL DE ACCESO',motivational:'DOCUMENTO CONTEXTUAL'};let currentPack=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function head(label,n){return `<div class="page-head"><div><div class="case">EXPEDIENTES · <span>CASO 001</span></div><div class="eyebrow">${label}</div></div><div class="pageno">${n}</div></div>`}
function basePages(){const p1=`<section class="page base-page"><div class="page-inner">${head('EXPEDIENTE DEL CASO','BASE-01')}<div class="cover-grid"><div class="cover-panel"><div><div class="stamp">ARCHIVO CONFIDENCIAL</div><h1>LA ÚLTIMA<br>REUNIÓN</h1><div class="tagline">La verdad está en la mesa.</div></div><div><div class="eyebrow">LEER EN VOZ ALTA</div><p>Seis personas. Una reunión que debía cerrar viejas cuentas. Una muerte que ninguno esperaba.</p></div></div><div class="story"><div class="eyebrow">APERTURA COMÚN · P2</div><h2>Una reunión que nadie podrá olvidar.</h2><p>Esteban Valdés convocó a seis personas que forman parte de distintos momentos de su vida. Todos aceptaron asistir. Ninguno llegó sin algo que perder.</p><blockquote>“Esta noche vamos a terminar lo que empezamos.”</blockquote><p>La conversación se volvió tensa. Hubo reproches, silencios y movimientos que más tarde nadie describiría de la misma manera.</p><p>Antes de que terminara la noche, <b>Esteban Valdés murió dentro de la propiedad</b>. La explicación no está en una sola pista. Está dispersa entre personas, escenas, objetos, horarios y contradicciones.</p><p><b>Los seis personajes siguen siendo parte del caso, aunque algunos sean controlados por el expediente como NPC.</b></p><div class="rules"><div class="rule"><b>1 · INVESTIGÁ POR ETAPAS.</b><br>E1 abre líneas. E2 fractura coartadas. E3 permite cerrar por cruce.</div><div class="rule"><b>2 · NINGUNA PISTA VALE SOLA.</b><br>Contrastá hechos, testimonios y registros antes de descartar.</div><div class="rule"><b>3 · ACUSACIÓN FINAL.</b><br>Persona + Escena + Objeto + Motivo / hipótesis causal.</div></div></div></div></div></section>`;const people=CHARS.map(c=>`<article class="card"><div class="portrait"><small>${c.code}</small>${c.name.slice(0,1)}</div><div class="card-copy"><div class="role">${c.role}</div><h3>${c.name}</h3><div class="quote">“${c.quote}”</div><p class="muted" style="font-size:9pt">Anotá solo hechos comprobados. La relación con la víctima puede adquirir un significado distinto según el Crime Pack.</p></div></article>`).join('');const p2=`<section class="page base-page"><div class="page-inner">${head('PERSONAS · 6 SOSPECHOSOS','BASE-02')}<h2>Personas</h2><p class="muted">Los seis existen siempre. Que un personaje sea NPC no lo elimina como sospechoso.</p><div class="cards">${people}</div></div></section>`;const scenes=LOCS.map(x=>`<article class="scene"><div class="symbol">${x[2]}</div><div><div class="code">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[3]}</div><p style="font-size:8.5pt">¿Qué ocurrió aquí? ¿Quién tuvo acceso? ¿Qué registro puede confirmarlo?</p></div></article>`).join('');const p3=`<section class="page base-page"><div class="page-inner">${head('ESCENAS DE INVESTIGACIÓN','BASE-03')}<h2>Escenas</h2><p class="muted">Una escena puede ser el lugar del hecho crítico o una parte indispensable de la secuencia.</p><div class="scene-grid">${scenes}</div></div></section>`;const objects=OBJS.map(x=>`<article class="object"><div class="symbol">${x[2]}</div><div><div class="code">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[3]}</div><p style="font-size:8.5pt">No asumas que el objeto clave es necesariamente el mecanismo de la muerte.</p></div></article>`).join('');const p4=`<section class="page base-page"><div class="page-inner">${head('OBJETOS CLAVE','BASE-04')}<h2>Objetos</h2><p class="muted">El objeto verdadero es el que vuelve incompleta la reconstrucción si se lo retira.</p><div class="object-grid">${objects}</div></div></section>`;const axes=['PERSONA','ESCENA','OBJETO','MOTIVO / HIPÓTESIS CAUSAL'].map(x=>`<div class="axis"><b>${x}</b><div class="lines"></div></div>`).join('');const notes=['HECHOS CONFIRMADOS','CONTRADICCIONES','COARTADAS','TESTIMONIOS','HIPÓTESIS ABIERTAS','DESCARTES JUSTIFICADOS'].map(x=>`<div class="note-box"><h3>${x}</h3><div class="lines"></div></div>`).join('');const p5=`<section class="page base-page"><div class="page-inner">${head('HOJA DE INVESTIGACIÓN','BASE-05')}<h2>Tablero de teoría</h2><p class="muted">Separá lo que sabés de lo que suponés. Un descarte necesita una razón.</p><div class="axis-grid">${axes}</div><div class="note-grid">${notes}</div></div></section>`;let rows='';for(let i=0;i<11;i++)rows+=`<div class="tlrow"><div></div><div></div><div></div><div></div><div></div></div>`;const p6=`<section class="page base-page"><div class="page-inner">${head('LÍNEA DE TIEMPO','BASE-06')}<h2>Cronología reconstruida</h2><p class="muted">No hay un rango horario fijo: anotá toda marca temporal útil del pack.</p><div class="timeline"><div class="tlrow tlhead"><div>HORA</div><div>EVENTO</div><div>FUENTE</div><div>CERTEZA</div><div>CONTRADICCIÓN</div></div>${rows}</div></div></section>`;const rels=CHARS.map(c=>`<div class="rel"><div class="rel-head"><h3>${c.name}</h3><span class="code">${c.code}</span></div><div class="rel-lines"><b>VÍNCULO</b><span>________________________________</span><b>INTERÉS / MOTIVO</b><span>________________________________</span><b>CONFLICTO</b><span>________________________________</span><b>ACCESO</b><span>________________________________</span><b>COARTADA</b><span>________________________________</span><b>CONTRADICCIÓN</b><span>________________________________</span></div></div>`).join('');const p7=`<section class="page base-page"><div class="page-inner">${head('MAPA DE RELACIONES','BASE-07')}<div class="victim"><div class="eyebrow">CENTRO DEL CASO</div><h2 style="margin:1mm 0">ESTEBAN VALDÉS</h2><div class="muted">Víctima · cruzá relaciones sin asumir culpabilidad</div></div><div class="relations">${rels}</div></div></section>`;const acc=['PERSONA RESPONSABLE','ESCENA CLAVE','OBJETO CLAVE','MOTIVO / HIPÓTESIS CAUSAL'].map(x=>`<div class="acc"><b>${x}</b></div>`).join('');const p8=`<section class="page base-page"><div class="page-inner">${head('ACUSACIÓN FINAL','BASE-08')}<h2>Bloqueo de hipótesis</h2><p class="muted">Completar antes de revelar la solución digital.</p><div class="acc-fields">${acc}</div><div class="bigbox"><b>RECONSTRUCCIÓN BREVE DE LOS HECHOS</b><div class="lines"></div></div><div class="signature"><div class="sign">FIRMA / EQUIPO INVESTIGADOR</div><div class="sign">FECHA / CÓDIGO DE SALA</div></div></div></section>`;return p1+p2+p3+p4+p5+p6+p7+p8}
function humans(){return new Set([...document.querySelectorAll('.human:checked')].map(x=>x.value))}function visibleEvidence(){if(!currentPack)return[];const stage=+$('#stage').value,channel=$('#channel').value,hs=humans(),out=[];for(const e of(currentPack.evidence||[])){if(+e.stage>stage)continue;if(channel==='CASEFILE'){if(e.public)out.push({...e,renderText:e.text,renderChannel:'PUBLIC'});else if(e.sourceCharacter&&!hs.has(e.sourceCharacter)&&e.npcFallback)out.push({...e,renderText:e.npcFallback,renderChannel:'NPC'})}else if(!e.public&&e.sourceCharacter===channel&&hs.has(channel))out.push({...e,renderText:e.text,renderChannel:`PRIVATE::${channel}`})}return out}
function evidenceTitle(e){const spec=e.printSpec||{};if(spec.title)return spec.title;const n=(TYPE_LABEL[e.type]||'EVIDENCIA');if(e.renderChannel==='NPC')return`${n} · NPC`;if(String(e.renderChannel).startsWith('PRIVATE'))return`${n} · PRIVADA`;return n}function evidencePages(){const ev=visibleEvidence();if(!ev.length)return'';let pages='';for(let i=0;i<ev.length;i+=2){const pair=ev.slice(i,i+2);const docs=pair.map(e=>`<article class="evidence-doc"><div class="evtop"><div><div class="evtype">${esc(TYPE_LABEL[e.type]||e.type)}</div><div class="code">${esc(e.id)}</div></div><div class="evstage">E${e.stage} · ${esc(e.renderChannel)}</div></div><h2 class="evtitle">${esc(evidenceTitle(e))}</h2><div class="evtext">${esc(e.renderText)}</div><div class="watermark">EXPEDIENTE C001</div><div class="evmeta"><span>Fuente canónica: Crime Pack · texto de evidencia</span><span>NO CONTIENE DEDUCCIÓN NI SOLUCIÓN</span></div></article>`).join('');pages+=`<section class="page evidence-page"><div class="page-inner">${head(`EVIDENCIA DINÁMICA · ${esc(currentPack.id||'C001')}`,`EVID-${Math.floor(i/2)+1}`)}<div class="evidence-docs">${docs}${pair.length===1?'<article class="evidence-doc" style="opacity:.18"><div class="evtype">ESPACIO RESERVADO</div></article>':''}</div></div></section>`}return pages}
function validatePack(p){const errs=[];if(!p||!p.id)errs.push('Falta id');if(!Array.isArray(p?.evidence)||p.evidence.length<6)errs.push('Debe tener 6+ evidencias');for(const e of(p?.evidence||[])){if(![1,2,3].includes(+e.stage))errs.push(`${e.id}: stage inválido`);if(!TYPE_LABEL[e.type])errs.push(`${e.id}: type no reconocido`);if(!e.public&&e.sourceCharacter&&!e.npcFallback)errs.push(`${e.id}: privada testimonial sin npcFallback`)}return errs}
function render(){document.body.classList.toggle('eco',$('#theme').value==='eco');document.body.classList.toggle('base-off',!$('#baseOn').checked);document.body.classList.toggle('evidence-off',!$('#evidenceOn').checked);$('#app').innerHTML=basePages()+evidencePages();const ev=visibleEvidence();const errs=currentPack?validatePack(currentPack):[];if(currentPack){$('#status').textContent=`${currentPack.id} · ${currentPack.title||''} · ${ev.length} evidencia(s) imprimible(s) en este canal/etapa.`;$('#status').className='status '+(errs.length?'bad':'good');$('#qaText').textContent=errs.length?`ADVERTENCIAS: ${errs.join(' · ')}`:`PASS estructural · ${currentPack.evidence.length} evidencias canónicas · salida actual: ${ev.length} · sin deduction/truthSummary/epílogo en DOM.`}else{$('#status').textContent='Kit base listo. Cargá un Crime Pack para generar evidencias dinámicas.';$('#status').className='status';$('#qaText').textContent='8 páginas base · sin datos de solución · sin pack cargado.'}}
async function loadRelative(id){if(!id){currentPack=null;render();return}try{const r=await fetch(`../packs/${id}.json`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);currentPack=await r.json();render()}catch(e){currentPack=null;render();$('#status').textContent=`No pude cargar ${id} desde ruta relativa. Si abriste el HTML localmente, usá “Cargar JSON local”. (${e.message})`;$('#status').className='status bad'}}for(let i=1;i<=12;i++){const id=`C001-${String(i).padStart(2,'0')}`;$('#pack').insertAdjacentHTML('beforeend',`<option value="${id}">${id}</option>`)}$('#theme').onchange=render;$('#stage').onchange=render;$('#channel').onchange=render;$('#baseOn').onchange=render;$('#evidenceOn').onchange=render;document.querySelectorAll('.human').forEach(x=>x.onchange=render);$('#pack').onchange=e=>loadRelative(e.target.value);$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{currentPack=JSON.parse(await f.text());$('#pack').value='';render()}catch(err){$('#status').textContent='JSON inválido: '+err.message;$('#status').className='status bad'}};$('#print').onclick=()=>window.print();render();
</script></body></html>
