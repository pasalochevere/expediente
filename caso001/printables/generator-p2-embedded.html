function artImg(src,alt,fallback){return src?`<img src="${src}" alt="${esc(alt)}">`:`<span class="fallback-letter">${esc(fallback)}</span>`}
const TYPE_LABEL={temporal:'REGISTRO TEMPORAL',testimonial:'DECLARACIÓN',physical:'FICHA PERICIAL',digital:'EVIDENCIA DIGITAL',access:'CONTROL DE ACCESO',motivational:'DOCUMENTO CONTEXTUAL'};let currentPack=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function head(label,n){return `<div class="page-head"><div><div class="case">EXPEDIENTES · <span>CASO 001</span></div><div class="eyebrow">${label}</div></div><div class="pageno">${n}</div></div>`}
function basePages(){const p1=`<section class="page base-page"><div class="page-inner">${head('EXPEDIENTE DEL CASO','BASE-01')}<div class="cover-grid"><div class="cover-panel"><div><div class="stamp">ARCHIVO CONFIDENCIAL</div><h1>LA ÚLTIMA<br>REUNIÓN</h1><div class="tagline">La verdad está en la mesa.</div></div><div><div class="eyebrow">LEER EN VOZ ALTA</div><p>Seis personas. Una reunión que debía cerrar viejas cuentas. Una muerte que ninguno esperaba.</p></div></div><div class="story"><div class="eyebrow">APERTURA COMÚN · P2</div><h2>Una reunión que nadie podrá olvidar.</h2><p>Esteban Valdés convocó a seis personas que forman parte de distintos momentos de su vida. Todos aceptaron asistir. Ninguno llegó sin algo que perder.</p><blockquote>“Esta noche vamos a terminar lo que empezamos.”</blockquote><p>La conversación se volvió tensa. Hubo reproches, silencios y movimientos que más tarde nadie describiría de la misma manera.</p><p>Antes de que terminara la noche, <b>Esteban Valdés murió dentro de la propiedad</b>. La explicación no está en una sola pista. Está dispersa entre personas, escenas, objetos, horarios y contradicciones.</p><p><b>Los seis personajes siguen siendo parte del caso, aunque algunos sean controlados por el expediente como NPC.</b></p><div class="rules"><div class="rule"><b>1 · INVESTIGÁ POR ETAPAS.</b><br>E1 abre líneas. E2 fractura coartadas. E3 permite cerrar por cruce.</div><div class="rule"><b>2 · NINGUNA PISTA VALE SOLA.</b><br>Contrastá hechos, testimonios y registros antes de descartar.</div><div class="rule"><b>3 · ACUSACIÓN FINAL.</b><br>Persona + Escena + Objeto + Motivo / hipótesis causal.</div></div></div></div></div></section>`;const people=CHARS.map((c,i)=>`<article class="card"><div class="portrait"><small>${c.code}</small>${artImg(ART.portraits[i],c.name,c.name.slice(0,1))}</div><div class="card-copy"><div class="role">${c.role}</div><h3>${c.name}</h3><div class="quote">“${c.quote}”</div><p class="muted" style="font-size:9pt">Anotá solo hechos comprobados. La relación con la víctima puede adquirir un significado distinto según el Crime Pack.</p></div></article>`).join('');const p2=`<section class="page base-page"><div class="page-inner">${head('PERSONAS · 6 SOSPECHOSOS','BASE-02')}<h2>Personas</h2><p class="muted">Los seis existen siempre. Que un personaje sea NPC no lo elimina como sospechoso.</p><div class="cards">${people}</div></div></section>`;const scenes=LOCS.map((x,i)=>`<article class="scene"><div class="symbol">${artImg(ART.locations[i],x[1],x[2])}</div><div><div class="code">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[3]}</div><p style="font-size:8.5pt">¿Qué ocurrió aquí? ¿Quién tuvo acceso? ¿Qué registro puede confirmarlo?</p></div></article>`).join('');const p3=`<section class="page base-page"><div class="page-inner">${head('ESCENAS DE INVESTIGACIÓN','BASE-03')}<h2>Escenas</h2><p class="muted">Una escena puede ser el lugar del hecho crítico o una parte indispensable de la secuencia.</p><div class="scene-grid">${scenes}</div></div></section>`;const objects=OBJS.map((x,i)=>`<article class="object"><div class="symbol">${artImg(ART.objects[i],x[1],x[2])}</div><div><div class="code">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[3]}</div><p style="font-size:8.5pt">No asumas que el objeto clave es necesariamente el mecanismo de la muerte.</p></div></article>`).join('');const p4=`<section class="page base-page"><div class="page-inner">${head('OBJETOS CLAVE','BASE-04')}<h2>Objetos</h2><p class="muted">El objeto verdadero es el que vuelve incompleta la reconstrucción si se lo retira.</p><div class="object-grid">${objects}</div></div></section>`;const axes=['PERSONA','ESCENA','OBJETO','MOTIVO / HIPÓTESIS CAUSAL'].map(x=>`<div class="axis"><b>${x}</b><div class="lines"></div></div>`).join('');const notes=['HECHOS CONFIRMADOS','CONTRADICCIONES','COARTADAS','TESTIMONIOS','HIPÓTESIS ABIERTAS','DESCARTES JUSTIFICADOS'].map(x=>`<div class="note-box"><h3>${x}</h3><div class="lines"></div></div>`).join('');const p5=`<section class="page base-page"><div class="page-inner">${head('HOJA DE INVESTIGACIÓN','BASE-05')}<h2>Tablero de teoría</h2><p class="muted">Separá lo que sabés de lo que suponés. Un descarte necesita una razón.</p><div class="axis-grid">${axes}</div><div class="note-grid">${notes}</div></div></section>`;let rows='';for(let i=0;i<11;i++)rows+=`<div class="tlrow"><div></div><div></div><div></div><div></div><div></div></div>`;const p6=`<section class="page base-page"><div class="page-inner">${head('LÍNEA DE TIEMPO','BASE-06')}<h2>Cronología reconstruida</h2><p class="muted">No hay un rango horario fijo: anotá toda marca temporal útil del pack.</p><div class="timeline"><div class="tlrow tlhead"><div>HORA</div><div>EVENTO</div><div>FUENTE</div><div>CERTEZA</div><div>CONTRADICCIÓN</div></div>${rows}</div></div></section>`;const rels=CHARS.map(c=>`<div class="rel"><div class="rel-head"><h3>${c.name}</h3><span class="code">${c.code}</span></div><div class="rel-lines"><b>VÍNCULO</b><span>________________________________</span><b>INTERÉS / MOTIVO</b><span>________________________________</span><b>CONFLICTO</b><span>________________________________</span><b>ACCESO</b><span>________________________________</span><b>COARTADA</b><span>________________________________</span><b>CONTRADICCIÓN</b><span>________________________________</span></div></div>`).join('');const p7=`<section class="page base-page"><div class="page-inner">${head('MAPA DE RELACIONES','BASE-07')}<div class="victim"><div class="eyebrow">CENTRO DEL CASO</div><h2 style="margin:1mm 0">ESTEBAN VALDÉS</h2><div class="muted">Víctima · cruzá relaciones sin asumir culpabilidad</div></div><div class="relations">${rels}</div></div></section>`;const acc=['PERSONA RESPONSABLE','ESCENA CLAVE','OBJETO CLAVE','MOTIVO / HIPÓTESIS CAUSAL'].map(x=>`<div class="acc"><b>${x}</b></div>`).join('');const p8=`<section class="page base-page"><div class="page-inner">${head('ACUSACIÓN FINAL','BASE-08')}<h2>Bloqueo de hipótesis</h2><p class="muted">Completar antes de revelar la solución digital.</p><div class="acc-fields">${acc}</div><div class="bigbox"><b>RECONSTRUCCIÓN BREVE DE LOS HECHOS</b><div class="lines"></div></div><div class="signature"><div class="sign">FIRMA / EQUIPO INVESTIGADOR</div><div class="sign">FECHA / CÓDIGO DE SALA</div></div></div></section>`;return p1+p2+p3+p4+p5+p6+p7+p8}
function humans(){return new Set([...document.querySelectorAll('.human:checked')].map(x=>x.value))}function visibleEvidence(){if(!currentPack)return[];const stage=+$('#stage').value,channel=$('#channel').value,hs=humans(),out=[];for(const e of(currentPack.evidence||[])){if(+e.stage>stage)continue;if(channel==='CASEFILE'){if(e.public)out.push({...e,renderText:e.text,renderChannel:'PUBLIC'});else if(e.sourceCharacter&&!hs.has(e.sourceCharacter)&&e.npcFallback)out.push({...e,renderText:e.npcFallback,renderChannel:'NPC'})}else if(!e.public&&e.sourceCharacter===channel&&hs.has(channel))out.push({...e,renderText:e.text,renderChannel:`PRIVATE::${channel}`})}return out}
function evidenceTitle(e){const spec=e.printSpec||{};if(spec.title)return spec.title;const n=(TYPE_LABEL[e.type]||'EVIDENCIA');if(e.renderChannel==='NPC')return`${n} · NPC`;if(String(e.renderChannel).startsWith('PRIVATE'))return`${n} · PRIVADA`;return n}function evidencePages(){const ev=visibleEvidence();if(!ev.length)return'';let pages='';for(let i=0;i<ev.length;i+=2){const pair=ev.slice(i,i+2);const docs=pair.map(e=>`<article class="evidence-doc"><div class="evtop"><div><div class="evtype">${esc(TYPE_LABEL[e.type]||e.type)}</div><div class="code">${esc(e.id)}</div></div><div class="evstage">E${e.stage} · ${esc(e.renderChannel)}</div></div><h2 class="evtitle">${esc(evidenceTitle(e))}</h2><div class="evtext">${esc(e.renderText)}</div><div class="watermark">EXPEDIENTE C001</div><div class="evmeta"><span>Fuente canónica: Crime Pack · texto de evidencia</span><span>NO CONTIENE DEDUCCIÓN NI SOLUCIÓN</span></div></article>`).join('');pages+=`<section class="page evidence-page"><div class="page-inner">${head(`EVIDENCIA DINÁMICA · ${esc(currentPack.id||'C001')}`,`EVID-${Math.floor(i/2)+1}`)}<div class="evidence-docs">${docs}${pair.length===1?'<article class="evidence-doc" style="opacity:.18"><div class="evtype">ESPACIO RESERVADO</div></article>':''}</div></div></section>`}return pages}
function validatePack(p){const errs=[];if(!p||!p.id)errs.push('Falta id');if(!Array.isArray(p?.evidence)||p.evidence.length<6)errs.push('Debe tener 6+ evidencias');for(const e of(p?.evidence||[])){if(![1,2,3].includes(+e.stage))errs.push(`${e.id}: stage inválido`);if(!TYPE_LABEL[e.type])errs.push(`${e.id}: type no reconocido`);if(!e.public&&e.sourceCharacter&&!e.npcFallback)errs.push(`${e.id}: privada testimonial sin npcFallback`)}return errs}
function render(){document.body.classList.toggle('eco',$('#theme').value==='eco');document.body.classList.toggle('base-off',!$('#baseOn').checked);document.body.classList.toggle('evidence-off',!$('#evidenceOn').checked);$('#app').innerHTML=basePages()+evidencePages();const ev=visibleEvidence();const errs=currentPack?validatePack(currentPack):[];if(currentPack){$('#status').textContent=`${currentPack.id} · ${currentPack.title||''} · ${ev.length} evidencia(s) imprimible(s) en este canal/etapa.`;$('#status').className='status '+(errs.length?'bad':'good');$('#qaText').textContent=errs.length?`ADVERTENCIAS: ${errs.join(' · ')}`:`PASS estructural · ${currentPack.evidence.length} evidencias canónicas · salida actual: ${ev.length} · sin deduction/truthSummary/epílogo en DOM.`}else{$('#status').textContent='Kit base listo. Seleccioná un Crime Pack para generar las evidencias correspondientes.';$('#status').className='status';$('#qaText').textContent='8 páginas base · sin datos de solución · sin pack cargado.'}}
async function loadRelative(id){if(!id){currentPack=null;render();return}try{const r=await fetch(`../packs/${id}.json`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);currentPack=await r.json();render()}catch(e){currentPack=null;render();$('#status').textContent=`No pude cargar ${id} desde ruta relativa. Si abriste el HTML localmente, usá “Cargar JSON local”. (${e.message})`;$('#status').className='status bad'}}for(let i=1;i<=12;i++){const id=`C001-${String(i).padStart(2,'0')}`;$('#pack').insertAdjacentHTML('beforeend',`<option value="${id}">${id}</option>`)}$('#theme').onchange=render;$('#stage').onchange=render;$('#channel').onchange=render;$('#baseOn').onchange=render;$('#evidenceOn').onchange=render;document.querySelectorAll('.human').forEach(x=>x.onchange=render);$('#pack').onchange=e=>loadRelative(e.target.value);$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{currentPack=JSON.parse(await f.text());$('#pack').value='';render()}catch(err){$('#status').textContent='JSON inválido: '+err.message;$('#status').className='status bad'}};$('#print').onclick=()=>window.print();render();
</script></body></html>
