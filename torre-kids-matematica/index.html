<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre Kids Matemática · PasaloChévere</title>
<style>
:root{--bg:#f5f0e6;--card:#fffdf7;--ink:#222;--muted:#6d675e;--line:#ded5c5;--accent:#d67c38}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f3ea,#efe7d8);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:950;letter-spacing:.1em}.pill{font-size:.75rem;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}
.hero{text-align:center;padding:30px 0 18px}.hero h1{font-size:clamp(2.2rem,8vw,4.2rem);line-height:.95;margin:8px 0}.hero p{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 28px #3c2b1512}
.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;margin:6px 0;font-weight:850;background:#252525;color:#fff}.btn.alt{background:#ebe4d8;color:#222}.btn.ghost{background:transparent;color:#222;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pieces{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.piece{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 0;font-weight:900}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.color{border:0;border-radius:16px;padding:20px 8px;font-weight:900}.rojo{background:#ef6b63}.verde{background:#78c978}.azul{background:#79a9e6}.amarillo{background:#efd75d}.fucsia{background:#e67fc5}.negro{background:#303030;color:white}
.badge{display:inline-block;padding:6px 10px;background:#eee7dc;border-radius:999px;font-size:.78rem;font-weight:850}.challenge{font-size:1.55rem;font-weight:900;line-height:1.25;text-align:center;padding:18px 6px}.answer{text-align:center;font-size:2.2rem;font-weight:950}
.score{font-weight:900}.hidden{display:none!important}.good{color:#1d7b48}.bad{color:#a63832}.note{color:var(--muted);font-size:.9rem;line-height:1.45}.stars{font-size:2rem;text-align:center}
#licenseGate{max-width:620px;margin:7vh auto}.access{background:#111;color:#f7efe5}.access body{background:#111}.access .wrap{max-width:620px}.access .card{background:#1a1a1d;border-color:#343438;color:#f7efe5}.access .note{color:#bbb}
@media(max-width:520px){.pieces{grid-template-columns:repeat(6,1fr)}.grid2{grid-template-columns:1fr}.hero{padding-top:22px}}
</style></head><body>
<section id="licenseGate" class="wrap">
  <div class="top"><div class="brand">PASALOCHEVERE</div><div class="pill">ACCESO PERSONAL</div></div>
  <div class="card"><div class="badge">TORRE KIDS · MATEMÁTICA</div><h1>Validando tu acceso…</h1><p id="licenseState" class="note">Ingresá siempre desde Mi Biblioteca.</p><a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="../portal/">VOLVER A MI BIBLIOTECA</a></div>
</section>
<main id="gameApp" class="wrap hidden">
  <div class="top"><div class="brand">PASALOCHEVERE</div><a href="../portal/" class="pill" style="text-decoration:none;color:inherit">MI BIBLIOTECA</a></div>
  <section id="home"><div class="hero"><div class="badge">EDICIÓN 01 · 7–9 AÑOS</div><h1>TORRE KIDS<br>MATEMÁTICA</h1><p>Sacá una pieza. Resolvé el desafío. Sumá estrellas.</p></div>
    <button class="btn" onclick="chooseMode()">▶ JUGAR</button><button class="btn alt" onclick="showRules()">📖 CÓMO SE JUEGA</button><button class="btn alt" onclick="showPrint()">🖨 IMPRIMIBLES</button>
  </section>
  <section id="screen" class="hidden"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DATA=[
[1,'rojo','Cálculo',1,'8 + 7 = ?','15','Pensá en 8 + 2 + 5.'],[19,'rojo','Cálculo',2,'35 − 18 = ?','17','35 − 20 = 15; sumá 2.'],[43,'rojo','Cálculo',3,'70 − 28 = ?','42','70 − 30 = 40; sumá 2.'],
[2,'verde','Multiplicación',1,'2 × 6 = ?','12','Sumá 6 dos veces.'],[26,'verde','Multiplicación',2,'4 × 6 = ?','24','6 + 6 + 6 + 6.'],[38,'verde','Multiplicación',3,'6 × 7 = ?','42','Pensá 5 × 7 y sumá 7.'],
[3,'azul','Lógica',1,'¿Qué sigue? 2 – 4 – 6 – 8 – ___','10','Va de 2 en 2.'],[33,'azul','Lógica',2,'10 – 20 – 30 – ___ – 50','40','Aumenta de 10 en 10.'],[51,'azul','Lógica',3,'Tres números consecutivos suman 30. ¿Cuáles son?','9, 10 y 11','El del medio es 10.'],
[4,'amarillo','Problemas',1,'Tenés 12 figuritas y te regalan 5. ¿Cuántas tenés?','17','12 + 5.'],[34,'amarillo','Problemas',2,'24 alumnos forman 4 equipos iguales. ¿Cuántos por equipo?','6','24 ÷ 4.'],[52,'amarillo','Problemas',3,'Tenías $100. Gastaste $25 y $30. ¿Cuánto quedó?','45','100 − 25 − 30.'],
[5,'fucsia','Velocidad',1,'En 10 segundos, decí 5 números pares.','Ej.: 2, 4, 6, 8, 10','Los pares terminan en 0, 2, 4, 6 u 8.'],[35,'fucsia','Velocidad',2,'En 15 segundos: 30 + 15 − 5','40','30 + 15 = 45.'],[53,'fucsia','Velocidad',3,'Decí cinco sumas diferentes que den 20.','Ej.: 10+10, 15+5, 12+8, 11+9, 14+6','Cambiá un número y compensá con el otro.'],
[6,'negro','Súper desafío',1,'Tirá un dado y sumale 10 al número que salió.','Depende del dado','Si sale 4, da 14.'],[36,'negro','Súper desafío',2,'Tirá un dado y multiplicá el resultado por 3.','Depende del dado','Sumá el número tres veces.'],[54,'negro','Súper desafío',3,'SÚPER RETO: 54 ÷ 6 = ?','9','6 × 9 = 54.']
].map((x,i)=>({id:i+1,piece:x[0],color:x[1],category:x[2],level:x[3],prompt:x[4],answer:x[5],hint:x[6]}));
const COLORS=['rojo','verde','azul','amarillo','fucsia','negro'], ICON={rojo:'🔴',verde:'🟢',azul:'🔵',amarillo:'🟡',fucsia:'🩷',negro:'⚫'}, LABEL={rojo:'Cálculo',verde:'Multiplicación',azul:'Lógica',amarillo:'Problemas',fucsia:'Velocidad',negro:'Súper desafío'};
let S={mode:'colores',level:2,players:['Jugador 1','Jugador 2'],p:0,scores:[0,0],color:null,piece:null,challenge:null,hint:false};
const home=document.getElementById('home'),screen=document.getElementById('screen');
function view(h){home.classList.add('hidden');screen.classList.remove('hidden');screen.innerHTML=h;window.scrollTo(0,0)}
function back(){screen.classList.add('hidden');home.classList.remove('hidden');window.scrollTo(0,0)}
function chooseMode(){view('<h2>¿Cómo quieren jugar?</h2><div class="grid2">'+[['🎯 Clásico','clasico'],['🎨 Dado de colores','colores'],['🎲 El que te toca','te_toca'],['⭐ Misión','mision']].map(x=>'<button class="card" onclick="setMode(\''+x[1]+'\')"><b>'+x[0]+'</b></button>').join('')+'</div><button class="btn ghost" onclick="back()">Volver</button>')}
function setMode(m){S.mode=m;view('<h2>Elegí el nivel</h2><button class="card" onclick="setLevel(1)"><b>🟢 Explorador</b><div class="note">Para empezar</div></button><button class="card" onclick="setLevel(2)"><b>🟡 Aventurero</b><div class="note">Cálculo y lógica</div></button><button class="card" onclick="setLevel(3)"><b>🔴 Maestro</b><div class="note">Más desafío</div></button>')}
function setLevel(l){S.level=l;view('<h2>¿Quiénes juegan?</h2><input id="p1" placeholder="Jugador 1"><input id="p2" placeholder="Jugador 2" style="margin-top:8px"><button class="btn" onclick="start()">CONTINUAR</button>')}
function start(){S.players=[document.getElementById('p1').value||'Jugador 1',document.getElementById('p2').value||'Jugador 2'];S.scores=[0,0];S.p=0;turn()}
function turn(){const n=S.players[S.p];let act=S.mode==='colores'?'<button class="btn" onclick="pickColor()">🎲 YA TIRÉ EL DADO DE COLORES</button>':'<button class="btn" onclick="pickPiece()">🧱 YA SAQUÉ / TENGO LA PIEZA</button>';view('<div class="score">'+n+' · ⭐ '+S.scores[S.p]+'</div><div class="hero"><h2>Turno de '+n+'</h2></div>'+act+'<button class="btn ghost" onclick="finish()">🧱 SE CAYÓ LA TORRE</button>')}
function pickColor(){view('<h2>¿Qué color salió?</h2><div class="colors">'+COLORS.map(c=>'<button class="color '+c+'" onclick="selectColor(\''+c+'\')">'+ICON[c]+'<br>'+LABEL[c]+'</button>').join('')+'</div>')}
function selectColor(c){S.color=c;pickPiece(c)}
function colorOf(n){return COLORS[(n-1)%6]}
function pickPiece(c){let nums=[...Array(54)].map((_,i)=>i+1).filter(n=>!c||colorOf(n)===c);view('<h2>¿Qué número sacaste?</h2><div class="pieces">'+nums.map(n=>'<button class="piece" onclick="openPiece('+n+')">'+String(n).padStart(2,'0')+'</button>').join('')+'</div>')}
function openPiece(n){S.piece=n;if(!S.color)S.color=colorOf(n);let candidates=DATA.filter(x=>x.piece===n&&x.level===S.level);if(!candidates.length)candidates=DATA.filter(x=>x.color===S.color&&x.level===S.level);if(!candidates.length)candidates=DATA.filter(x=>x.color===S.color);S.challenge=candidates[Math.floor(Math.random()*candidates.length)];S.hint=false;challenge()}
function challenge(){const x=S.challenge;view('<span class="badge">'+ICON[x.color]+' '+x.category+'</span><div class="note">Pieza '+String(S.piece).padStart(2,'0')+' · Nivel '+S.level+'</div><div class="card"><div class="challenge">'+x.prompt+'</div></div><button class="btn alt" onclick="hint()">💡 PISTA</button><button class="btn" onclick="answer()">👁 VER RESPUESTA</button>')}
function hint(){S.hint=true;const x=S.challenge;view('<span class="badge">'+ICON[x.color]+' '+x.category+'</span><div class="card"><div class="challenge">'+x.prompt+'</div></div><div class="card"><b>💡 Pista</b><p>'+x.hint+'</p></div><button class="btn" onclick="answer()">👁 VER RESPUESTA</button>')}
function answer(){view('<h2>Respuesta</h2><div class="card answer">'+S.challenge.answer+'</div><h3 style="text-align:center">¿Acertó?</h3><div class="grid2"><button class="btn" onclick="ok()">✅ SÍ</button><button class="btn alt" onclick="no()">❌ TODAVÍA NO</button></div>')}
function ok(){let pts=S.hint?1:(S.color==='negro'?3:2);S.scores[S.p]+=pts;view('<div class="hero"><h1>¡GENIAL!</h1><div class="stars">'+'⭐'.repeat(pts)+'</div><p>Ganaste '+pts+' estrella'+(pts===1?'':'s')+'.</p></div><div class="card"><b>Colocá la pieza arriba.</b></div><button class="btn" onclick="next()">SIGUIENTE TURNO</button>')}
function no(){view('<div class="hero"><h1>¡CASI!</h1><p>La respuesta era:</p><div class="answer">'+S.challenge.answer+'</div></div><button class="btn" onclick="recover()">⭐ MINI RETO</button><button class="btn alt" onclick="next()">SEGUIR</button>')}
function recover(){view('<div class="card"><h2>Mini reto</h2><div class="challenge">Decí tres números pares.</div></div><button class="btn" onclick="recOK()">✅ LO HIZO</button><button class="btn alt" onclick="next()">NO ESTA VEZ</button>')}
function recOK(){S.scores[S.p]++;view('<div class="hero"><h1>⭐ ¡RECUPERADA!</h1></div><button class="btn" onclick="next()">SIGUIENTE TURNO</button>')}
function next(){S.color=null;S.piece=null;S.challenge=null;S.p=(S.p+1)%S.players.length;turn()}
function finish(){let a=S.players.map((p,i)=>({p,s:S.scores[i]})).sort((x,y)=>y.s-x.s);view('<div class="hero"><h1>¡TORRE ABAJO!</h1><h2>🏆 '+a[0].p+'</h2><p>'+a[0].s+' estrellas</p></div><div class="card">'+a.map((x,i)=>'<p><b>'+(i+1)+'. '+x.p+'</b> — ⭐ '+x.s+'</p>').join('')+'</div><button class="btn" onclick="back()">MENÚ PRINCIPAL</button>')}
function showRules(){view('<div class="card"><h2>Cómo se juega</h2><p>1. Retirá una pieza.</p><p>2. Buscá su número.</p><p>3. Resolvé el desafío.</p><p>4. Si acertás, ganás estrellas.</p><p>5. Colocá la pieza arriba.</p><p class="note">🔴 Cálculo · 🟢 Multiplicación · 🔵 Lógica · 🟡 Problemas · 🩷 Velocidad · ⚫ Súper desafío</p></div><button class="btn" onclick="back()">VOLVER</button>')}
function showPrint(){view('<div class="card"><h2>Imprimibles</h2><p>En P0.6 la sección queda conectada al portal. En P0.7 cargaremos el manual imprimible definitivo desde la biblioteca maestra.</p></div><button class="btn" onclick="back()">VOLVER</button>')}

(async()=>{
 const state=document.getElementById('licenseState'),gate=document.getElementById('licenseGate'),game=document.getElementById('gameApp');
 const SUPABASE_URL='https://fzbndgfnqxcacsvlitui.supabase.co',SUPABASE_KEY='sb_publishable_bJ91vnQUWHfFqWRO99fFkQ_dh0icDxo';
 const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
 const DK='pc_device_id';const deviceId=()=>{let v=localStorage.getItem(DK);if(!v){v=crypto.randomUUID?crypto.randomUUID():'dev_'+Date.now();localStorage.setItem(DK,v)}return v};
 const label=()=>[navigator.platform||'',navigator.userAgent.includes('Mobile')?'Mobile':'Browser'].filter(Boolean).join(' · ').slice(0,150);
 const qs=new URLSearchParams(location.search);let code=(qs.get('access')||sessionStorage.getItem('pc_tk_mat_79_access')||'').trim().toUpperCase();if(code)sessionStorage.setItem('pc_tk_mat_79_access',code);
 try{
  const {data:{session}}=await sb.auth.getSession();if(!session?.user?.email)throw new Error('Ingresá desde Mi Biblioteca para validar tu cuenta.');
  if(!code)throw new Error('No encontré el código personal de Torre Kids Matemática.');
  const {data,error}=await sb.functions.invoke('pasalochevere-access',{body:{action:'register_device',activation_code:code,device_id:deviceId(),device_label:label()}});
  if(error)throw error;if(!data?.ok)throw new Error(data?.error||'No se pudo validar el acceso.');
  state.textContent='✅ Acceso validado para '+session.user.email;
  setTimeout(()=>{gate.classList.add('hidden');game.classList.remove('hidden');window.scrollTo(0,0)},350);
 }catch(e){state.textContent='⚠️ '+(e?.message||'Acceso no válido.')+' Volvé a tu biblioteca y abrí Torre Kids Matemática desde allí.'}
})();
</script></body></html>
