<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#651b24">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta property="og:type" content="website">
<meta property="og:title" content="Para Dai · Una invitación especial">
<meta property="og:description" content="Un cupón válido por una cena con vino blanco Santa Julia. Miércoles, 21 hs.">
<title>Para Dai · Invitación especial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--wine:#6a1825;--wine2:#931e32;--gold:#ac7d30;--cream:#fbebd6}
*{box-sizing:border-box}
html{min-height:100%;background:#341621}
body{min-height:100vh;margin:0;padding:clamp(14px,4vw,42px);display:grid;place-items:center;background:radial-gradient(circle at 52% 25%,#813e42 0%,#361b26 63%,#1a131a 100%);font-family:'Cormorant Garamond',Georgia,serif;color:var(--wine)}
.invite{position:relative;width:min(1090px,100%);padding:clamp(18px,4vw,48px);background:radial-gradient(circle at 26% 39%,#fff8ed 0%,#fbebd6 62%,#efd7b9 100%);box-shadow:0 20px 70px #0c050a77,inset 0 0 70px #c59b6233;border:2px solid var(--gold);border-radius:7px;overflow:hidden}
.invite:before{content:"";position:absolute;inset:10px;border:1.5px solid var(--wine);border-radius:25px;pointer-events:none}
.invite:after{content:"";position:absolute;inset:20px;border:1px solid #ba985a77;pointer-events:none}
.corner{position:absolute;z-index:1;color:var(--gold);font-size:clamp(22px,3vw,32px);opacity:.9}
.c1{top:21px;left:28px}.c2{top:21px;right:28px}.c3{bottom:21px;left:28px}.c4{bottom:21px;right:28px}
.ribbon{position:absolute;left:-40px;top:32px;width:235px;height:39px;background:linear-gradient(180deg,#9a2638,#5b111e,#ae3540);transform:rotate(-28deg);box-shadow:0 5px 9px #480c1b77;z-index:1}
.ribbon:after{content:"";position:absolute;left:125px;top:-35px;width:36px;height:111px;border-radius:50%;border:14px solid #7c1929;transform:rotate(-26deg);box-shadow:3px 3px 6px #220b1440}
header{text-align:center;position:relative;z-index:2;padding-top:14px}
.kicker{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(62px,10vw,104px);line-height:1.05;color:var(--wine);margin:0;font-weight:400}
.heart{display:flex;align-items:center;justify-content:center;gap:15px;color:var(--gold);font-size:26px;margin:5px 0 18px}
.heart:before,.heart:after{content:"";width:100px;max-width:25%;height:1px;background:var(--gold)}
.seal{position:absolute;right:1px;top:0;background:radial-gradient(circle at 34% 22%,#ab2939,#5b0d1f);color:#ffe2a9;border:5px double #cc963d;width:136px;height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 6px 9px #62162755;text-align:center;transform:rotate(8deg);font-size:22px;font-style:italic;line-height:1}
.seal span{font-size:25px;line-height:1.5}
.announce{position:relative;z-index:2;text-align:center;padding:16px 14px;margin:7px 7% 18px;border:3px double var(--gold);border-radius:19px;background:#fff9efb0}
.announce h1{font-size:clamp(34px,5.6vw,70px);line-height:1.07;font-weight:700;margin:0;letter-spacing:-.02em;color:#68151e}
.middle{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:8px;margin-top:8px}
.details{padding:0 2% 0 4%;font-size:clamp(24px,3.4vw,43px);line-height:1.45}
.detail{display:flex;gap:17px;align-items:center;white-space:nowrap}
.ico{width:36px;color:var(--wine);text-align:center;font-size:30px;flex:none}
.detail b{font-style:italic;font-weight:700}
.art{position:relative;min-height:278px;display:flex;align-items:end;justify-content:center;padding-bottom:15px}
.art svg{width:100%;height:auto;max-width:440px;filter:drop-shadow(0 6px 5px #6f3b2b30)}
.bottom{text-align:center;position:relative;z-index:2;margin:15px auto 3px;max-width:950px;color:#491b20;font-size:clamp(25px,3.6vw,44px);font-style:italic;line-height:1.05}
.flourish{text-align:center;font-size:32px;color:var(--gold);margin:9px auto 0}
.footer{text-align:center;font-size:15px;letter-spacing:2px;color:#986f3a;margin:10px 0 0}
@media(max-width:740px){body{padding:12px}.invite{padding:30px 16px 24px}.invite:before{inset:8px}.invite:after{inset:14px}.seal{position:relative;margin:0 auto 5px;width:106px;height:106px;font-size:16px}.seal span{font-size:19px}.kicker{font-size:76px}.ribbon{top:14px;left:-85px}.announce{margin:12px 5px 0;padding:13px 8px}.announce h1{font-size:38px}.middle{display:flex;flex-direction:column;gap:0}.details{order:1;padding:17px 0 0;font-size:clamp(26px,5.8vw,36px)}.detail{gap:8px}.ico{font-size:24px;width:28px}.art{min-height:0;order:2;width:80%;margin-top:0}.art svg{max-height:300px}.bottom{margin:4px 8px;font-size:30px}.c1,.c2,.c3,.c4{font-size:18px}.c1{top:15px;left:18px}.c2{top:15px;right:18px}.c3{bottom:15px;left:18px}.c4{bottom:15px;right:18px}}
</style>
</head>
<body>
<main class="invite" aria-label="Cupón de invitación para Dai">
<div class="ribbon" aria-hidden="true"></div>
<div class="corner c1">❧</div><div class="corner c2">❧</div><div class="corner c3">❧</div><div class="corner c4">❧</div>
<header>
<h2 class="kicker">Para Dai</h2>
<div class="heart" aria-hidden="true">♡</div>
<div class="seal">Invitación<br>especial<span>♡</span></div>
</header>
<section class="announce"><h1>Cupón válido por una<br>cena con vino</h1></section>
<section class="middle">
<div class="details">
<div class="detail"><span class="ico">⌂</span><span><b>Lugar:</b> Cuba 3615</span></div>
<div class="detail"><span class="ico">▣</span><span><b>Día:</b> miércoles</span></div>
<div class="detail"><span class="ico">◷</span><span><b>Hora:</b> 21 hs</span></div>
</div>
<div class="art" aria-label="Vino blanco Santa Julia, dos copas, vela y rosa">

</g>
<g stroke="#ba915d" stroke-width="3" fill="none">

</g>

<path d="M148 156 H213 Q213 184 202 196 Q188 206 168 199 Q151 190 148 156Z" fill="url(#wine)" opacity=".9"/>
<path d="M90 138 Q92 131 94 119 M161 129 Q164 117 165 108" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".7"/>
<g transform="translate(22,224)">

</g>

<path d="M28 38 C8 46 -2 26 14 15 C3 -2 30 -5 39 8 C59 0 67 20 55 29 C64 44 40 51 28 38Z" fill="#9c2030" stroke="#6a1424" stroke-width="3"/>
<path d="M25 31 Q14 22 29 16 Q49 9 47 26 Q37 39 25 31Z" fill="#b7253b"/>

</g>
</svg>
</div>
</section>
<p class="bottom">Canjeable por una noche linda, rica comida<br>y una copa compartida.</p>
<div class="flourish">❦</div>
<div class="footer">MIÉRCOLES · 18 DE NOVIEMBRE · 21 HS</div>
</main>
</body></html>
