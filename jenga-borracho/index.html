 background:radial-gradient(circle,#fffdf4 53%,#e8ceaa 71%,#f9e9d1 79%,transparent 80%);
 filter:drop-shadow(0 12px 13px #58402020);pointer-events:none
}
.wheel-disc{inset:11px;filter:drop-shadow(0 10px 10px #49311b36)}
.wheel-pointer{
 z-index:4;top:-17px;width:38px;height:39px;display:grid;place-items:center;
 border-radius:12px;border:3px solid #e1b771;
 background:linear-gradient(145deg,#3b3229,#191713);
 box-shadow:0 7px 12px #37251330;color:#f5d39c;font-size:23px;text-shadow:none
}
.wheel-hub{
 width:103px;height:103px;border:5px solid #eec178;
 background:radial-gradient(circle at 20% 15%,#4b4035,#24201c 60%,#141311);
 box-shadow:0 6px 0 #976934,0 10px 25px #24170e4d,inset 0 0 0 2px #ffffff1b
}
.wheel-hub b{font-size:47px;color:#f5d69b}
.wheel-hub small{font-size:9px;color:#fff2d9;letter-spacing:.12em}
.wheel-hint{font-size:13px;color:#776757;margin:16px 0 7px}
.wheel-hint span{color:#bd8a48;font-size:17px}
.wheel-wrap .actions .btn{min-height:66px;font-size:16px;letter-spacing:.055em}
.sheet{background:#1c1917ab;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet>div{
 border:1px solid #dfccb3;border-bottom:0;
 border-radius:29px 29px 0 0;
 padding:26px 22px max(24px,env(safe-area-inset-bottom));
 background:linear-gradient(160deg,#fffcf6,#f2e8db);
 box-shadow:0 -20px 52px #1b120b40
}
.sheet h2{font-size:34px;margin:6px 0 20px}
.hist article,.rule{background:linear-gradient(140deg,#fffdfa,#f9f2e8);padding:17px;border:1px solid #e8d9c5;border-radius:17px}
.care{padding:21px 22px;border:1px solid #e3c993;border-radius:23px;background:linear-gradient(145deg,#fffaf0,#f6e8d2)}
.care b{font-size:14px;color:#75512c}
.care p{color:#685b4b;font-size:15px;margin:9px 0 17px}
.care b:not(:first-child){display:block;padding-top:15px;border-top:1px solid #c9a77844}
.care p:last-child{margin-bottom:0}
.timer-ring{background:radial-gradient(circle,#fff,#f3e8d9);box-shadow:0 0 0 6px #ffffff14,0 14px 30px #0002}
.is-revealed .timer-ring{color:#231f19}
.is-revealed .timer-ring small{color:#7a6651}
.is-revealed .wheel-task-text{color:#f5e7d3}
.done{min-height:88svh;align-items:center;gap:9px}
.done .logo{margin:3px auto 24px}
.done h1{font-size:clamp(47px,11.8vw,58px);max-width:420px}
.done h2{margin:6px 0}
.done p{max-width:356px;color:#6a6055;font-size:16px}
.done>.btn{max-width:388px}
.done>small{color:#74665a;margin:10px auto}
@media(max-width:380px){
 #app{padding:17px 16px max(28px,env(safe-area-inset-bottom))}
 .hero-copy h1{font-size:clamp(44px,12vw,54px)}
 .mode-btn{grid-template-columns:38px minmax(0,1fr) 16px;gap:10px;padding:12px 13px}
 .mode-ico{width:38px;height:38px}.mode-copy b{font-size:12.5px}
 .card{min-height:415px;padding:20px 16px}
 .card .txt{font-size:clamp(27px,7.7vw,35px)}
 .wheel-stage{width:min(100%,295px)}.wheel-disc{inset:9px}
 .wheel-hub{width:86px;height:86px}.wheel-hub b{font-size:39px}.wheel-hub small{font-size:8px}
 .lvl{padding:19px 17px 17px}
}
@media(max-width:340px){.wheel-stage{width:min(100%,270px)}.hero-copy h1{font-size:43px}.lvl h3{font-size:21px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.wheel-disc,.btn,.bar i{transition:none!important}}

/* JB11 — Ruleta tres intensidades / sistema visual nocturno */
:root{
  --jb-deep:#201c1c;--jb-espresso:#322622;--jb-brass:#e6ba77;
  --jb-ivory:#fdf3e3;--jb-green:#527d67;--jb-amber:#c2853f;--jb-terracotta:#a9534b;
}
#app{background:radial-gradient(ellipse at 91% 0%,#f1d6a451 0,transparent 29%),linear-gradient(177deg,#fdf9f1 0%,#f4eadc 67%,#eee3d5)}
.hero-copy{padding-top:12px}
.hero-copy h1{letter-spacing:-.022em}
.hero-copy p{max-width:390px}
.mode-separator span{font-size:11px;color:#946a36}
.mode-wheel.btn.o{background:linear-gradient(130deg,#cb8c49 0%,#a45a36 100%);border:1px solid #e9b87677;box-shadow:0 14px 26px #9e582d3b}
.mode-wheel .mode-ico{font-family:Georgia,serif;font-size:30px;color:#fff4dd}
.mode-btn{transition:transform .17s ease,box-shadow .17s ease}
.mode-btn:active{transform:scale(.985)}
.levels{padding-bottom:15px}
.roulette-intro{display:flex;flex-direction:column;align-items:stretch;gap:15px}
.roulette-intro h1{font-size:clamp(44px,11vw,58px);line-height:.95;letter-spacing:-.018em;margin:5px 0}
.roulette-intro h1 em{font-style:normal;color:#b67c38}
.roulette-intro>p{font-size:16px;color:#584f44;line-height:1.55;max-width:380px;margin:0}
.roulette-intro>small{color:#776757;font-size:12px;text-align:center;margin-top:1px}
.intensity-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 2px}
.intensity{
  color:white;text-align:center;
  min-height:64px;display:grid;place-items:center;
  padding:10px 4px;border-radius:14px;
  font-size:clamp(10px,2.8vw,13px);font-weight:900;letter-spacing:.03em;
  border:1px solid #ffffff44;box-shadow:0 8px 17px #3020171c
}
.intensity.tranqui{background:linear-gradient(145deg,#70957e,#496f5a)}
.intensity.sube{background:linear-gradient(145deg,#dda25b,#b77132)}
.intensity.maximo{background:linear-gradient(145deg,#cd7768,#9d453d)}
.roulette-intro .care{padding:23px}
.roulette-intro .care p{margin:6px 0 15px}
.roulette-intro .btn{font-size:15px}
.card.is-wheel.is-pick{
  min-height:clamp(470px,69svh,660px);
  padding:24px 17px 22px;
  background:radial-gradient(ellipse at 50% 5%,#49372d 0,#2b2523 54%,#171719 100%);
  border:1px solid #a7835655;
  box-shadow:0 24px 53px #3c291b4d,inset 0 1px 0 #ffffff18;
}
.card.is-wheel.is-pick::before{background:linear-gradient(90deg,transparent,#b48550,#f8ddb0,#b48550,transparent)}
.card.is-wheel.is-pick::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;left:50%;top:41%;transform:translate(-50%,-50%);background:#d3ab6621;filter:blur(52px);pointer-events:none}
.card.is-wheel.is-pick .wheel-wrap .over{color:#efc68b}
.card.is-wheel.is-pick .wheel-wrap h2{
 color:#fff3e2;font-size:clamp(29px,8vw,37px);
 line-height:1.06;letter-spacing:.005em;margin:13px 0 14px;
 text-shadow:0 3px 15px #0008
}
.wheel-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.wheel-stage{width:min(100%,343px);margin:0 auto;isolation:isolate}
.wheel-stage:before{background:radial-gradient(circle,#fcebd4 54%,#c9a06e 69%,#f2d2a0 78%,transparent 80%);filter:drop-shadow(0 13px 17px #0006)}
.wheel-disc{inset:8px;filter:drop-shadow(0 7px 14px #0008);transition:transform 3.4s cubic-bezier(.10,.67,.17,1)}
.wheel-pointer{top:-16px;z-index:6;background:linear-gradient(145deg,#e9c489,#ad7a38);color:#302015;border-color:#fff0d2;box-shadow:0 8px 16px #0007}
.wheel-hub{
  width:110px;height:110px;z-index:5;
  border:5px solid #f3d3a0;
  background:radial-gradient(circle at 34% 13%,#504138,#27211e 57%,#151415);
  color:#ffe3af;box-shadow:0 5px 0 #93683c,0 12px 24px #000a,inset 0 1px 3px #ffffff20;
  pointer-events:auto;cursor:pointer;touch-action:manipulation;
  transition:transform .17s ease,filter .17s ease;
}
.wheel-hub:hover{filter:brightness(1.15)}
.wheel-hub:active{transform:translate(-50%,-50%) scale(.96)}
.wheel-hub:focus-visible{outline:3px solid #fff4d8;outline-offset:6px}
.wheel-hub b{font-family:Impact,"Arial Narrow",sans-serif;font-size:24px;color:#ffe6ba;letter-spacing:.055em}
.wheel-hub small{color:#e1b16a;font-size:24px;font-weight:900;line-height:1}
.wheel-hub:disabled{opacity:1;cursor:wait}
.wheel-hub:disabled b{font-size:22px;letter-spacing:.1em}
.wheel-hint{font-size:13px;color:#efd9be;margin:18px 0 4px;line-height:1.5;text-align:center}
.card.is-revealed{
  background:radial-gradient(ellipse at 50% 5%,#46352c,#272322 56%,#19191a);
  border-color:#b98d5880;box-shadow:0 26px 55px #3923144a,inset 0 1px 0 #ffffff1a
}
.card.is-revealed .challenge-tag{
  color:#fff5e7;background:var(--c,#b78d5c);
  border:1px solid #ffffff40;box-shadow:0 7px 21px #0003;
  padding:10px 17px;letter-spacing:.13em;font-size:11px
}
.card.is-wheel.is-revealed .txt{
  font-size:clamp(30px,8.1vw,42px);line-height:1.16;
  color:#fff7ec;letter-spacing:.003em;margin:35px 0;
  text-shadow:0 2px 14px #0003
}
.card.is-revealed .actions .btn{min-height:64px}
.card.is-revealed .actions .link{display:block;margin:7px auto 0;color:#ecd7b7}
.card.is-revealed .timer-ring{margin-top:6px;margin-bottom:16px}
.card.is-revealed .timer-challenge{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(26px,6.8vw,34px);line-height:1.13;margin:18px 0}
.card.is-wheel .wheel-wrap .wheel-hub[disabled] {animation:none}
.rulechip{margin:0 auto 14px}
@media(max-width:380px){
  .wheel-stage{width:min(100%,297px)}
  .card.is-wheel.is-pick{min-height:440px;padding:20px 13px 22px}
  .card.is-wheel.is-pick .wheel-wrap h2{font-size:29px}
  .wheel-hub{width:93px;height:93px}
  .wheel-hub b{font-size:21px}
  .wheel-hub small{font-size:21px}
  .card.is-wheel.is-revealed .txt{font-size:clamp(28px,8vw,36px)}
}
@media(max-width:340px){
  .wheel-stage{width:min(100%,264px)}
  .intensity{font-size:10px;padding:9px 1px;min-height:56px}
}
@media(prefers-reduced-motion:reduce){
  .wheel-disc{transition:none!important}
  .wheel-hub,.mode-btn{transition:none!important}
}


/* JB12 — tres modos: Torre, Individual, Completa */
.mode-individual.btn.s{

.mode-individual .mode-copy small{opacity:1;color:#65513f}
.mode-wheel .mode-copy small{color:#fff3e2;opacity:.95}
.mode-btn{min-height:75px}
.roulette-intro .intensity-preview{gap:8px;margin-top:2px}
.roulette-intro .intensity{

.individual-intro{display:flex;flex-direction:column;gap:15px}

.individual-intro>small{font-size:12px;color:#77685a;text-align:center}
.individual-intro .intensity-preview{display:block;margin:0}

.individual-intro .care{margin:2px 0}
.wheel-wrap-individual .wheel-hub-static{

.wheel-wrap-individual .wheel-hub-static b{

.wheel-wrap-individual .wheel-hub-static small{

.wheel-wrap-individual .wheel-hint{margin:14px 0 7px}
.wheel-wrap-individual .actions{margin-top:6px}
.wheel-wrap-individual .actions .btn{min-height:60px;font-size:15px;letter-spacing:.04em}
@media(max-width:380px){

 .mode-btn{min-height:69px}
 .roulette-intro .intensity{font-size:10px}
}
@media(max-width:340px){
 .individual-intro h1{font-size:42px}
 .roulette-intro .intensity-preview{gap:5px}
 .roulette-intro .intensity{font-size:9px;padding:8px 2px}
}
