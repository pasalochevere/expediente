:root{--bg:#f7f2e9;--surf:#fffdfc;--ink:#171717;--mut:#756f67;--gold:#c69a3a;--g:#5f8767;--o:#d88432;--r:#b95037}*{box-sizing:border-box}body{margin:0;background:#eee7dc;color:var(--ink);font-family:Arial,sans-serif}button{font:inherit}#app{width:min(100%,480px);min-height:100vh;margin:auto;background:var(--bg);padding:22px;box-shadow:0 0 60px #0001}h1,h2{font-family:Impact,'Arial Narrow',sans-serif;line-height:.92;margin:.25em 0}h1{font-size:clamp(43px,12vw,60px)}h1 em{color:var(--gold);font-style:normal}p{line-height:1.45}.logo{width:72px;height:72px;border-radius:50%;display:grid;place-content:center;text-align:center;background:#171717;color:#fff;border:4px solid var(--gold);font-family:Impact,sans-serif;font-size:13px;line-height:.9}.logo b{display:block}.logo i{color:var(--gold);font-style:normal}.over{font-size:11px;font-weight:900;letter-spacing:.14em;color:#946d20}.btn{width:100%;min-height:58px;border:0;border-radius:18px;padding:14px 18px;font-weight:900;letter-spacing:.04em;background:#171717;color:#fff;cursor:pointer;margin-top:10px}.btn.s{background:transparent;border:1px solid #17171733;color:#171717}.btn.g{background:var(--g)}.btn.o{background:var(--o)}.btn.r{background:var(--r)}.link{background:none;border:0;text-decoration:underline;color:var(--mut);padding:12px;cursor:pointer}.hero{display:grid;gap:18px}.pv{height:215px;display:flex;align-items:flex-end;justify-content:center;gap:28px;position:relative}.tower{width:92px;height:185px;display:flex;flex-direction:column-reverse;filter:drop-shadow(0 10px 10px #0002)}.row{display:flex;height:13px;gap:2px}.row:nth-child(even){transform:rotate(90deg) scale(.46,2.1);transform-origin:center}.blk{flex:1;border:1px solid #c79655;border-radius:3px;background:linear-gradient(#f2d7a3,#dcb679)}.bag{width:105px;height:195px;border:2px solid #7772;border-radius:15px;display:grid;place-items:end center;position:relative;background:#fff4}.bag:before{content:'';position:absolute;top:7px;left:5px;right:5px;height:5px;border-radius:9px;background:var(--gold)}.bag .tower{transform:scale(.82);transform-origin:bottom}.levels{display:grid;gap:14px;margin-top:18px}.lvl{background:var(--surf);border-radius:22px;padding:18px;border-left:6px solid var(--c);box-shadow:0 10px 30px #291e0f14}.lvl h3{margin:6px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back,.menu{width:48px;height:48px;border:0;border-radius:50%;background:#fff9;font-size:24px}.badge{display:inline-block;background:var(--c);color:#fff;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.08em}.bar{height:5px;background:#0001;border-radius:9px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:var(--c)}.card{min-height:62vh;background:var(--surf);border-radius:24px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 10px 30px #291e0f14}.card .txt{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(32px,9vw,43px);line-height:1.06;margin:auto 0}.card small{color:var(--mut)}.actions{width:100%}.rulechip{display:block;margin:0 auto 12px;border:1px solid #c69a3a66;background:#fff8e8;border-radius:99px;padding:8px 12px;font-size:11px;font-weight:900}.sheet{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:10}.sheet>div{width:min(100%,480px);max-height:82vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px}.hist article,.rule{background:var(--surf);padding:14px;border-radius:16px;margin:10px 0}.care{background:#fff8e8;border:1px solid #c69a3a66;padding:16px;border-radius:18px}.done{min-height:90vh;display:flex;flex-direction:column;justify-content:center;text-align:center}@media(max-width:360px){#app{padding:18px}.card{min-height:60vh}}

</style>
